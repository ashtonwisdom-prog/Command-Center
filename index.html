            inp.value = docTokens(pat, u.stock, inp.getAttribute("data-doc"));

          });

        box.querySelector("#dCancel").addEventListener("click", closeModal);
        box.querySelector("#dSave").addEventListener("click", function(){

            docs[inp.getAttribute("data-doc")] = v;
          });
          if (bad.length){
            box.querySelector("#fErr").textContent = bad.join(", ")+" needs to start with https://";
            return;

          closeModal(); touch();

      function cpoForm(existing){
        var isNew=!existing;
        openForm({
          title: isNew?"Add a CPO unit":"Edit "+existing.stock,
          saveLabel: isNew?"Add":"Save changes",
          value: existing?Object.assign({},existing)
                         :{id:uid(), stock:"", veh:"", miles:null, inStock:todayISO(),
                           cost:null, price:null, certExp:"", status:"On lot", note:"", docs:{}},
          fields:[
            {k:"stock",label:"Stock #",ph:"C5620A"},
            {k:"miles",label:"Miles",type:"number"},
            {k:"veh",label:"Vehicle",wide:true,ph:"2020 Mazda CX-5 Grand Touring"},
            {k:"inStock",label:"In stock since",type:"date"},
            {k:"certExp",label:"Certification expires",type:"date"},
            {k:"cost",label:"Cost",type:"number"},
            {k:"price",label:"Price",type:"number"},
            {k:"status",label:"Status",type:"select",opts:STATUS},
            {k:"note",label:"Note",wide:true},
            {k:"__s",label:"Price against cost",type:"calc",wide:true}
          ],
          live:function(o,bx){
            var el=bx.querySelector("#f___s"); if(!el) return;
            var c=n(o.cost), p2=n(o.price);
            if (c==null||p2==null){ el.innerHTML='<span class="dash">\u2014 needs both</span>'; return; }
            var sp=p2-c;
            el.innerHTML=(sp<0?'<span class="neg">':'<span>')+money(sp,2)+'</span>';
          },
          validate:function(o){
            var st=String(o.stock).trim();
            if(!st) return "Stock # is required.";
            var clash=live(ST.cpo).filter(function(x){ return x.id!==o.id && String(x.stock).toUpperCase()===st.toUpperCase(); });
            return clash.length ? st+" is already on the CPO board." : null;
          },
          onSave:function(o){
            ["miles","cost","price"].forEach(function(k){ o[k]=n(o[k]); });
            o.stock=String(o.stock).trim();
            o.docs = o.docs || {};
            stamp(o);
            if (isNew) ST.cpo.push(o);
            else { var i=ST.cpo.findIndex(function(x){return x.id===o.id;}); if(i>=0) ST.cpo[i]=o; }
          },
          onDelete: isNew?null:function(){ existing._del=true; stamp(existing); },
          deleteMsg:"Remove "+(existing?existing.stock:"")+" from the CPO board?"
        });
      }

      var add = root.querySelector("#addCpo") || root.querySelector("#cpoFirst");
      if (add) add.addEventListener("click", function(){ cpoForm(null); });
      var other = root.querySelector("#cpoFirst");
      if (other && root.querySelector("#addCpo")) other.addEventListener("click", function(){ cpoForm(null); });

      var pull = root.querySelector("#pullAging");
      if (pull) pull.addEventListener("click", function(){
        if (!window.confirm("Add "+suggestions.length+" eligible units from the aging list?\n\nStock, vehicle, miles, cost and price come across. Certification dates and documents you add afterwards.")) return;
        pushUndo();
        suggestions.forEach(function(r){
          ST.cpo.push(stamp({id:uid(), stock:r.stock, veh:r.veh, miles:r.miles,
            inStock: r.age!=null ? new Date(Date.now()-r.age*86400000).toISOString().slice(0,10) : todayISO(),
            cost:r.cost, price:r.price, certExp:"", status:"On lot", note:"", docs:{}}));
        });
        touch();
      });

      var tbl = root.querySelector("#cpotab");
      if (!tbl) return;
      var tb = tbl.querySelector("tbody"), tf = tbl.querySelector("tfoot tr");
      function rows(){
        return live(ST.cpo).map(function(u){
          return Object.assign({}, u, {days: age(u), docs_n: docCount(u)});
        });
      }
      function draw(data){
        tb.innerHTML = data.map(function(u){
          var c = certState(u);
          var have = CPO_DOCS.filter(function(k){ return u.docs && u.docs[k]; });
          return '<tr><td class="l mono"><b>'+esc(u.stock)+'</b></td>'+
            '<td class="l">'+esc(u.veh||"")+'</td>'+
            '<td class="mono">'+(u.miles==null?'\u2014':u.miles.toLocaleString("en-US"))+'</td>'+
            '<td class="mono">'+(u.days==null?'\u2014':u.days)+'</td>'+
            '<td class="mono">'+cellOr(money(u.cost))+'</td>'+
            '<td class="mono">'+cellOr(money(u.price))+'</td>'+
            '<td class="l"><span class="cert '+c.cls+'">'+esc(c.txt)+'</span></td>'+
            '<td class="l"><span class="doclist">'+
              (have.length
                ? have.map(function(k){
                    return '<a class="doc have" href="'+esc(u.docs[k])+'" target="_blank" rel="noopener">'+esc(k)+'</a>';
                  }).join("")
                : '<span class="docmiss">none attached</span>')+
              '</span></td>'+
            '<td class="l">'+esc(u.status||"")+'</td>'+
            '<td class="acts"><button class="btn sm" data-doc-e="'+esc(u.id)+'">Docs</button>'+
            '<button class="btn sm" data-e="'+esc(u.id)+'">Edit</button></td></tr>';
        }).join("");
        var tp=data.reduce(function(a,u){return a+(u.price||0);},0);
        var tc=data.reduce(function(a,u){return a+(u.cost||0);},0);
        tf.innerHTML='<td colspan="4" class="l">'+data.length+' certified units</td>'+
          '<td class="mono">'+money(tc)+'</td><td class="mono">'+money(tp)+'</td>'+
          '<td colspan="4" class="l goalfoot">'+
          data.reduce(function(a,u){return a+u.docs_n;},0)+' of '+(data.length*CPO_DOCS.length)+' documents attached</td>';
        tb.querySelectorAll("[data-e]").forEach(function(b){
          b.addEventListener("click",function(){
            cpoForm(live(ST.cpo).filter(function(x){return x.id===b.getAttribute("data-e");})[0]);
          });
        });
        tb.querySelectorAll("[data-doc-e]").forEach(function(b){
          b.addEventListener("click",function(){
            docsForm(live(ST.cpo).filter(function(x){return x.id===b.getAttribute("data-doc-e");})[0]);
          });
        });
      }
      root.querySelector("#cpoCsv").addEventListener("click",function(){
        var h=["STOCK","VEHICLE","MILES","DAYS","COST","PRICE","CERT EXPIRES","STATUS","NOTE"].concat(CPO_DOCS);
        var b=rows().map(function(u){
          return [u.stock,u.veh,u.miles,u.days,u.cost,u.price,u.certExp,u.status,u.note]
            .concat(CPO_DOCS.map(function(k){ return (u.docs&&u.docs[k])||""; }));
        });
        download("cpo-inventory-"+todayISO()+".csv", csv([h].concat(b)), "text/csv");
      });
      tableSort(tbl, rows, draw);
      draw(rows());
    }};
}

/* ============================================================
   VIEW: F&I  (finance manager performance and product penetration)
   ============================================================ */
function vFinance(){
  var D = fiDeals();
  var mgrList = live(ST.finShifts||[]);
  var mgrs = mgrList.map(function(f){ return f.name; });
  var s = ST.settings;

  function isCash(d){ return /CASH/i.test(String(d.type||"")); }
  function advEligible(d){ return d.kind==="New" || String(d.type||"").toUpperCase()==="CPO"; }
  function eligFor(k, d){
    if (k==="ba")  return advEligible(d);
    if (k==="gap") return !isCash(d);   // GAP needs a loan behind it
    return true;
  }
  function hitFor(k, d){
    if (k==="ba")  return String(d.adv||"").toUpperCase()==="YES";
    if (k==="vsc") return !!d.vsc || !!d.lr3;      // LR3 counts as a VSC
    return !!d[k];
  }
  /* The log measures in clicks, not deals — a car with both a VSC and an LR3 is
     two clicks — so a percentage can sit above 100. That is their number and it
     is a fair one, so it is reproduced rather than smoothed. */
  function clicks(list, keys){
    return list.reduce(function(a,d){
      return a + keys.filter(function(k){ return !!d[k]; }).length;
    },0);
  }
  function pen(list, k){
    var e = list.filter(function(d){ return eligFor(k,d); });
    if (k==="vsc"){
      var c = clicks(list, FI_VSC);
      return {n:c, of:list.length, pct: list.length ? c/list.length*100 : null, isClicks:true};
    }
    var h = (k==="ba" ? list : e).filter(function(d){ return hitFor(k,d); });
    return {n:h.length, of:e.length, pct: e.length ? h.length/e.length*100 : null};
  }
  function aftm(list){
    var c = clicks(list, FI_AFTM);
    return {n:c, of:list.length, pct: list.length ? c/list.length*100 : null, isClicks:true};
  }
  function prodCount(d){
    var c = FI_AFTM.concat(FI_VSC).concat(["gap"]).filter(function(k){ return !!d[k]; }).length;
    if (String(d.adv||"").toUpperCase()==="YES") c++;
    return c;
  }
  /* CAC and Choice stay out of PRU and the percentages, but each one earns the
     finance manager a bonus, so they have to be counted somewhere. */
  function bonusFor(nm){
    var b = {CAC:0, CHOICE:0, total:0};
    fiExcluded().forEach(function(d){
      if (d.fi !== nm) return;
      var t = String(d.type||"").toUpperCase().trim();
      if (b[t] === undefined) b[t] = 0;
      b[t]++; b.total++;
    });
    return b;
  }
  function back(list){ return list.reduce(function(a,d){ return a+(n(d.back)||0); },0); }

  var el = Math.max(1, liveDaysElapsed()||1), tot = liveDaysTotal()||1;
  var deptBack = back(D);
  var deptPru  = D.length ? deptBack/D.length : 0;
  var deptGoal = s.fiDeptGoal || 0;
  var proj     = s.fiProjDeals || 0;
  var remDeals = Math.max(0, proj - D.length);
  var grossNeed = Math.max(0, deptGoal - deptBack);
  var pruNeed  = remDeals ? grossNeed/remDeals : 0;

  var assigned = D.filter(function(d){ return d.fi; });
  var unassigned = D.length - assigned.length;
  var cash = D.filter(isCash).length;

  var TARGET = {ba:70, gap:50, vsc:55, lr3:25, tw:25, key:20, app:25, wind:20};
  function cls(pct, t){ return pct==null ? "" : pct>=t ? "good" : pct>=t*0.8 ? "mid" : ""; }
  function penCell(o, t){
    if (o.pct==null) return '<span class="dash">\u2014</span>';
    return '<span class="penbar"><span class="pb"><i class="'+cls(o.pct,t)+'" style="width:'+
      Math.min(100,o.pct).toFixed(0)+'%"></i></span><span class="pn">'+o.pct.toFixed(0)+'%</span></span>';
  }

  var rows = mgrList.map(function(m){
    var mine = D.filter(function(d){ return d.fi===m.name; });
    var o = {name:m.name, id:m.id, goal:m.goal||0, deals:mine.length,
             back:back(mine), pvr: mine.length? back(mine)/mine.length : 0,
             cash: mine.filter(isCash).length,
             prod: mine.length ? mine.reduce(function(a,d){ return a+prodCount(d); },0)/mine.length : 0};
    o.finPct = mine.length ? (mine.length-o.cash)/mine.length*100 : null;
    o.toGoal = Math.max(0, o.goal - o.back);
    o.bonus = bonusFor(m.name);
    FI_PRODUCTS.forEach(function(p){ o[p.k] = pen(mine, p.k); o[p.k+"p"] = o[p.k].pct; });
    o.bonusN = bonusFor(m.name).total;
    o.aftm = aftm(mine); o.aftmp = o.aftm.pct;
    return o;
  }).sort(function(a,b){ return b.back-a.back; });

  var core = FI_PRODUCTS.filter(function(p){ return p.core; });
  var extra = FI_PRODUCTS.filter(function(p){ return !p.core; });

  return { html: head("F&I","Desk.",
      "Back-end gross, per-unit and product penetration \u2014 the finance log, live off the deal log.",["Live"])+
    sessionBanner()+
    (unassigned
      ? '<div class="banner"><b>'+unassigned+' of '+D.length+' deals have no finance manager on them.</b> '+
        'They count in the department totals but cannot be credited to anyone. The finance manager is on the deal form.</div>'
      : "")+

    '<div class="strip">'+
      '<div class="tile"><div class="eyebrow">Department gross</div><div class="k num">'+money(deptBack)+'</div>'+
        '<dl><dt>Goal</dt><dd>'+money(deptGoal)+'</dd>'+
        '<dt>'+(grossNeed? "Still needed" : "Over goal")+'</dt>'+
        '<dd'+(grossNeed?'':' style="color:var(--go)"')+'>'+
          money(grossNeed || (deptBack-deptGoal))+'</dd>'+
        '<dt>At pace</dt><dd>'+money(deptBack/el*tot)+'</dd></dl></div>'+
      '<div class="tile"><div class="eyebrow">Department PRU</div><div class="k num">'+money(deptPru)+'</div>'+
        '<dl><dt>Deals</dt><dd>'+D.length+' of '+proj+'</dd>'+
        '<dt>'+(remDeals? "PRU needed" : "Plan")+'</dt>'+
        '<dd>'+(remDeals? money(pruNeed) : (proj? "all written" : "not set"))+'</dd>'+
        '<dt>Remaining</dt><dd>'+remDeals+'</dd></dl></div>'+
      '<div class="tile"><div class="eyebrow">Finance mix</div><div class="k num">'+
        (D.length? Math.round((D.length-cash)/D.length*100) : 0)+'%</div>'+
        '<dl><dt>Financed</dt><dd>'+(D.length-cash)+'</dd><dt>Cash</dt><dd>'+cash+'</dd></dl></div>'+
      '<div class="tile"><div class="eyebrow">Products a deal</div><div class="k num">'+
        (D.length? (D.reduce(function(a,d){ return a+prodCount(d); },0)/D.length).toFixed(2) : "0.00")+'</div>'+
        '<dl><dt>Zero back gross</dt><dd>'+D.filter(function(d){ return (n(d.back)||0)===0; }).length+'</dd></dl></div>'+
    '</div>'+

    '<h2 class="sec">Penetration</h2>'+
    '<div class="pen">'+core.map(function(p){
      var o = pen(D, p.k), t = TARGET[p.k];
      return '<div class="pcell"><div class="pl">'+esc(p.full)+'</div>'+
        '<div class="pv">'+(o.pct==null?"\u2014":o.pct.toFixed(0)+"%")+'</div>'+
        '<div class="pd">'+o.n+(o.isClicks? ' sold across '+o.of+' deals' : ' of '+o.of+' eligible')+'</div>'+
        '<div class="pring"><i class="'+cls(o.pct,t)+'" style="width:'+(o.pct==null?0:Math.min(100,o.pct)).toFixed(0)+'%"></i>'+
        '<b style="left:'+t+'%"></b></div>'+
        '<div class="pt">Target '+t+'%'+(o.pct!=null? ' \u00b7 '+(o.pct>=t?'<span style="color:var(--go)">at it</span>':
          '<span style="color:var(--soul)">'+Math.round(t-o.pct)+' short</span>') : '')+'</div></div>';
    }).join("")+
      (function(){
        var o = aftm(D);
        return '<div class="pcell"><div class="pl">Aftermarket \u2014 any</div>'+
          '<div class="pv">'+(o.pct==null?"\u2014":o.pct.toFixed(0)+"%")+'</div>'+
          '<div class="pd">'+o.n+' sold across '+o.of+' deals</div>'+
          '<div class="pring"><i class="'+cls(o.pct,35)+'" style="width:'+(o.pct==null?0:Math.min(100,o.pct)).toFixed(0)+'%"></i>'+
          '<b style="left:35%"></b></div>'+
          '<div class="pt">Tire and wheel, key, appearance, windshield</div></div>';
      })()+
    '</div>'+
    '<p class="hint">VSC counts LR3 alongside it, the way the finance log does, and both VSC and aftermarket are measured in products sold rather than deals touched \u2014 so a car carrying two can push the figure past 100%. GAP counts against non-cash deals only, since it needs a loan behind it. Beasley Advantage uses the workbook rule: every new deal plus every used CPO.</p>'+

    '<h2 class="sec">Products, one by one</h2>'+
    '<div class="pen">'+extra.map(function(p){
      var o = pen(D, p.k), t = TARGET[p.k];
      return '<div class="pcell"><div class="pl">'+esc(p.full)+'</div>'+
        '<div class="pv">'+(o.pct==null?"\u2014":o.pct.toFixed(0)+"%")+'</div>'+
        '<div class="pd">'+o.n+' of '+o.of+'</div>'+
        '<div class="pring"><i class="'+cls(o.pct,t)+'" style="width:'+(o.pct==null?0:Math.min(100,o.pct)).toFixed(0)+'%"></i>'+
        '<b style="left:'+t+'%"></b></div></div>';
    }).join("")+'</div>'+

    (fiExcluded().length
      ? '<div class="warn"><b>'+fiExcluded().length+' deals are off the desk\u2019s numbers</b> \u2014 '+
        esc(fiExcludedTypes().join(" and "))+
        '. They count in full for the store and the salesperson; they are just not F&amp;I\u2019s to answer for.</div>'
      : "")+

    '<h2 class="sec">By finance manager</h2><div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">'+esc(s.monthLabel)+'</div><h3>'+mgrs.length+' on the desk</h3></div>'+
    '<div><button class="btn" id="fiGoals">Goals</button> '+
    '<button class="btn" id="setNR">Which types count</button> '+
    '<button class="btn" id="fiCsv">Export CSV</button></div></div>'+
    '<div class="tablewrap"><table id="fitab"><thead><tr>'+
      '<th class="l sortable" data-k="name" data-t="s">Manager</th>'+
      '<th class="sortable" data-k="deals">Deals</th>'+
      '<th class="sortable" data-k="back">Gross</th>'+
      '<th class="sortable" data-k="pvr">PRU</th>'+
      '<th class="sortable" data-k="toGoal">To goal</th>'+
      '<th class="sortable" data-k="finPct">Fin %</th>'+
      '<th class="sortable" data-k="prod">Prod/deal</th>'+
      '<th class="sortable" data-k="bonusN">Bonus deals</th>'+
      core.map(function(p){ return '<th class="sortable" data-k="'+p.k+'p">'+esc(p.label)+'</th>'; }).join("")+
      '<th class="sortable" data-k="aftmp">Aftm</th>'+
      '</tr></thead><tbody></tbody><tfoot><tr></tr></tfoot></table></div>'+
    '<p class="note">A manager with no deals shows dashes rather than zeros \u2014 there is a difference between selling nothing and not being credited.</p></div>',

    init:function(root){
      var tb=root.querySelector("#fitab tbody"), tf=root.querySelector("#fitab tfoot tr");
      function draw(list){
        tb.innerHTML = list.map(function(r){
          if (!r.deals && !r.bonus.total){
            return '<tr><td class="l"><b>'+esc(r.name)+'</b></td>'+
              '<td colspan="'+(7+core.length+1)+'" class="l"><span class="dash">no deals credited yet \u00b7 goal '+
              esc(money(r.goal))+'</span></td></tr>';
          }
          return '<tr><td class="l"><b>'+esc(r.name)+'</b></td>'+
            '<td class="mono">'+r.deals+'</td>'+
            '<td class="mono">'+money(r.back)+'</td>'+
            '<td class="mono"><b>'+money(r.pvr)+'</b></td>'+
            '<td class="mono">'+(r.goal? money(r.toGoal) : '<span class="dash">\u2014</span>')+'</td>'+
            '<td class="mono">'+(r.finPct==null?'\u2014':Math.round(r.finPct)+'%')+'</td>'+
            '<td class="mono">'+r.prod.toFixed(2)+'</td>'+
            '<td class="mono">'+(r.bonus.total
              ? '<b>'+r.bonus.total+'</b><small style="color:var(--steel-dim);display:block;font-size:.62rem">'+
                Object.keys(r.bonus).filter(function(k){ return k!=="total" && r.bonus[k]; })
                  .map(function(k){ return r.bonus[k]+" "+k; }).join(" \u00b7 ")+'</small>'
              : '<span class="dash">\u2014</span>')+'</td>'+
            core.map(function(p){ return '<td>'+penCell(r[p.k], TARGET[p.k])+'</td>'; }).join("")+
            '<td>'+penCell(r.aftm, 35)+'</td></tr>';
        }).join("");
        var td=list.reduce(function(a,r){return a+r.deals;},0);
        var tg=list.reduce(function(a,r){return a+r.back;},0);
        tf.innerHTML='<td class="l">Assigned</td><td class="mono">'+td+'</td>'+
          '<td class="mono">'+money(tg)+'</td><td class="mono">'+money(td?tg/td:0)+'</td>'+
          '<td class="mono">'+money(Math.max(0, list.reduce(function(a,r){return a+(r.goal||0);},0)-tg))+'</td>'+
          '<td></td><td class="mono">'+(td? (assigned.reduce(function(a,d){return a+prodCount(d);},0)/td).toFixed(2):'\u2014')+'</td>'+
          '<td class="mono">'+list.reduce(function(a,r){return a+r.bonus.total;},0)+'</td>'+
          core.map(function(p){ return '<td>'+penCell(pen(assigned,p.k), TARGET[p.k])+'</td>'; }).join("")+
          '<td>'+penCell(aftm(assigned), 35)+'</td>';
      }
      function data(){ return rows; }

      root.querySelector("#fiGoals").addEventListener("click", function(){
        openForm({
          title:"F&I goals",
          sub:"The department goal and how many deals the month is projected to write. Each manager also carries their own.",
          saveLabel:"Save",
          value: mgrList.reduce(function(a,m,i){ a["m"+i] = m.goal||0; return a; },
                   {dept: s.fiDeptGoal||0, proj: s.fiProjDeals||0}),
          fields: [
            {k:"dept",label:"Department gross goal",type:"number"},
            {k:"proj",label:"Projected deals this month",type:"number"}
          ].concat(mgrList.map(function(m,i){
            return {k:"m"+i, label:m.name+" gross goal", type:"number"};

      root.querySelector("#setNR").addEventListener("click",function(){

          live:function(o,bx){

            var off = keys.filter(function(k){ return o[slug[k]]; });
            var kept = ACT().deals.filter(function(d){ return off.indexOf(String(d.type||"").toUpperCase().trim())<0; });
            var g = kept.reduce(function(a,d){ return a+(n(d.back)||0); },0);
            e2.innerHTML='<span style="font:400 .84rem/1.5 \'IBM Plex Sans\',sans-serif">'+
              kept.length+' deals on the desk \u00b7 '+esc(money(g))+' \u00b7 '+
              esc(money(kept.length? g/kept.length : 0))+' PRU</span>';

          onSave:function(o){
            pushUndo();
            ST.settings = stamp(Object.assign({}, ST.settings,
              {nonRetail: keys.filter(function(k){ return o[slug[k]]; })}));

      root.querySelector("#fiCsv").addEventListener("click",function(){
        var h=["MANAGER","DEALS","GROSS","PRU","GOAL","TO GOAL","FIN %","PROD/DEAL"]

        var b=rows.map(function(r){

                  r.finPct==null?"":Math.round(r.finPct), r.prod.toFixed(2)]
            .concat(FI_PRODUCTS.map(function(p){ return r[p.k].pct==null?"":r[p.k].pct.toFixed(1); }))
            .concat([r.aftm.pct==null?"":r.aftm.pct.toFixed(1)]);
        });

      tableSort(root.querySelector("#fitab"), data, draw);
      draw(rows);
    }};

/* ============================================================
   VIEW: CIT  (contracts in transit)
   ============================================================ */
var CIT_STATES = [
  {k:"",       label:"Not sent", cls:""},
  {k:"sent",   label:"Sent",     cls:"sent"},
  {k:"stips",  label:"Stips",    cls:"stips"},
  {k:"funded", label:"Funded",   cls:"funded"},
  {k:"kicked", label:"Kicked",   cls:"kicked"}
];
/* Only a financed deal can be in transit — a cash deal has nothing to fund. */
function citEligible(d){
  var t = String(d.type||"").toUpperCase();
  return !/CASH/.test(t);
}
function citAge(d){
  if (!d.citSent) return null;
  var a = new Date(d.citSent+"T12:00:00");
  var b = d.cit==="funded" && d.citFunded ? new Date(d.citFunded+"T12:00:00") : new Date();
  var n2 = Math.floor((b-a)/86400000);
  return isNaN(n2) ? null : Math.max(0, n2);
}

function vCit(){
  ST._citScope = ST._citScope || "open";
  ST._citQ = ST._citQ || "";
  var all = ACT().deals.filter(citEligible);
  var open = all.filter(function(d){ return d.cit && d.cit!=="funded"; });
  var notSent = all.filter(function(d){ return !d.cit; });
  var funded = all.filter(function(d){ return d.cit==="funded"; });

  function amt(d){ return n(d.citAmt)||0; }
  var outstanding = open.reduce(function(a,d){ return a+amt(d); },0);

  var bands = [
    {label:"0\u20137 days",   cls:"ok",   test:function(a){ return a!=null && a<=7; }},
    {label:"8\u201314 days",  cls:"warn", test:function(a){ return a!=null && a>7 && a<=14; }},
    {label:"15\u201329 days", cls:"bad",  test:function(a){ return a!=null && a>14 && a<=29; }},
    {label:"30+ days",         cls:"bad",  test:function(a){ return a!=null && a>=30; }}
  ];

  var lenders = {};
  open.forEach(function(d){
    var L = String(d.citLender||"\u2014").trim().toUpperCase() || "\u2014";
    lenders[L] = lenders[L] || {n:0, amt:0, oldest:0};
    lenders[L].n++; lenders[L].amt += amt(d);
    var a = citAge(d); if (a!=null && a>lenders[L].oldest) lenders[L].oldest = a;
  });

  var known = {};
  ACT().deals.forEach(function(d){ if (d.citLender) known[String(d.citLender).trim().toUpperCase()]=1; });
  ["SANTANDER","CAPITAL ONE","MAZDA FINANCIAL","CHASE","ALLY","RBFCU","UFCU","WELLS FARGO","US BANK"]
    .forEach(function(k){ known[k]=1; });
  var lenderList = Object.keys(known).sort();

  var avgAge = (function(){
    var xs = open.map(citAge).filter(function(x){ return x!=null; });
    return xs.length ? Math.round(xs.reduce(function(a,b){return a+b;},0)/xs.length) : null;
  })();

  return { html: head("Contracts","in Transit.",
      "Deals clicked over to the bank and waiting on proceeds. Age is what costs you here.",["Live"])+
    sessionBanner()+

    '<div class="strip">'+
      '<div class="tile"><div class="eyebrow">Outstanding</div><div class="k num">'+money(outstanding)+'</div>'+
        '<dl><dt>Contracts</dt><dd>'+open.length+'</dd>'+
        '<dt>Average age</dt><dd>'+(avgAge==null?"\u2014":avgAge+" d")+'</dd></dl></div>'+
      '<div class="tile"><div class="eyebrow">Waiting on stips</div><div class="k num">'+
        open.filter(function(d){ return d.cit==="stips"; }).length+'</div>'+
        '<dl><dt>Kicked back</dt><dd'+(open.filter(function(d){return d.cit==="kicked";}).length?' style="color:var(--soul)"':'')+'>'+
        open.filter(function(d){ return d.cit==="kicked"; }).length+'</dd></dl></div>'+
      '<div class="tile"><div class="eyebrow">Not sent yet</div><div class="k num">'+notSent.length+'</div>'+
        '<dl><dt>Financed deals</dt><dd>'+all.length+'</dd></dl></div>'+
      '<div class="tile"><div class="eyebrow">Funded this month</div><div class="k num">'+funded.length+'</div>'+
        '<dl><dt>Proceeds</dt><dd>'+money(funded.reduce(function(a,d){ return a+amt(d); },0))+'</dd></dl></div>'+
    '</div>'+

    '<h2 class="sec">How old</h2>'+
    '<div class="agebands">'+bands.map(function(b){
      var l = open.filter(function(d){ return b.test(citAge(d)); });
      return '<div class="band '+(l.length?b.cls:"")+'"><div class="bl">'+esc(b.label)+'</div>'+
        '<div class="bn">'+l.length+'</div>'+
        '<div class="bd">'+money(l.reduce(function(a,d){ return a+amt(d); },0))+'</div></div>';
    }).join("")+'</div>'+
    '<p class="hint">A contract sitting past two weeks is usually missing something rather than slow. Anything in the last two bands is worth a call today.</p>'+

    (Object.keys(lenders).length
      ? '<h2 class="sec">By lender</h2><div class="panel"><div class="tablewrap"><table><thead><tr>'+
        '<th class="l">Lender</th><th>Contracts</th><th>Outstanding</th><th>Oldest</th>'+
        '</tr></thead><tbody>'+
        Object.keys(lenders).sort(function(a,b){ return lenders[b].amt-lenders[a].amt; }).map(function(k){
          var v=lenders[k];
          return '<tr><td class="l"><b>'+esc(k)+'</b></td><td class="mono">'+v.n+'</td>'+
            '<td class="mono">'+money(v.amt)+'</td>'+
            '<td class="mono"><span class="dayspill'+(v.oldest>=15?" bad":v.oldest>=8?" warn":"")+'">'+
            v.oldest+' d</span></td></tr>';
        }).join("")+'</tbody></table></div></div>'
      : "")+

    '<h2 class="sec">The board</h2><div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">'+esc(ST.settings.monthLabel)+'</div><h3>Contracts</h3></div>'+
    '<div><button class="btn" id="citCsv">Export CSV</button></div></div>'+
    '<div class="ctl">'+
      '<div class="seg" id="citf" role="group" aria-label="Which contracts">'+
        ["open","notsent","funded","all"].map(function(k,i){
          var lbl = ["Outstanding","Not sent","Funded","All"][i];
          return '<button data-v="'+k+'" aria-pressed="'+(ST._citScope===k?"true":"false")+'">'+lbl+'</button>';
        }).join("")+'</div>'+
      '<input class="search" id="citq" type="search" value="'+esc(ST._citQ)+'" placeholder="Search customer, deal #, lender\u2026">'+
      '<span class="count" id="citc"></span></div>'+
    '<p class="note">Tap the status to move a contract along: not sent \u2192 sent \u2192 stips \u2192 funded \u2192 kicked back. Sending stamps today\u2019s date, funding stops the clock.</p>'+
    '<div class="tablewrap tall"><table id="cittab"><thead><tr>'+
      '<th class="l sortable" data-k="deal" data-t="s">Deal #</th>'+
      '<th class="l sortable" data-k="customer" data-t="s">Customer</th>'+
      '<th class="l sortable" data-k="fi" data-t="s">F&amp;I</th>'+
      '<th class="l">Lender</th>'+
      '<th class="sortable" data-k="amtN">Amount</th>'+
      '<th class="l">Status</th>'+
      '<th class="l sortable" data-k="citSent" data-t="s">Sent</th>'+
      '<th class="sortable" data-k="age">Days</th>'+
      '<th class="l">Waiting on</th>'+
      '</tr></thead><tbody></tbody><tfoot><tr></tr></tfoot></table></div></div>'+
    '<datalist id="lenders">'+lenderList.map(function(l){ return '<option value="'+esc(l)+'">'; }).join("")+'</datalist>',

    init:function(root){
      var scope=ST._citScope;
      function rows(){
        var q=root.querySelector("#citq").value.trim().toUpperCase();
        ST._citQ = root.querySelector("#citq").value;
        return all.map(function(d){
          return Object.assign({}, d, {age:citAge(d), amtN:n(d.citAmt)||0});
        }).filter(function(d){
          if (scope==="open"    && !(d.cit && d.cit!=="funded")) return false;
          if (scope==="notsent" && d.cit) return false;
          if (scope==="funded"  && d.cit!=="funded") return false;
          if (q && [d.deal,d.customer,d.citLender,d.fi,d.citStip].join(" ").toUpperCase().indexOf(q)<0) return false;
          return true;
        }).sort(function(a,b){ return (b.age||0)-(a.age||0); });
      }
      var tb=root.querySelector("#cittab tbody"), tf=root.querySelector("#cittab tfoot tr");
      function findDeal(id){ return ACT().deals.filter(function(x){ return x.id===id; })[0]; }
      function stateOf(d){
        return CIT_STATES.filter(function(x){ return x.k===(d.cit||""); })[0] || CIT_STATES[0];
      }
      function rowHtml(d){
        var st = stateOf(d), a = d.age;
        return '<tr data-row="'+esc(d.id)+'">'+
          '<td class="l mono"><b>'+esc(d.deal)+'</b></td>'+
          '<td class="l">'+(d.customer?esc(d.customer):'<span class="dash">\u2014</span>')+'</td>'+
          '<td class="l">'+(d.fi?esc(d.fi):'<span class="dash">\u2014</span>')+'</td>'+
          '<td class="l"><input class="lendin" list="lenders" data-lend="'+esc(d.id)+'" value="'+
            esc(d.citLender||"")+'" placeholder="Lender"></td>'+
          '<td><input class="gin" type="text" inputmode="decimal" data-amt="'+esc(d.id)+'" value="'+
            esc(d.citAmt!=null&&d.citAmt!==""?String(d.citAmt):"")+'" placeholder="0"></td>'+
          '<td class="l"><button type="button" class="cstat '+st.cls+'" data-st="'+esc(d.id)+'">'+esc(st.label)+'</button></td>'+
          '<td class="l mono">'+(d.citSent?esc(showDate(d.citSent)):'<span class="dash">\u2014</span>')+'</td>'+
          '<td><span class="dayspill'+(a==null?"":a>=15?" bad":a>=8?" warn":"")+'">'+
            (a==null?'\u2014':a)+'</span></td>'+
          '<td class="l"><input class="stipin" data-stip="'+esc(d.id)+'" value="'+esc(d.citStip||"")+
            '" placeholder="'+(d.cit==="stips"||d.cit==="kicked"?"What is missing?":"\u2014")+'"></td></tr>';
      }
      function totals(list){
        var o = list.filter(function(d){ return d.cit && d.cit!=="funded"; });
        root.querySelector("#citc").textContent =
          list.length+" contracts \u00b7 "+money(list.reduce(function(a,d){ return a+d.amtN; },0));
        tf.innerHTML = '<td colspan="4" class="l">'+list.length+' shown</td>'+
          '<td class="mono"><b>'+money(list.reduce(function(a,d){ return a+d.amtN; },0))+'</b></td>'+
          '<td colspan="2" class="l goalfoot">'+o.length+' still outstanding</td>'+
          '<td class="mono">'+(o.length? Math.max.apply(null, o.map(function(d){ return d.age||0; }))+" d max" : "\u2014")+'</td><td></td>';
      }
      function draw(list){
        tb.innerHTML = list.map(rowHtml).join("");
        totals(list);
        wire();
      }
      function refresh(){ draw(rows()); }
      function save(d, heavy){
        stamp(d); Persist.save(); Sync.nudge(); invalidate("command"); invalidate("finance");
        // anything that moves the totals needs the whole view again, not just the rows
        if (heavy){
          var sec = build("cit"); sec.classList.add("on");
          document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("on", v===sec); });
        }
      }
      function wire(){
        tb.querySelectorAll("[data-st]").forEach(function(b){
          b.addEventListener("click", function(){
            var d=findDeal(b.getAttribute("data-st")); if(!d) return;
            var order = CIT_STATES.map(function(x){ return x.k; });
            var i = order.indexOf(d.cit||"");
            d.cit = order[(i<0?0:i+1) % order.length];
            // the clock starts when it goes out and stops when the money lands
            if (d.cit==="sent" && !d.citSent) d.citSent = todayISO();
            if (d.cit==="funded") d.citFunded = todayISO();
            if (d.cit==="") { d.citSent=""; d.citFunded=""; }
            save(d, true);
          });
        });
        tb.querySelectorAll("[data-lend]").forEach(function(i2){
          i2.addEventListener("change", function(){
            var d=findDeal(i2.getAttribute("data-lend")); if(!d) return;
            d.citLender = String(i2.value||"").trim().toUpperCase(); save(d, true);
          });
        });
        tb.querySelectorAll("[data-amt]").forEach(function(i2){
          i2.addEventListener("change", function(){
            var d=findDeal(i2.getAttribute("data-amt")); if(!d) return;
            d.citAmt = n(i2.value); save(d, true);
          });
        });
        tb.querySelectorAll("[data-stip]").forEach(function(i2){
          i2.addEventListener("change", function(){
            var d=findDeal(i2.getAttribute("data-stip")); if(!d) return;
            d.citStip = String(i2.value||"").trim(); save(d);
          });
        });
      }
      root.querySelectorAll("#citf button").forEach(function(b){
        b.addEventListener("click", function(){
          root.querySelectorAll("#citf button").forEach(function(o){ o.setAttribute("aria-pressed", o===b?"true":"false"); });
          scope=b.getAttribute("data-v"); ST._citScope=scope; refresh();
        });
      });
      root.querySelector("#citq").addEventListener("input", refresh);
      root.querySelector("#citCsv").addEventListener("click", function(){
        var h=["DEAL #","CUSTOMER","F&I","LENDER","AMOUNT","STATUS","SENT","DAYS","WAITING ON"];
        var b=rows().map(function(d){
          return [d.deal,d.customer,d.fi,d.citLender,d.amtN,stateOf(d).label,showDate(d.citSent),d.age,d.citStip];
        });
        download("cit-"+todayISO()+".csv", csv([h].concat(b)), "text/csv");
      });
      tableSort(root.querySelector("#cittab"), rows, draw);
      refresh();
    }};
}

/* ============================================================
   VIEW: F&I LOG  (each manager fills in their own deals)
   ============================================================ */
function vFiLog(){
  var mgrList = live(ST.finShifts||[]);
  var s = ST.settings;

  ST._fiWho = ST._fiWho || (whoAmI() && mgrList.some(function(m){ return m.name.toUpperCase()===whoAmI().toUpperCase(); })
    ? mgrList.filter(function(m){ return m.name.toUpperCase()===whoAmI().toUpperCase(); })[0].name
    : (mgrList[0]||{}).name || "");

  function isCash(d){ return /CASH/i.test(String(d.type||"")); }
  function advEligible(d){ return d.kind==="New" || String(d.type||"").toUpperCase()==="CPO"; }
  function prodCount(d){
    var c = FI_AFTM.concat(FI_VSC).concat(["gap"]).filter(function(k){ return !!d[k]; }).length;
    if (String(d.adv||"").toUpperCase()==="YES") c++;
    return c;
  }
  /* Every deal shows here, including CAC and Choice — those earn a bonus, so a
     manager has to be able to claim them even though they carry no PRU. */
  function mine(who){
    return ACT().deals.filter(function(d){
      return who==="__none" ? !d.fi : d.fi===who;
    }).sort(function(a,b){ return (a.date<b.date?1:a.date>b.date?-1:0); });
  }
  function bonusDeal(d){ return !countsForFI(d); }

  var who = ST._fiWho;
  var list = mine(who);
  var unassigned = ACT().deals.filter(function(d){ return !d.fi; }).length;
  var rec = mgrList.filter(function(m){ return m.name===who; })[0];

  var counted = list.filter(function(d){ return !bonusDeal(d); });
  var bonus   = list.filter(bonusDeal);
  var back = counted.reduce(function(a,d){ return a+(n(d.back)||0); },0);
  var pru  = counted.length ? back/counted.length : 0;
  var goal = (rec && rec.goal) || 0;
  var done = counted.filter(function(d){ return prodCount(d)>0 || (n(d.back)||0)>0; }).length;

  return { html: head("F&I","Log.",
      "Pick your name, then tick what went on each deal. Everything here writes straight through to the desk numbers.",["Live"])+
    sessionBanner()+

    '<div class="whobar">'+
      '<select id="fiWho" aria-label="Which finance manager">'+
        mgrList.map(function(m){
          var l = mine(m.name), bn = l.filter(bonusDeal).length;
          return '<option value="'+esc(m.name)+'"'+(m.name===who?" selected":"")+'>'+esc(m.name)+
            ' \u00b7 '+(l.length-bn)+' deals'+(bn? ' + '+bn+' bonus':'')+'</option>';
        }).join("")+
        '<option value="__none"'+(who==="__none"?" selected":"")+'>Unassigned \u00b7 '+unassigned+' deals</option>'+
      '</select>'+
      '<span class="spacer"></span>'+
      (who==="__none" && unassigned
        ? '<select class="pick" id="claimTo">'+mgrList.map(function(m){
            return '<option value="'+esc(m.name)+'">'+esc(m.name)+'</option>'; }).join("")+'</select>'+
          '<button class="btn primary" id="claimAll">Assign the ticked ones</button>'
        : '')+
    '</div>'+

    (who==="__none"
      ? '<div class="banner"><b>These deals have nobody on them yet.</b> Tick the ones that are yours and assign them, or set the finance manager on the deal itself.</div>'
      : '<div class="minicards">'+
          '<div class="mini"><div class="ml">Deals</div><div class="mv">'+counted.length+'</div>'+
            '<div class="md">'+done+' filled in</div></div>'+
          '<div class="mini"><div class="ml">Bonus deals</div><div class="mv">'+bonus.length+'</div>'+
            '<div class="md">'+(bonus.length
              ? esc(Object.keys(bonus.reduce(function(a,d){ a[d.type]=1; return a; },{})).join(", "))
              : "CAC and Choice")+'</div></div>'+
          '<div class="mini"><div class="ml">Gross</div><div class="mv">'+money(back)+'</div>'+
            '<div class="md">'+(goal? money(Math.max(0,goal-back))+" to goal" : "no goal set")+'</div></div>'+
          '<div class="mini"><div class="ml">PRU</div><div class="mv">'+money(pru)+'</div>'+
            '<div class="md">per deal</div></div>'+
          '<div class="mini"><div class="ml">Products a deal</div><div class="mv">'+
            (counted.length? (counted.reduce(function(a,d){ return a+prodCount(d); },0)/counted.length).toFixed(2) : "0.00")+
            '</div><div class="md">on counted deals</div></div>'+
        '</div>')+

    '<div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">'+esc(s.monthLabel)+'</div>'+
      '<h3>'+(who==="__none" ? "Unassigned" : esc(who))+'</h3></div>'+
      '<div><span class="count" id="fiCount"></span></div></div>'+
    (list.length
      ? '<p class="note">Tap a product to turn it on. Beasley cycles yes \u2192 no \u2192 DNQ. Back gross is editable in place \u2014 it saves as you leave the box.</p>'+
        '<div class="tablewrap tall"><table id="fltab"><thead><tr>'+
          (who==="__none"?'<th class="chk"><input type="checkbox" id="flAll" aria-label="Select all"></th>':'')+
          '<th class="l">Date</th><th class="l">Deal #</th><th class="l">Customer</th>'+
          '<th class="l">Type</th><th>Back gross</th>'+
          '<th class="l">Products</th><th>#</th>'+
          '</tr></thead><tbody></tbody><tfoot><tr></tr></tfoot></table></div>'
      : '<div class="today-empty"><p>'+(who==="__none"
          ? "Every deal has a finance manager on it."
          : "No deals are assigned to "+esc(who)+" yet. They are set on the deal itself, or claim them from the Unassigned list above.")+
        '</p></div>')+
    '</div>',

    init:function(root){
      root.querySelector("#fiWho").addEventListener("change", function(){
        ST._fiWho = this.value;
        var sec = build("filog"); sec.classList.add("on");
        document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("on", v===sec); });
      });

      var tbl = root.querySelector("#fltab");
      if (!tbl) return;
      var tb = tbl.querySelector("tbody"), tf = tbl.querySelector("tfoot tr");
      var picked = {};
      var cols = (who==="__none") ? 8 : 7;

      function baChip(d){
        var v = String(d.adv||"DNQ").toUpperCase();
        var cls = v==="YES" ? "ba-yes" : v==="NO" ? "ba-no" : "ba-dnq";
        var lbl = v==="YES" ? "BA" : v==="NO" ? "BA" : "BA";
        return '<button type="button" class="chip-p '+cls+'" data-ba="'+esc(d.id)+'" '+
          'title="Beasley Advantage: '+esc(v)+(advEligible(d)?"":" \u2014 not an eligible deal")+'">'+lbl+'</button>';
      }
      function chips(d){
        if (bonusDeal(d)){
          return '<span class="docmiss">bonus deal \u2014 no products tracked</span>';
        }
        var out = baChip(d);
        FI_PRODUCTS.forEach(function(p){
          if (p.k==="ba") return;
          var on = !!d[p.k];
          var dim = (p.k==="gap" && isCash(d)) ? ' title="GAP needs a loan behind it"' : ' title="'+esc(p.full)+'"';
          out += '<button type="button" class="chip-p'+(on?" on":"")+'" data-p="'+p.k+'" data-id="'+esc(d.id)+'"'+dim+'>'+
            esc(p.label)+'</button>';
        });
        return out;
      }
      function totals(){
        var l = mine(ST._fiWho);
        var c = l.filter(function(d){ return !bonusDeal(d); });
        var bn = l.length - c.length;
        var g = c.reduce(function(a,d){ return a+(n(d.back)||0); },0);
        tf.innerHTML = (who==="__none"?'<td></td>':'')+
          '<td colspan="4" class="l">'+c.length+' counted'+(bn? ' \u00b7 '+bn+' bonus':'')+'</td>'+
          '<td class="mono"><b>'+money(g)+'</b></td>'+
          '<td class="l goalfoot">PRU '+money(c.length? g/c.length : 0)+'</td>'+
          '<td class="mono">'+c.reduce(function(a,d){ return a+prodCount(d); },0)+'</td>';
        root.querySelector("#fiCount").textContent =
          c.length+" counted \u00b7 "+money(g)+" \u00b7 "+money(c.length? g/c.length : 0)+" PRU"+
          (bn? " \u00b7 "+bn+" bonus" : "");
      }
      function rowHtml(d){
        return '<tr data-row="'+esc(d.id)+'">'+
          (who==="__none"?'<td class="chk"><input type="checkbox" data-pick="'+esc(d.id)+'"'+(picked[d.id]?" checked":"")+'></td>':'')+
          '<td class="l mono">'+esc(showDate(d.date))+'</td>'+
          '<td class="l mono">'+esc(d.deal)+'</td>'+
          '<td class="l">'+(d.customer?esc(d.customer):'<span class="dash">\u2014</span>')+'</td>'+
          '<td class="l">'+esc(d.type)+'<span class="tag '+(d.kind==="New"?"n":"u")+'">'+esc(d.kind)+'</span>'+
            (bonusDeal(d)?'<span class="tag house">bonus</span>':'')+'</td>'+
          '<td>'+(bonusDeal(d)
            ? '<span class="dash">\u2014</span>'
            : '<input class="gin" type="text" inputmode="decimal" data-g="'+esc(d.id)+'" value="'+
              esc((n(d.back)||0).toFixed(2))+'">')+'</td>'+
          '<td class="prods">'+chips(d)+'</td>'+
          '<td>'+(bonusDeal(d)?'<span class="dash">\u2014</span>'
            :'<span class="pcount'+(prodCount(d)?"":" zero")+'">'+prodCount(d)+'</span>')+'</td></tr>';
      }
      function draw(){
        var l = mine(ST._fiWho);
        tb.innerHTML = l.map(rowHtml).join("");
        totals();
        wire();
      }
      function repaintRow(d){
        var tr = tb.querySelector('[data-row="'+d.id+'"]');
        if (!tr) return;
        tr.outerHTML = rowHtml(d);
        totals(); wire();
      }
      function findDeal(id){ return ACT().deals.filter(function(x){ return x.id===id; })[0]; }

      function wire(){
        tb.querySelectorAll("[data-p]").forEach(function(b){
          b.addEventListener("click", function(){
            var d = findDeal(b.getAttribute("data-id")); if(!d) return;
            var k = b.getAttribute("data-p");
            d[k] = !d[k]; stamp(d);
            Persist.save(); Sync.nudge(); invalidate("finance"); invalidate("command");
            repaintRow(d);
          });
        });
        tb.querySelectorAll("[data-ba]").forEach(function(b){
          b.addEventListener("click", function(){
            var d = findDeal(b.getAttribute("data-ba")); if(!d) return;
            var order = ["YES","NO","DNQ"];
            var i = order.indexOf(String(d.adv||"DNQ").toUpperCase());
            d.adv = order[(i<0?2:i+1) % order.length]; stamp(d);
            Persist.save(); Sync.nudge(); invalidate("finance"); invalidate("command");
            repaintRow(d);
          });
        });
        tb.querySelectorAll("[data-g]").forEach(function(inp){
          inp.addEventListener("change", function(){
            var d = findDeal(inp.getAttribute("data-g")); if(!d) return;
            var v = n(inp.value);
            d.back = v==null ? 0 : v; stamp(d);
            Persist.save(); Sync.nudge(); invalidate("finance"); invalidate("command");
            totals();
          });
        });
        tb.querySelectorAll("[data-pick]").forEach(function(cb){
          cb.addEventListener("change", function(){ picked[cb.getAttribute("data-pick")] = cb.checked; });
        });
      }

      var all = root.querySelector("#flAll");
      if (all) all.addEventListener("change", function(){
        var on = this.checked;
        mine("__none").forEach(function(d){ picked[d.id] = on; });
        draw();
      });
      var claim = root.querySelector("#claimAll");
      if (claim) claim.addEventListener("click", function(){
        var to = root.querySelector("#claimTo").value;
        var ids = Object.keys(picked).filter(function(k){ return picked[k]; });
        if (!ids.length || !to){ window.alert("Tick the deals you want first."); return; }
        pushUndo();
        ids.forEach(function(id){
          var d = findDeal(id); if (d){ d.fi = to; stamp(d); }
        });
        picked = {};
        touch();
      });

      draw();
    }};
}

var VIEWS=[
  {g:"Month",id:"command", label:"Command center",fn:vCommand, live:true},
  {g:"Month",id:"deals",   label:"Deal log",      fn:vDeals,   live:true},
  {g:"Month",id:"stores",  label:"Store board",   fn:vStores, live:true},
  {g:"Month",id:"person",  label:"Specialist",    fn:vPerson,  live:true},
  {g:"Month",id:"finance", label:"F&I desk",      fn:vFinance, live:true},
  {g:"Month",id:"filog",   label:"F&I log",       fn:vFiLog,   live:true},
  {g:"Month",id:"cit",     label:"Contracts in transit", fn:vCit, live:true},
  {g:"Month",id:"history", label:"Past months",   fn:vHistory, live:true},
  {g:"Floor",     id:"schedule",label:"Schedule",      fn:vSchedule, live:true},
  {g:"Floor",     id:"people",  label:"Team", fn:vPeople, live:true},
  {g:"Inventory", id:"cpo",     label:"CPO inventory", fn:vCpo,     live:true},
  {g:"Inventory", id:"aging",   label:"Used aging",    fn:vAging,   live:true},

];
function counts(){
  var M=null;
  return {
    command: ST.settings.monthLabel.split(" ")[0].slice(0,4),
    deals: String(ACT().deals.length),
    stores: String(live(ST.stores||[]).length),
    person: String(ACT().roster.filter(function(r){return r.team!=="House";}).length),
    finance: String(live(ST.finShifts||[]).length),
    filog: String(fiDeals().filter(function(d){ return !d.fi; }).length || ""),
    cit: String(ACT().deals.filter(function(d){ return d.cit && d.cit!=="funded"; }).length || ""),
    history: String(closedMonths().length),
    schedule: String(live(ST.schedPeople||[]).length + live(ST.mgrShifts||[]).length + live(ST.finShifts||[]).length),
    people: String(live(ST.timeOff||[]).length),
    cpo: String(live(ST.cpo||[]).length),
    aging: String(ST.aging.reduce(function(a,b){return a+agingRows(b).length;},0)),
    recon: String(live(ST.recon||[]).filter(function(x){ var d=reconDays(x); return d!=null && d>=30; }).length || ""),
    lots: String(live(ST.units||[]).length),
    weowes: String(ACT().owes.length),
    setup: "",
    forms: "2",
    sheets: String(Object.keys(WB).length)
  };
}
var nav=document.getElementById("nav"), main=document.getElementById("main");
var current="command", built={};
var NAV_KEY = "central-command-center-nav";
function navOpen(){
  try { return JSON.parse(window.localStorage.getItem(NAV_KEY)) || {}; }
  catch(e){ return {}; }
}
function setNavOpen(o){
  try { window.localStorage.setItem(NAV_KEY, JSON.stringify(o)); } catch(e){}
}
function paintNav(){
  var c = counts(), open = navOpen(), groups = [], byG = {};
  VIEWS.forEach(function(v){
    if (!byG[v.g]){ byG[v.g] = []; groups.push(v.g); }
    byG[v.g].push(v);
  });
  var here = (VIEWS.filter(function(v){ return v.id===current; })[0]||{}).g;
  var h = "";
  groups.forEach(function(g, i){
    // default open on first run; the group you are standing in is never collapsed
    var isOpen = (open[g] === undefined) ? true : !!open[g];
    if (g === here) isOpen = true;
    var slug = "g"+i;
    h += '<button class="grp" type="button" data-g="'+esc(g)+'" aria-expanded="'+(isOpen?"true":"false")+
         '" aria-controls="'+slug+'"><span>'+esc(g)+'</span><span class="chev">\u25BE</span></button>'+
         '<div class="sect" id="'+slug+'"'+(isOpen?"":" hidden")+'>'+
         byG[g].map(function(v){
           return '<a href="#'+v.id+'" data-id="'+v.id+'"'+(v.id===current?' class="on"':'')+'>'+
             '<span>'+esc(v.label)+'</span><span class="c">'+esc(c[v.id]||"")+'</span></a>';
         }).join("")+'</div>';
  });
  nav.innerHTML = h;
  nav.querySelectorAll(".grp").forEach(function(btn){
    btn.addEventListener("click", function(){
      var g = btn.getAttribute("data-g");
      var nowOpen = btn.getAttribute("aria-expanded") !== "true";
      btn.setAttribute("aria-expanded", nowOpen ? "true" : "false");
      var sect = document.getElementById(btn.getAttribute("aria-controls"));
      if (sect) sect.hidden = !nowOpen;
      var o = navOpen(); o[g] = nowOpen; setNavOpen(o);
    });
  });
}
function build(id){
  var v=VIEWS.filter(function(x){return x.id===id;})[0]||VIEWS[0];
  var old=document.getElementById("v-"+v.id);
  if (old) old.remove();
  var made=v.fn();
  var sec=document.createElement("section");
  sec.className="view"; sec.id="v-"+v.id; sec.innerHTML=made.html;
  main.appendChild(sec);
  built[v.id]=true;
  if (made.init) made.init(sec);
  return sec;
}
function show(id){
  var v=VIEWS.filter(function(x){return x.id===id;})[0]||VIEWS[0];
  current=v.id;
  if (!built[v.id]) build(v.id);
  main.querySelectorAll(".view").forEach(function(s){ s.classList.toggle("on", s.id==="v-"+v.id); });
  paintNav();
  window.scrollTo(0,0);
  document.getElementById("rail").classList.remove("open");
  document.getElementById("scrim").classList.remove("on");
}
// after any edit: throw away every cached live view, rebuild the one on screen
/* Drop a cached view without disturbing the one on screen, so it rebuilds fresh
   next time it is opened. */
function invalidate(id){
  if (id === current) return;
  var el = document.getElementById("v-"+id);
  if (el){ el.remove(); built[id] = false; }
}
function rebuildAll(){
  VIEWS.forEach(function(v){
    if (!v.live) return;
    var el=document.getElementById("v-"+v.id);
    if (el){ el.remove(); built[v.id]=false; }
  });
  if (!built[current]) { var s=build(current); s.classList.add("on"); }
  paintNav(); Sync.paint();
}

window.addEventListener("hashchange",function(){ show(location.hash.replace("#","")); });
var burger=document.getElementById("burger"), scrim=document.getElementById("scrim"), rail=document.getElementById("rail");
burger.addEventListener("click",function(){ rail.classList.toggle("open"); scrim.classList.toggle("on", rail.classList.contains("open")); });
scrim.addEventListener("click",function(){ rail.classList.remove("open"); scrim.classList.remove("on"); });

/* A copy made with "Download a copy for the team" carries the link inside it,
   so the manager who receives it opens the file and is already connected. */
function applyPreset(){
  var tag = document.getElementById("ccPreset");
  if (!tag) return false;
  if (ST.sync && ST.sync.url) return false;
  try{
    var pc = JSON.parse(tag.textContent);
    if (!pc || !pc.url) return false;
    ST.sync = {url:pc.url, token:pc.token||"", auto:true, lastSync:null, lastPush:null};
    Persist.save(true);
    if (!pc.token) ST._needPass = true;   // the link is baked in, the passphrase is not
    return true;
  }catch(e){ return false; }
}
function teamCopy(withPass){
  var c = Sync.cfg();
  // Leaving the passphrase out means a forwarded file is useless on its own.
  var cfg = JSON.stringify(withPass ? {url:c.url, token:c.token} : {url:c.url})
              .replace(/</g,"\\u003c").replace(/>/g,"\\u003e");
  var tag = '<scr'+'ipt id="ccPreset" type="application/json">'+cfg+'</scr'+'ipt>';
  // Both markers are split so the literals never appear in this file's own source.
  // Written whole, the first match found is the one inside this very function,
  // and the config gets injected into the middle of the script instead of the page.
  var MARK = "</bo"+"dy>";
  var html = PRISTINE.indexOf(MARK) >= 0
    ? PRISTINE.replace(MARK, function(){ return tag + "\n" + MARK; })
    : PRISTINE + tag;
  download(withPass ? "command-center-connected.html" : "command-center-team.html", html, "text/html");
}

var undoBtn=document.getElementById("undoBtn");
if (undoBtn) undoBtn.addEventListener("click", doUndo);

/* A link-only team copy knows where to sync but not the passphrase, so ask for
   it once on first open rather than leaving the manager to hunt through Setup. */
function askForPassphrase(){
  ST._needPass = false;
  openForm({
    title:"Passphrase",
    sub:"This copy knows the team link but not the passphrase. Ask whoever sent it.",
    saveLabel:"Connect",
    value:{token:""},
    fields:[{k:"token",label:"Passphrase",wide:true}],
    validate:function(o){ return String(o.token).trim()?null:"Enter the passphrase."; },
    onSave:function(o){
      ST.sync.token = String(o.token).trim();
      Persist.save(true);
      Sync.start(); Sync.run(function(){ rebuildAll(); });
    }
  });
}
function boot(){
  Persist.load(function(){
    paintUndo();
    applyPreset();
    show(location.hash.replace("#","")||"command");
    Sync.paint();
    if (ST._needPass) askForPassphrase();
    else if (Sync.on()){ Sync.start(); Sync.run(); }
  });
}
/* Wait for the document to finish parsing. With a storage backend the load
   callback is async and the page happens to be ready by then; with no storage
   it fires immediately, mid-parse, and anything below this script — including
   the team-copy config tag — is not in the DOM yet. */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
