      '<div class="marker '+v.c+'" style="left:'+(d.goal?Math.min(100,d.pace/d.goal*100):0)+'%"></div></div>'+
      '<div class="pace-foot"><span>Projected finish <b>'+d.pace+'</b> · <span class="verdict '+v.c+'">'+
      (gap>0?gap+" under":Math.abs(gap)+" over")+' — '+v.w+'</span></span>'+
      '<span>'+Math.round(pct)+'% of goal booked</span></div></div>';
  }).join("");

  function tile(l,k,rows){
    return '<div class="tile"><div class="eyebrow">'+esc(l)+'</div><div class="k num">'+esc(k)+'</div><dl>'+

  var byUsedU = M.per.slice().sort(function(a,b){return b.uU-a.uU;})[0];
  var withN = M.per.filter(function(p){return p.nU>=1;}).sort(function(a,b){return b.nP-a.nP;})[0];
  var withU = M.per.filter(function(p){return p.uU>=1;}).sort(function(a,b){return b.uP-a.uP;})[0];
  function lead(l,p,unit,val){

      '</div><div class="stat">'+esc(p?val(p):"")+'</div></div>';

  var html = head("Command","Center.",
    "Live off the deal log — every figure below recalculates the moment you add or change a deal. "+
    (liveDaysTotal()-liveDaysElapsed())+" selling day left in "+esc(s.monthLabel)+".",
    ["Deal log ("+ACT().deals.length+" deals)"]) + sessionBanner() +
    '<h2 class="sec">Today</h2>'+ todayPanel() +
    '<h2 class="sec">Day by day</h2>'+ dayChart() +
    '<h2 class="sec">Pace to goal</h2><div class="pace">'+pace+'</div>'+
    '<section class="strip">'+
      tile("Total gross", money(M.gross), [["New",money(M.newG)],["Used",money(M.usedG)],["At pace",money(M.paceG)]])+
      tile("Total PVR", money(M.pvr), [["New",money(M.pvrN)],["Used",money(M.pvrU)],
        ["Spread",(M.pvrU>=M.pvrN?"+":"\u2212")+money(Math.abs(M.pvrU-M.pvrN))+(M.pvrU>=M.pvrN?" used":" new")]])+
      tile("Beasley advantage", M.bAll==null?"—":M.bAll.toFixed(1)+"%",
        [["New",M.bN==null?"—":M.bN.toFixed(1)+"%"],["Used",M.bU==null?"—":M.bU.toFixed(1)+"%"],
         ["Counted",M.bAllR.num+" of "+M.bAllR.den]])+
      tile("C.S.I.", s.csiMonth!=null?s.csiMonth:(s.csi3!=null?s.csi3:"—"),
        [["3-month roll",s.csi3!=null?s.csi3:"—"],["This month",s.csiMonth!=null?s.csiMonth:"Not posted"]])+
    '</section>'+
    '<section class="leaders">'+
      lead("Top new volume", byNewU, "", function(p){return num1(p.nU)+" new units";})+
      lead("Top used volume", byUsedU, "", function(p){return num1(p.uU)+" used units";})+
      lead("Top new PVR", withN, "", function(p){return money(p.nP)+" per new unit";})+
      lead("Top used PVR", withU, "", function(p){return money(p.uP)+" per used unit";})+
    '</section>'+
    '<div class="panel"><div class="ph"><div><div class="eyebrow">Month to date</div><h3>Product specialists</h3></div>'+
      '<div class="seg" id="rv" role="group" aria-label="Department">'+
      '<button data-v="total" aria-pressed="true">Total</button><button data-v="new" aria-pressed="false">New</button>'+
      '<button data-v="used" aria-pressed="false">Used</button></div></div>'+
      '<div class="tablewrap"><table id="rt"><thead><tr>'+
      '<th></th><th class="l sortable" data-k="name" data-t="s">Specialist</th>'+
      '<th class="sortable" data-k="units">Units</th><th class="sortable" data-k="gross">Gross</th>'+
      '<th class="sortable" data-k="pvr">PVR</th><th class="sortable" data-k="goal">Goal</th>'+
      '<th class="sortable" data-k="bp">Beasley %</th>'+
      '</tr></thead><tbody></tbody><tfoot><tr></tr></tfoot></table></div></div>'+
    '<footer><p><b>How these are counted.</b> A deal with two names splits 0.5 / 0.5 for units and gross; Beasley % counts the whole deal for each name on it, against every new deal plus every used CPO. Those are the same rules the workbook uses — the roster now rolls up to exactly '+num1(M.units)+' units and '+money(M.gross)+', matching the deal log.</p>'+
    '<p><b>One correction.</b> The workbook divided total gross by 222 to get a $1,393 PVR while dividing new and used by their own unit counts. This page divides all three consistently, so total PVR reads '+money(M.pvr)+'.</p></footer>';

  return { html:html, init:function(root){
    var ta = root.querySelector("#todayAdd");
    if (ta) ta.addEventListener("click", function(){ dealForm(null); });
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      root.querySelectorAll(".track .fill").forEach(function(el,i){
        setTimeout(function(){ el.style.width=el.getAttribute("data-w")+"%"; }, 80+i*110);
      });
    });});
    var view="total";
    var pick={ total:function(p){return{units:p.tU,gross:p.tG,pvr:p.tP};},
               "new":function(p){return{units:p.nU,gross:p.nG,pvr:p.nP};},
               used:function(p){return{units:p.uU,gross:p.uG,pvr:p.uP};} };
    /* Bar is progress to goal; the red tick is where they should be today given
       how much of the month has gone. Past the tick means ahead of pace. */
    function goalCell(p){
      if (p.goal == null) return '<span class="dash">\u2014</span>';
      var pct = Math.min(100, p.tU/p.goal*100);
      var mark = Math.min(100, (liveDaysElapsed()||0)/(liveDaysTotal()||1)*100);
      var cls = p.tU>=p.goal ? "hit" : (p.onPace!=null && p.onPace>=p.goal) ? "close" : "";
      return '<span class="goalcell">'+
        '<span class="gbar"><i class="'+cls+'" style="width:'+pct.toFixed(1)+'%"></i>'+
        '<b style="left:'+mark.toFixed(1)+'%"></b></span>'+
        '<span class="gnum">'+num1(p.tU)+'<small>/'+p.goal+'</small></span></span>';
    }
    var tb=root.querySelector("#rt tbody"), tf=root.querySelector("#rt tfoot tr");
    function base(){
      return M.per.map(function(p){ var m=pick[view](p);
        return {p:p,name:p.name,units:m.units,gross:m.gross,pvr:m.pvr,bp:p.bPct,goal:p.goal};
      }).filter(function(x){ return !(x.units===0 && x.gross===0); });
    }
    function draw(rows){
      var mx=Math.max.apply(null,rows.map(function(x){return x.units;}))||1;
      tb.innerHTML = rows.map(function(x,i){
        var p=x.p, w=Math.max(3,x.units/mx*76);
        return '<tr><td class="rank">'+String(i+1).padStart(2,"0")+'</td>'+
          '<td class="l"><b>'+esc(p.name)+'</b>'+(view==="total"?'<span class="tag '+(p.team==="House"?"house":p.team==="New"?"n":"u")+'">'+esc(p.team)+'</span>':'')+'</td>'+
          '<td><span class="unitcell"><i class="unitbar" style="width:'+w+'px"></i><span class="v">'+num1(x.units)+'</span></span></td>'+
          '<td class="mono">'+cellOr(money(x.gross),x.gross<0)+'</td>'+
          '<td class="mono">'+cellOr(x.pvr==null?null:money(x.pvr),x.pvr<0)+'</td>'+
          '<td>'+goalCell(p)+'</td>'+
          '<td>'+(x.bp==null?'<span class="dash">—</span>':'<span class="mono beas">'+x.bp.toFixed(1)+'%<small>'+p.bNum+'/'+p.bDen+'</small></span>')+'</td></tr>';
      }).join("");
      var tu=rows.reduce(function(a,x){return a+x.units;},0), tg=rows.reduce(function(a,x){return a+x.gross;},0);
      var goalSum = M.per.reduce(function(a,p){ return a + (p.goal||0); },0);
      var withGoal = M.per.filter(function(p){ return p.goal!=null; }).length;
      tf.innerHTML='<td colspan="2" class="l">Roster total — '+view+'</td><td>'+num1(tu)+'</td>'+
        '<td class="mono">'+money(tg)+'</td><td class="mono">'+money(tu?tg/tu:0)+'</td>'+
        '<td>'+(goalSum? '<span class="goalcell"><span class="gnum">'+goalSum+'</span></span>' : '')+'</td>'+
        '<td class="goalfoot">'+(withGoal? withGoal+' of '+M.per.length+' set' : '')+'</td>';
    }
    function reset(){ var b=base(); b.sort(function(a,c){return c.units-a.units;}); draw(b); }
    root.querySelectorAll("#rv button").forEach(function(btn){
      btn.addEventListener("click",function(){
        root.querySelectorAll("#rv button").forEach(function(o){o.setAttribute("aria-pressed",o===btn?"true":"false");});
        view=btn.getAttribute("data-v"); reset();
      });
    });
    tableSort(root.querySelector("#rt"), base, draw);
    reset();
  }};
}

    ],

      var el=bx.querySelector("#f___t"); if(!el) return;

      el.innerHTML = (g<0?'<span class="neg">':'<span>')+money(g,2)+'</span>';

      if (!String(o.deal).trim()) return "Deal # is required.";

      return null;
    },
    onSave: function(o){
      o.front=n(o.front)||0; o.back=n(o.back)||0;
      o.customer = applyPrivacy(o.customer);
      stamp(o);
      if (isNew) ST.deals.push(o);
      else { var i=ST.deals.findIndex(function(d){return d.id===o.id;}); if(i>=0) ST.deals[i]=o; }

    onDelete: isNew ? null : function(){
      existing._del = true; stamp(existing);
    },

  });
}

/* Bulk paste-import: tab-separated rows copied straight out of Excel, in this
   exact column order — Stock, Year, Make, Model, Color, Type, 2nd Key(Y/N),
   Date In, RO #, Tech, Status, Notes. Nothing is guessed beyond that; anything
   that doesn't parse is left blank and editable afterward. */
function parseReconDate(s){
  s = String(s||"").trim();
  if (!s) return "";
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1]+"-"+m[2]+"-"+m[3];
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m){
    var yy = m[3].length===2 ? "20"+m[3] : m[3];
    return yy+"-"+(m[1].length<2?"0"+m[1]:m[1])+"-"+(m[2].length<2?"0"+m[2]:m[2]);
  }
  return "";
}
function reconImportOpen(bucket){
  box.innerHTML = '<h3>Import '+(bucket==="wholesale"?"wholesale":"recon")+' rows from Excel</h3>'+
    '<p class="sub">In Excel, select and copy these columns in this order — Stock, Year, Make, Model, '+
    'Color, Type, 2nd Key (Y/N), Date In, RO #, Tech, Status, Notes — then paste below. One vehicle per line.</p>'+
    '<div class="form"><div class="field wide"><label for="riText">Pasted rows</label>'+
    '<textarea id="riText" rows="10" placeholder="Paste tab-separated rows here…"></textarea></div></div>'+
    '<div class="boxfoot"><span class="err-msg" id="riErr"></span>'+
    '<span class="right"><button class="btn" id="riCancel">Cancel</button>'+
    '<button class="btn primary" id="riGo">Import</button></span></div>';
  modal.classList.add("on");
  box.querySelector("#riCancel").addEventListener("click", closeModal);
  box.querySelector("#riGo").addEventListener("click", function(){
    var raw = box.querySelector("#riText").value;
    var lines = raw.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
    if (!lines.length){ box.querySelector("#riErr").textContent = "Paste at least one row."; return; }
    pushUndo();
    var added = 0;
    lines.forEach(function(line){
      var c = line.split("\t");
      if (!c[0] || !String(c[0]).trim()) return;
      var o = {
        id:uid(), bucket: bucket,
        stock: String(c[0]||"").trim(), year: String(c[1]||"").trim(), make: String(c[2]||"").trim(),
        model: String(c[3]||"").trim(), color: String(c[4]||"").trim(),
        svcType: String(c[5]||"").trim().toUpperCase() || (bucket==="wholesale"?"WHOLESALE":"CHOICE"),
        secondKey: String(c[6]||"").trim().toUpperCase()==="Y",
        dateIn: parseReconDate(c[7]), ro: String(c[8]||"").trim(), tech: String(c[9]||"").trim(),
        status: RECON_STATUSES.indexOf(String(c[10]||"").trim())>=0 ? String(c[10]).trim() : "Not Started",
        listPrice:null, shopCost:null, vendorCost:null,
        notes: String(c[11]||"").trim()
      };
      stamp(o); ST.recon.push(o); added++;
    });
    closeModal(); touch();
  });
  var first = box.querySelector("textarea"); if(first) first.focus();
}

   info, type, 2nd key, status); the vendor checklist and sign-off print blank

var MAKE_READY_ITEMS = [

    '@page{size:landscape;margin:10mm;}'+

    'th{background:#DCE6F1;font-size:10px;}'+

function printMakeReady(x){

  var idp = bucket;
  function rows(){
    var q = root.querySelector("#"+idp+"q").value.trim().toUpperCase();
    var st = root.querySelector("#"+idp+"tbl").getAttribute("data-st")||"all";
    return live(ST.recon).filter(function(x){
      if (x.bucket!==bucket) return false;
      if (st!=="all" && x.status!==st) return false;
      if (q && (x.stock+" "+x.make+" "+x.model+" "+x.tech+" "+x.ro).toUpperCase().indexOf(q)<0) return false;
      return true;
    });
  }
  function draw(){
    var list = rows();
    var tb = root.querySelector("#"+idp+"tbl tbody");
    root.querySelector("#"+idp+"c").textContent = list.length+" vehicles";
    tb.innerHTML = list.map(function(x){
      var days = reconDays(x);
      return '<tr><td class="l mono">'+esc(x.stock)+'</td>'+
        '<td class="l">'+esc(x.year)+' '+esc(x.make)+' '+esc(x.model)+(x.color?' <span class="dim">'+esc(x.color)+'</span>':'')+'</td>'+
        '<td class="l">'+esc(x.svcType||"—")+'</td>'+
        '<td class="l">'+esc(x.tech||"—")+'</td>'+
        '<td class="l">'+reconStatusTag(x.status)+'</td>'+
        '<td>'+reconAgeTag(days)+'</td>'+
        '<td class="acts"><button class="btn sm" data-e="'+esc(x.id)+'">Edit</button> '+
          '<button class="btn sm" data-p="'+esc(x.id)+'">Print form</button></td></tr>';
    }).join("") || '<tr><td colspan="7" class="l dim">Nothing here yet.</td></tr>';
    tb.querySelectorAll("[data-e]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var id=btn.getAttribute("data-e");
        reconForm(live(ST.recon).filter(function(x){return x.id===id;})[0], bucket);
      });
    });
    tb.querySelectorAll("[data-p]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var id=btn.getAttribute("data-p");
        var v = live(ST.recon).filter(function(x){return x.id===id;})[0];
        if (v) printMakeReady(v);
      });
    });
  }
  root.querySelector("#"+idp+"Add").addEventListener("click",function(){ reconForm(null, bucket); });
  root.querySelector("#"+idp+"Imp").addEventListener("click",function(){ reconImportOpen(bucket); });
  root.querySelectorAll("#"+idp+"seg button").forEach(function(b){
    b.addEventListener("click",function(){
      root.querySelectorAll("#"+idp+"seg button").forEach(function(o){o.setAttribute("aria-pressed",o===b?"true":"false");});
      root.querySelector("#"+idp+"tbl").setAttribute("data-st", b.getAttribute("data-v"));
      draw();
    });
  });
  root.querySelector("#"+idp+"q").addEventListener("input",draw);
  draw();
}

function lastSaved(){
  if (!ST.savedAt) return "Not yet";
  var d=new Date(ST.savedAt);
  return isNaN(d) ? "Not yet" : d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function relDays(iso){
  var d=new Date(iso); if(isNaN(d)) return "Never";
  var days=Math.floor((Date.now()-d.getTime())/86400000);
  return days<=0 ? "Today" : days===1 ? "Yesterday" : days+" days ago";
}
function staleBackup(){
  if (!ST.lastExport) return true;
  var d=new Date(ST.lastExport);
  return isNaN(d) || (Date.now()-d.getTime())/86400000 > 7;
}

function vStores(){
  var M = derive();
  var METRICS = [
    {k:"gross", label:"Total gross", fmt:function(v){return money(v);}},
    {k:"units", label:"Total units",  fmt:function(v){return String(v);}},
    {k:"pvr",   label:"PVR",          fmt:function(v){return money(v);}},
    {k:"newU",  label:"New units",    fmt:function(v){return String(v);}},
    {k:"usedU", label:"Used units",   fmt:function(v){return String(v);}}
  ];

  /* Central's row is the live deal log, not a typed figure — so the board can
     never disagree with the command centre. Everyone else is entered by hand. */
  function rows(){
    return live(ST.stores).map(function(st){
      var o = Object.assign({}, st);
      if (st.home){
        o.newU=M.newU; o.newG=M.newG; o.usedU=M.usedU; o.usedG=M.usedG; o.live=true;
        o.period=ST.settings.monthLabel;
      }
      o.units=(o.newU||0)+(o.usedU||0);
      o.gross=(o.newG||0)+(o.usedG||0);
      o.pvr = o.units ? o.gross/o.units : 0;
      return o;
    });
  }
  var list = rows().slice().sort(function(a,b){ return b.gross-a.gross; });
  var maxG = Math.max.apply(null, list.map(function(x){return x.gross;})) || 1;
  var me = list.filter(function(x){return x.home;})[0];
  var mePos = list.indexOf(me)+1;
  var leader = list[0];
  var periods = {};
  list.forEach(function(x){ periods[x.period||"\u2014"] = true; });
  var mixed = Object.keys(periods).length > 1;

  function ord(i){ return i+(["th","st","nd","rd"][i%10>3?0:(i%100-i%20!=10)*i%10]||"th"); }

  var podium = list.map(function(x,i){
    return '<div class="pcard'+(i===0?" p1":"")+(x.home?" home":"")+'">'+
      '<span class="place">'+(i+1)+'</span>'+
      '<div class="sname">'+esc(x.name)+(x.home?'<span class="homeflag">Us</span>':'')+'</div>'+
      '<div class="big">'+money(x.gross)+'</div>'+
      '<div class="sub">'+x.units+' units \u00b7 '+money(x.pvr)+' PVR</div>'+
      '<dl><dt>New</dt><dd>'+x.newU+' \u00b7 '+money(x.newG)+'</dd>'+
      '<dt>Used</dt><dd>'+x.usedU+' \u00b7 '+money(x.usedG)+'</dd></dl>'+
      '<div class="gapline">'+(i===0
        ? '<b>Leads the group</b> by '+money(x.gross-(list[1]?list[1].gross:0))
        : money(leader.gross-x.gross)+' behind '+esc(leader.name))+
      ' \u00b7 <b>'+esc(x.period||"\u2014")+'</b>'+(x.live?' (live)':'')+'</div>'+
      '</div>';
  }).join("");

  return { html: head("Store","Board.",
    "Central against Georgetown, Leander and South. Our row is read straight from the deal log; the others you keep current.",
    ["Live \u00b7 seeded from JUNE25"])+ sessionBanner()+
    (mixed? '<div class="warn"><b>These are not all the same month.</b> '+
      Object.keys(periods).map(esc).join(" and ")+' are being compared side by side. Update the other stores to '+
      esc(ST.settings.monthLabel)+' when their numbers land, or the ranking is not telling you much.</div>':'')+

    '<div class="strip">'+
      '<div class="tile"><div class="eyebrow">Where we sit</div><div class="k num">'+ord(mePos)+
        ' of '+list.length+'</div><dl><dt>By gross</dt><dd>'+money(me.gross)+'</dd>'+
        '<dt>Off the lead</dt><dd>'+(mePos===1?"\u2014":money(leader.gross-me.gross))+'</dd></dl></div>'+
      '<div class="tile"><div class="eyebrow">Group total</div><div class="k num">'+
        money(list.reduce(function(a,x){return a+x.gross;},0))+'</div>'+
        '<dl><dt>Units</dt><dd>'+list.reduce(function(a,x){return a+x.units;},0)+'</dd>'+
        '<dt>Our share</dt><dd>'+Math.round(me.gross/list.reduce(function(a,x){return a+x.gross;},0)*100)+'%</dd></dl></div>'+
      '<div class="tile"><div class="eyebrow">Group PVR</div><div class="k num">'+
        money(list.reduce(function(a,x){return a+x.gross;},0)/Math.max(1,list.reduce(function(a,x){return a+x.units;},0)))+'</div>'+
        '<dl><dt>Ours</dt><dd>'+money(me.pvr)+'</dd>'+
        '<dt>Best</dt><dd>'+money(Math.max.apply(null,list.map(function(x){return x.pvr;})))+'</dd></dl></div>'+
    '</div>'+

    '<h2 class="sec">The standings</h2><div class="podium">'+podium+'</div>'+

    '<h2 class="sec">Head to head</h2>'+
    '<div class="ctl" style="margin-bottom:14px"><div class="seg" id="metf" role="group" aria-label="Metric">'+
      METRICS.map(function(m,i){
        return '<button data-v="'+m.k+'" aria-pressed="'+(i===0?"true":"false")+'">'+esc(m.label)+'</button>';
      }).join("")+'</div></div>'+
    '<div class="rankbars" id="bars"></div>'+

    '<h2 class="sec">The numbers</h2><div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">Tap a store to update it</div><h3>Group detail</h3></div>'+
    '<div><button class="btn primary" id="addStore">+ Add a store</button></div></div>'+
    '<p class="note">Central is calculated from the deal log and cannot be typed over \u2014 it will always match the command centre. The other three are yours to keep current.</p>'+
    '<div class="tablewrap"><table id="stab"><thead><tr>'+
      '<th class="l sortable" data-k="name" data-t="s">Store</th>'+
      '<th class="l">Period</th>'+
      '<th class="sortable" data-k="newU">New units</th><th class="sortable" data-k="newG">New gross</th>'+
      '<th class="sortable" data-k="usedU">Used units</th><th class="sortable" data-k="usedG">Used gross</th>'+
      '<th class="sortable" data-k="units">Total units</th><th class="sortable" data-k="gross">Total gross</th>'+
      '<th class="sortable" data-k="pvr">PVR</th><th></th></tr></thead><tbody></tbody><tfoot><tr></tr></tfoot></table></div></div>'+

    '<h2 class="sec">Finance manager PVR</h2><div class="panel">'+
    '<div class="ph"><div></div><div><button class="btn primary" id="addFp">+ Add</button></div></div>'+
    '<div class="tablewrap"><table id="fptab"><thead><tr><th class="l sortable" data-k="name" data-t="s">Manager</th>'+
      '<th class="sortable" data-k="pvr">PVR</th><th></th></tr></thead><tbody></tbody></table></div></div>',

function vSchedule(){
  var SHIFTS = [
    {k:"open",  cls:"o", label:"Open",  word:"Openers"},
    {k:"close", cls:"c", label:"Close", word:"Closers"},
    {k:"bells", cls:"b", label:"Bells", word:"Bell to bell"},
    {k:"off",   cls:"f", label:"Off",   word:"Off"}
  ];
  var SALES_CYCLE = ["","open","close","off"];
  var MGR_CYCLE   = ["","open","close","bells","off"];
  function cls(v){ var m=SHIFTS.filter(function(x){return x.k===v;})[0]; return m?m.cls:"n"; }
  function lab(v){ var m=SHIFTS.filter(function(x){return x.k===v;})[0]; return m?m.label:"\u2014"; }
  function nextOf(v, cycle){
    var order = cycle || SALES_CYCLE;
    var i = order.indexOf(v||"");
    return order[(i<0 ? 0 : i+1) % order.length];
  }
  function people(){ return live(ST.schedPeople).slice().sort(function(a,b){
    return a.name<b.name?-1:a.name>b.name?1:0; }); }
  function dayOf(id){ return ST.schedule.filter(function(d){return d.id===id;})[0]; }
  function names(d, kind){
    return Object.keys(d.assign||{}).filter(function(nm){ return d.assign[nm]===kind; }).sort();
  }

  function legendFor(keys){
    return '<div class="legend"><b>Tap a cell to change it.</b>'+
      SHIFTS.filter(function(x){ return keys.indexOf(x.k)>=0; })
        .map(function(x){ return '<span class="key"><i class="'+x.cls+'"></i>'+esc(x.word)+'</span>'; }).join("")+
      '<span class="key"><i style="border:1px solid var(--paper-3)"></i>Not scheduled</span></div>';
  }
  var legend = legendFor(["open","close","off"]);

  function cardInner(d){
    var o=names(d,"open"), c=names(d,"close"), f=names(d,"off");
    function block(list, k, empty){
      return '<div class="lab">'+esc(SHIFTS.filter(function(x){return x.k===k;})[0].word)+'</div>'+
        (list.length
          ? '<ul class="sh">'+list.map(function(nm){ return '<li><i class="'+cls(k)+'"></i>'+esc(nm)+'</li>'; }).join("")+'</ul>'
          : '<p class="none">'+esc(empty)+'</p>');
    }
    return '<h4>'+esc(d.label)+'</h4><div class="daymeta">'+(o.length+c.length)+' on'+
      (f.length? ' \u00b7 '+f.length+' off':'')+'</div>'+
      block(o,"open","Nobody opening")+block(c,"close","Nobody closing")+block(f,"off","Everyone in");
  }
  var cards = ST.schedule.map(function(d){
    return '<div class="card day" data-day="'+esc(d.id)+'">'+cardInner(d)+'</div>';
  }).join("");

  var dir = live(ST.directory||[]);

  return { html: head("Floor","Schedule.","Who opens, who closes, who is off \u2014 and who to call.",["Live"])+
    sessionBanner()+
    '<h2 class="sec">This week</h2><div class="cards week">'+cards+'</div>'+

    '<h2 class="sec">Set the week</h2><div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">Sales floor</div><h3>Shift grid</h3></div>'+
    '<div><button class="btn" id="clearWk">Clear week</button> <button class="btn primary" id="addPer">+ Add person</button></div></div>'+
    '<div class="ctl"><div class="seg" id="deskf" role="group" aria-label="Desk">'+
      '<button data-v="all" aria-pressed="true">All desks</button>'+
      '<button data-v="New" aria-pressed="false">New</button>'+
      '<button data-v="Used" aria-pressed="false">Used</button></div>'+
      '<span class="count" id="deskc"></span></div>'+
    legend+
    '<div class="tablewrap"><table class="shiftgrid" id="sgrid"><thead><tr><th class="who">Specialist</th>'+
      ST.schedule.map(function(d){ return '<th>'+esc(d.day)+'</th>'; }).join("")+
      '<th style="width:44px"></th></tr></thead><tbody></tbody><tfoot><tr></tr></tfoot></table></div></div>'+

    '<h2 class="sec">Manager coverage</h2><div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">Desk</div><h3>Manager grid</h3></div>'+
    '<div><button class="btn primary" id="addMgr">+ Add manager</button></div></div>'+
    legendFor(["open","close","bells","off"])+
    '<div class="tablewrap"><table class="shiftgrid" id="mgrid"><thead><tr>'+
      '<th class="who">Manager</th><th style="min-width:86px">Desk</th>'+
      ST.schedule.map(function(d){ return '<th>'+esc(d.day)+'</th>'; }).join("")+
      '<th style="width:44px"></th></tr></thead><tbody id="mgrb"></tbody><tfoot><tr id="mgrf"></tr></tfoot></table></div>'+
    '<p class="note" style="margin-top:12px">Bell to bell means open through close. Cells carried over from the workbook keep their original wording \u2014 hover to see it.</p></div>'+

    '<h2 class="sec">Finance coverage</h2><div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">F&amp;I desk</div><h3>Finance grid</h3></div>'+
    '<div><button class="btn primary" id="addFin">+ Add finance manager</button></div></div>'+
    (live(ST.finShifts||[]).some(function(f){ return Object.keys(f.assign||{}).length; })
      ? ''

    legendFor(["open","close","bells","off"])+

function vPeople(){
  var RS=S("ROSTER"), TR=S("TRAINING");

  /* ---- coverage maths ---- */
  var DCODE = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  function dayIso(y,m,d){ return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
  function outOn(iso){
    return live(ST.timeOff).filter(function(t){
      return t.start && t.end && iso>=t.start && iso<=t.end;
    });
  }
  function scheduledOn(iso){
    var wd = new Date(iso+"T12:00:00").getDay();
    if (wd===0) return {sales:0, mgr:0, fin:0, closed:true};
    var code = DCODE[wd];
    var away = {};
    outOn(iso).forEach(function(t){ away[String(t.name).toUpperCase().split(/\s+/)[0]] = true; });

    var day = (ST.schedule||[]).filter(function(d){ return d.day===code; })[0];
    var sales = 0;
    if (day) Object.keys(day.assign||{}).forEach(function(nm){
      var v=day.assign[nm];
      if ((v==="open"||v==="close") && !away[nm.toUpperCase().split(/\s+/)[0]]) sales++;
    });
    function onDuty(list){
      var n2=0;
      live(list||[]).forEach(function(m){
        var v=(m.assign||{})[code];
        if (!v || v==="off") return;
        if (away[String(m.name).toUpperCase().split(/\s+/)[0]]) return;
        n2++;
      });
      return n2;
    }
    return {sales:sales, mgr:onDuty(ST.mgrShifts), fin:onDuty(ST.finShifts), closed:false};
  }
  function spanDays(a,b){
    if(!a||!b||b<a) return 0;
    var s=new Date(a+"T12:00:00"), e=new Date(b+"T12:00:00"), n=0;
    while (s<=e){ if (s.getDay()!==0) n++; s.setDate(s.getDate()+1); }
    return n;
  }
  function usedBy(name){
    return live(ST.timeOff).filter(function(t){ return t.name===name; })
      .reduce(function(a,t){ return a + spanDays(t.start,t.end); },0);
  }

  var assumed = live(ST.timeOff).filter(function(t){ return t.assumed; }).length;

  /* ---- desk assignment comes from the specialist list on Month & goals ---- */
  var M = derive();
  var byName = {}; M.per.forEach(function(p){ byName[p.name]=p; });
  var DESKS = [["New","New car desk"],["Used","Used car desk"],["House","House"]];
  var teams = DESKS.map(function(d){
    return { key:d[0], name:d[1],
      people: ACT().roster.filter(function(r){ return r.team===d[0]; })
        .map(function(r){ return {name:r.name, units:(byName[r.name]||{}).tU||0}; })
        .sort(function(a,b){ return b.units-a.units || (a.name<b.name?-1:1); }) };
  }).filter(function(g){ return g.people.length; });

    (trRows.length?'<h2 class="sec">Training booked</h2><div class="panel"><div class="tablewrap"><table><thead><tr>'+

      }).join("")+'</tbody></table></div></div>':""),

    init:function(root){
      var ts=root.querySelector("#toSetup");
      if (ts) ts.addEventListener("click", function(){ location.hash="#setup"; });

      /* ================= calendar ================= */
      var seed = (live(ST.timeOff)[0]||{}).start || (ST.settings.monthKey+"-01");
      var cy=+seed.slice(0,4), cm=+seed.slice(5,7);
      function drawCal(){
        root.querySelector("#calLabel").textContent = MONTHS[cm-1]+" "+cy;
        var first = new Date(cy, cm-1, 1).getDay();
        var last  = new Date(cy, cm, 0).getDate();
        var today = todayISO();
        var html = ["S","M","T","W","T","F","S"].map(function(x){ return '<div class="dow">'+x+'</div>'; }).join("");
        for (var i=0;i<first;i++) html += '<div class="cell pad"></div>';
        for (var d=1; d<=last; d++){
          var iso = dayIso(cy,cm,d);
          var cov = scheduledOn(iso), away = outOn(iso);
          var klass = "cell" + (cov.closed?" closed":"") + (iso===today?" today":"") +
            (away.length>=3?" short":away.length>0?" warn":"");
          html += '<div class="'+klass+'"><span class="dnum">'+d+'</span>'+
            (cov.closed ? '<span class="cnts">closed</span>'
                        : '<span class="cnts"><b>'+cov.sales+'</b>S \u00b7 <b>'+cov.mgr+'</b>M \u00b7 <b'+
                          (cov.fin?'':' style="color:var(--soul)"')+'>'+cov.fin+'</b>F</span>')+
            (away.length? '<ul class="outlist">'+away.slice(0,3).map(function(t){
                return '<li><i class="'+(t.group==="Manager"?"mgr":"")+'"></i>'+esc(String(t.name).split(/\s+/)[0])+'</li>';
              }).join("")+(away.length>3?'<li style="color:var(--steel-dim)">+'+(away.length-3)+' more</li>':'')+'</ul>' : "")+
            '</div>';
        }
        root.querySelector("#calgrid").innerHTML = html;
      }
      root.querySelector("#calPrev").addEventListener("click",function(){ cm--; if(cm<1){cm=12;cy--;} drawCal(); });
      root.querySelector("#calNext").addEventListener("click",function(){ cm++; if(cm>12){cm=1;cy++;} drawCal(); });
      drawCal();

      /* ================= time off log ================= */
      function staffOpts(){
        var o = live(ST.staff).map(function(x){ return x.name; });
        live(ST.schedPeople).forEach(function(p){ if(o.indexOf(p.name)<0) o.push(p.name); });
        return o.sort();
      }
      function offForm(existing){
        var isNew=!existing;
        var val = existing ? Object.assign({},existing) :
          {id:uid(), name:(staffOpts()[0]||""), group:"Sales", type:"Vacation",
           start:todayISO(), end:todayISO(), note:""};
        openForm({
          title: isNew?"Book time off":"Edit "+(existing.name||""),
          sub:"Days are counted excluding Sundays, since the store is closed.",
          saveLabel: isNew?"Book it":"Save changes",
          value: val,
          fields:[
            {k:"name",label:"Who",type:"select",opts:staffOpts(),wide:true},
            {k:"group",label:"Group",type:"select",opts:["Sales","Manager"]},
            {k:"type",label:"Type",type:"select",opts:["Vacation","Unpaid","Personal","Sick"]},
            {k:"start",label:"From",type:"date"},
            {k:"end",label:"To",type:"date"},
            {k:"note",label:"Note",wide:true},
            {k:"__d",label:"Days off",type:"calc",wide:true}
          ],
          live:function(o,bx){
            var el=bx.querySelector("#f___d"); if(!el) return;
            var n2=spanDays(o.start,o.end);
            el.textContent = (o.end<o.start) ? "\u2014" : n2+(n2===1?" day":" days");
          },
          validate:function(o){
            if(!String(o.name).trim()) return "Pick who is off.";
            if(!o.start||!o.end) return "Both dates are required.";
            if(o.end<o.start) return "The end date cannot be before the start date.";
            return null;
          },
          onSave:function(o){
            delete o.assumed;
            stamp(o);
            if (isNew) ST.timeOff.push(o);
            else { var i=ST.timeOff.findIndex(function(x){return x.id===o.id;}); if(i>=0) ST.timeOff[i]=o; }
          },
          onDelete: isNew?null:function(){ existing._del=true; stamp(existing); },
          deleteMsg:"Delete this time-off entry?"
        });
      }
      root.querySelector("#addOff").addEventListener("click",function(){ offForm(null); });

      var grp="all", otb=root.querySelector("#otab tbody");
      function offRows(){
        var q=root.querySelector("#oq").value.trim().toUpperCase();
        return live(ST.timeOff).map(function(t){
          return Object.assign({},t,{days:spanDays(t.start,t.end)});
        }).filter(function(t){
          if (grp!=="all" && t.group!==grp) return false;
          if (q && (t.name+" "+(t.note||"")+" "+t.type).toUpperCase().indexOf(q)<0) return false;
          return true;
        });
      }
      function drawOff(list){
        root.querySelector("#occ").textContent = list.length+" entries \u00b7 "+
          list.reduce(function(a,t){return a+t.days;},0)+" days";
        otb.innerHTML = list.map(function(t){
          return '<tr><td class="l"><b>'+esc(t.name)+'</b></td>'+
            '<td class="l"><span class="tag '+(t.group==="Manager"?"n":"u")+'">'+esc(t.group)+'</span></td>'+
            '<td class="l">'+esc(t.type)+'</td>'+
            '<td class="l mono">'+esc(showDate(t.start))+(t.assumed?' <span class="tag open">year?</span>':'')+'</td>'+
            '<td class="l mono">'+esc(showDate(t.end))+'</td>'+
            '<td class="mono"><b>'+t.days+'</b></td>'+
            '<td class="l">'+esc(t.note||"")+'</td>'+
            '<td class="acts"><button class="btn sm" data-off="'+esc(t.id)+'">Edit</button></td></tr>';
        }).join("");
        otb.querySelectorAll("[data-off]").forEach(function(b){
          b.addEventListener("click",function(){
            offForm(live(ST.timeOff).filter(function(x){return x.id===b.getAttribute("data-off");})[0]);
          });
        });
      }
      root.querySelectorAll("#ogrp button").forEach(function(b){
        b.addEventListener("click",function(){
          root.querySelectorAll("#ogrp button").forEach(function(o){o.setAttribute("aria-pressed",o===b?"true":"false");});
          grp=b.getAttribute("data-v"); drawOff(offRows());
        });
      });
      root.querySelector("#oq").addEventListener("input",function(){ drawOff(offRows()); });
      tableSort(root.querySelector("#otab"), offRows, drawOff);
      drawOff(offRows().sort(function(a,b){ return a.start<b.start?1:-1; }));

      /* ================= balances ================= */
      function staffForm(existing){
        var isNew=!existing;
        openForm({
          title:isNew?"Add a person":"Edit "+existing.name,
          saveLabel:isNew?"Add":"Save changes",
          value: existing?Object.assign({},existing):{id:uid(), name:"", group:"Sales", hire:"", earned:null},
          fields:[
            {k:"name",label:"Name",wide:true},
            {k:"group",label:"Group",type:"select",opts:["Sales","Manager"]},
            {k:"hire",label:"Hire date",type:"date"},
            {k:"earned",label:"Days earned",type:"number"}
          ],
          validate:function(o){ return String(o.name).trim()?null:"Name is required."; },
          onSave:function(o){
            o.earned=n(o.earned); o.name=String(o.name).trim(); stamp(o);
            if (isNew) ST.staff.push(o);
            else { var i=ST.staff.findIndex(function(x){return x.id===o.id;}); if(i>=0) ST.staff[i]=o; }
          },
          onDelete: isNew?null:function(){ existing._del=true; stamp(existing); },
          deleteMsg:"Remove "+(existing?existing.name:"")+" from balances? Their booked time off stays in the log."
        });
      }
      var btb=root.querySelector("#btab tbody");
      function balRows(){
        return live(ST.staff).map(function(p){
          var used=usedBy(p.name);
          return Object.assign({},p,{used:used, left:(p.earned==null?null:p.earned-used)});
        });
      }
      function drawBal(list){
        btb.innerHTML = list.map(function(p){
          return '<tr><td class="l"><b>'+esc(p.name)+'</b></td>'+
            '<td class="l"><span class="tag '+(p.group==="Manager"?"n":"u")+'">'+esc(p.group)+'</span></td>'+
            '<td class="l mono">'+esc(p.hire?showDate(p.hire):"\u2014")+'</td>'+
            '<td class="mono">'+(p.earned==null?'<span class="dash">\u2014</span>':p.earned)+'</td>'+
            '<td class="mono">'+p.used+'</td>'+
            '<td class="mono"><b>'+(p.left==null?'<span class="dash">\u2014</span>':(p.left<0?'<span class="neg">'+p.left+'</span>':p.left))+'</b></td>'+
            '<td class="acts"><button class="btn sm" data-st="'+esc(p.id)+'">Edit</button></td></tr>';
        }).join("");
        btb.querySelectorAll("[data-st]").forEach(function(b){
          b.addEventListener("click",function(){
            staffForm(live(ST.staff).filter(function(x){return x.id===b.getAttribute("data-st");})[0]);
          });
        });
      }
      root.querySelector("#addStaff").addEventListener("click",function(){ staffForm(null); });
      tableSort(root.querySelector("#btab"), balRows, drawBal);
      drawBal(balRows().sort(function(a,b){ return a.name<b.name?-1:1; }));
    }};
}

function vLots(){
  var STATUS = [

    {k:"In service", cls:"svc"},
    {k:"Demo",       cls:"svc"},
    {k:"Sold",       cls:"sold"}
  ];
  function statCls(v){ var m=STATUS.filter(function(x){return x.k===v;})[0]; return m?m.cls:""; }
  function lots(){ return live(ST.lots); }
  function units(){ return live(ST.units); }
  function inLot(nm){ return units().filter(function(u){ return u.lot===nm; }).length; }

  var dupes = seedLotsAndUnits().dupes;
  var maxc = Math.max.apply(null, lots().map(function(l){ return inLot(l.name); })) || 1;

      '<div class="bar" style="width:'+(c/maxc*100).toFixed(1)+'%"></div>'+
      '<div class="edit"><button class="btn dark sm" data-lot="'+esc(l.id)+'">Rename</button></div></div>';
  }).join("");

  return { html: head("New Car","Lots.","Every unit by stock number, and where it is parked.",["Live"])+
    sessionBanner()+
    '<div class="strip">'+
      '<div class="tile"><div class="eyebrow">Units on the ground</div><div class="k num">'+units().length+'</div>'+
      '<dl><dt>Lots</dt><dd>'+lots().length+'</dd>'+

      '<dt>Held or sold</dt><dd>'+units().filter(function(u){return u.status==="Hold"||u.status==="Sold";}).length+'</dd></dl></div>'+

      }).join("")+
    '</div>'+
    (dupes.length? '<div class="warn"><b>'+dupes.length+' stock numbers were listed twice in the workbook</b> \u2014 '+
      dupes.map(function(x){return esc(x.stock);}).join(", ")+', all inside '+esc(dupes[0].lot)+
      '. A stock number is one car, so each is here once. That is why the count reads '+units().length+
      ' rather than the 229 lines the sheet had.</div>' : "")+

    '<h2 class="sec">By lot</h2><div class="lots">'+cards+
      '<div class="lot" style="border-left-color:var(--line)"><div class="eyebrow">New lot</div>'+
      '<div style="font-size:.8rem;color:var(--steel);margin:10px 0 14px">Somewhere else units get parked?</div>'+
      '<button class="btn dark sm" id="addLot">+ Add a lot</button></div></div>'+

    '<h2 class="sec">Every unit</h2><div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">Tick rows to move them together</div><h3>Stock list</h3></div>'+
    '<div><button class="btn" id="expUnits">Export CSV</button> <button class="btn primary" id="addUnit">+ Add unit</button></div></div>'+
    '<div class="bulkbar" id="bulk" hidden><span class="n" id="bulkn">0</span>'+
      '<label for="bulkTo">Move to</label>'+
      '<select id="bulkTo"></select>'+
      '<button class="btn sm" id="bulkGo">Move</button>'+
      '<span class="spacer"></span>'+
      '<button class="btn sm" id="bulkClear">Clear selection</button></div>'+
    '<div class="ctl">'+
      '<select class="pick" id="lotf"><option value="">All lots</option></select>'+
      '<select class="pick" id="statf"><option value="">Any status</option>'+
        STATUS.map(function(x){ return '<option>'+esc(x.k)+'</option>'; }).join("")+'</select>'+
      '<input class="search" id="uq" type="search" placeholder="Search stock # or model\u2026">'+
      '<span class="count" id="uc"></span></div>'+
    '<div class="tablewrap tall"><table id="utab"><thead><tr>'+
      '<th class="chk"><input type="checkbox" id="chkAll" aria-label="Select every row shown"></th>'+
      '<th class="l sortable" data-k="stock" data-t="s">Stock #</th>'+
      '<th class="l">Lot</th>'+
      '<th class="l sortable" data-k="model" data-t="s">Model</th>'+
      '<th class="l sortable" data-k="status" data-t="s">Status</th>'+
      '<th class="l sortable" data-k="note" data-t="s">Note</th>'+
      '<th></th></tr></thead><tbody></tbody></table></div></div>',

    init:function(root){
      var picked = {};

      function lotOpts(sel){
        return lots().map(function(l){
          return '<option value="'+esc(l.name)+'"'+(l.name===sel?" selected":"")+'>'+esc(l.name)+'</option>';
        }).join("");
      }
      root.querySelector("#lotf").innerHTML = '<option value="">All lots</option>'+lotOpts("");
      root.querySelector("#bulkTo").innerHTML = lotOpts("");

      function rows(){
        var lf=root.querySelector("#lotf").value, sf=root.querySelector("#statf").value,
            q=root.querySelector("#uq").value.trim().toUpperCase();
        return units().filter(function(u){
          if (lf && u.lot!==lf) return false;
          if (sf && u.status!==sf) return false;
          if (q && (u.stock+" "+(u.model||"")+" "+(u.note||"")).toUpperCase().indexOf(q)<0) return false;
          return true;
        }).sort(function(a,b){ return a.stock<b.stock?-1:a.stock>b.stock?1:0; });
      }

        var ids=Object.keys(picked).filter(function(k){return picked[k];});

        root.querySelector("#uc").textContent = list.length+" of "+units().length+" units";

          return '<tr'+(picked[u.id]?' class="picked"':'')+'>'+
            '<td class="chk"><input type="checkbox" data-pick="'+esc(u.id)+'"'+(picked[u.id]?" checked":"")+
              ' aria-label="Select '+esc(u.stock)+'"></td>'+
            '<td class="l mono"><b>'+esc(u.stock)+'</b></td>'+
            '<td class="l"><select class="lotpick" data-mv="'+esc(u.id)+'" aria-label="Lot for '+esc(u.stock)+'">'+

            '<td class="l"><span class="stat '+statCls(u.status)+'">'+esc(u.status||"\u2014")+'</span></td>'+
            '<td class="l">'+esc(u.note||"")+'</td>'+
            '<td class="acts"><button class="btn sm" data-ed="'+esc(u.id)+'">Edit</button></td></tr>';
        }).join("");

        tb.querySelectorAll("[data-mv]").forEach(function(sel){
          sel.addEventListener("change",function(){
            var u=units().filter(function(x){return x.id===sel.getAttribute("data-mv");})[0];
            if(!u) return;
            u.lot=sel.value; stamp(u); touch();
          });
        });
        tb.querySelectorAll("[data-pick]").forEach(function(cb){
          cb.addEventListener("change",function(){
            picked[cb.getAttribute("data-pick")] = cb.checked;
            cb.closest("tr").classList.toggle("picked", cb.checked);
            paintBulk();
          });
        });
        tb.querySelectorAll("[data-ed]").forEach(function(b){
          b.addEventListener("click",function(){
            unitForm(units().filter(function(x){return x.id===b.getAttribute("data-ed");})[0]);
          });
        });
        var all=root.querySelector("#chkAll");
        all.checked = list.length>0 && list.every(function(u){ return picked[u.id]; });
        paintBulk();
      }
      function refresh(){ draw(rows()); }

      root.querySelector("#chkAll").addEventListener("change",function(){
        var on=this.checked;
        rows().forEach(function(u){ picked[u.id]=on; });
        refresh();
      });
      root.querySelector("#bulkClear").addEventListener("click",function(){ picked={}; refresh(); });
      root.querySelector("#bulkGo").addEventListener("click",function(){
        var to=root.querySelector("#bulkTo").value;
        var ids=Object.keys(picked).filter(function(k){return picked[k];});
        if (!ids.length || !to) return;
        pushUndo();
        units().forEach(function(u){ if (picked[u.id] && u.lot!==to){ u.lot=to; stamp(u); } });
        picked={}; touch();
      });
      ["#lotf","#statf"].forEach(function(id){ root.querySelector(id).addEventListener("change",refresh); });
      root.querySelector("#uq").addEventListener("input",refresh);

      function unitForm(existing){
        var isNew=!existing;
        openForm({
          title: isNew?"Add a unit":"Edit "+existing.stock,
          saveLabel: isNew?"Add":"Save changes",
          value: existing?Object.assign({},existing)
                         :{id:uid(), stock:"", lot:(lots()[0]||{}).name||"", model:"", status:"On lot", note:""},
          fields:[
            {k:"stock",label:"Stock #",ph:"C5601"},
            {k:"lot",label:"Lot",type:"select",opts:lots().map(function(l){return l.name;})},
            {k:"model",label:"Model",wide:true,ph:"CX-5 Preferred"},
            {k:"status",label:"Status",type:"select",opts:STATUS.map(function(x){return x.k;})},
            {k:"note",label:"Note",wide:true}
          ],
          validate:function(o){
            var st=String(o.stock).trim();
            if(!st) return "Stock # is required.";
            var clash=units().filter(function(u){ return u.id!==o.id && u.stock.toUpperCase()===st.toUpperCase(); });
            return clash.length ? st+" is already on the "+clash[0].lot+" lot." : null;
          },
          onSave:function(o){
            o.stock=String(o.stock).trim(); stamp(o);
            if (isNew) ST.units.push(o);
            else { var i=ST.units.findIndex(function(x){return x.id===o.id;}); if(i>=0) ST.units[i]=o; }
          },
          onDelete: isNew?null:function(){ existing._del=true; stamp(existing); },
          deleteMsg:"Remove "+(existing?existing.stock:"")+" from inventory?"
        });

      root.querySelector("#addUnit").addEventListener("click",function(){ unitForm(null); });

      root.querySelector("#expUnits").addEventListener("click",function(){
        var h=["STOCK #","LOT","MODEL","STATUS","NOTE"];
        var b=rows().map(function(u){ return [u.stock,u.lot,u.model,u.status,u.note]; });
        download("new-car-inventory-"+todayISO()+".csv", csv([h].concat(b)), "text/csv");
      });

      function lotForm(existing){
        var isNew=!existing;
        openForm({
          title:isNew?"Add a lot":"Rename "+existing.name,
          saveLabel:isNew?"Add":"Save",
          sub:isNew?"":"Renaming moves every unit parked here with it.",
          value: existing?{id:existing.id,name:existing.name}:{id:uid(),name:""},
          fields:[{k:"name",label:"Lot name",wide:true,ph:"Overflow"}],
          validate:function(o){
            var nm=String(o.name).trim();
            if(!nm) return "Give the lot a name.";
            var clash=lots().filter(function(l){ return l.id!==o.id && l.name.toUpperCase()===nm.toUpperCase(); });
            return clash.length ? "There is already a lot called "+nm+"." : null;
          },
          onSave:function(o){
            var nm=String(o.name).trim();
            if (isNew){ ST.lots.push(stamp({id:o.id, name:nm})); return; }
            var was=existing.name;
            if (was!==nm) units().forEach(function(u){ if(u.lot===was){ u.lot=nm; stamp(u); } });
            existing.name=nm; stamp(existing);
          },
          onDelete: isNew?null:function(){
            var n2=inLot(existing.name);
            if (n2){ window.alert(existing.name+" still has "+n2+" units on it. Move them first."); return; }
            existing._del=true; stamp(existing);
          },
          deleteMsg:"Delete this lot?"
        });
      }
      root.querySelector("#addLot").addEventListener("click",function(){ lotForm(null); });
      root.querySelectorAll("[data-lot]").forEach(function(b){
        b.addEventListener("click",function(){
          lotForm(lots().filter(function(l){return l.id===b.getAttribute("data-lot");})[0]);
        });
      });

      tableSort(root.querySelector("#utab"), rows, draw);
      refresh();
    }};
}

function vSheets(){

      function draw(){
        var nm=sel.value, sh=WB[nm], base=off(nm), term=q.value.trim().toUpperCase(), ncol=0;

      q.addEventListener("input",draw);

    }};
}

function vHistory(){
  var months = closedMonths();
  if (!months.length){
    return { html: head("Past","Months.","Closed months land here \u2014 the deals stay, they just stop counting toward the live board.",["Live"])+
      '<div class="today-empty"><p>No months closed yet. When '+esc(ST.settings.monthLabel)+
      ' is finished, use <b>Month &amp; goals \u2192 Close the month</b>. Nothing is deleted \u2014 the deals move here and the board starts fresh.</p>'+
      '<button class="btn primary" id="goSetup">Go to Month &amp; goals</button></div>',
      init:function(root){
        root.querySelector("#goSetup").addEventListener("click",function(){ location.hash="#setup"; });
      }};
  }

  var rows = months.map(function(m){
    var sum = monthSummary(archivedDeals(m.id), m);
    sum.id=m.id; sum.label=m.label; sum.goalTotal=m.goalTotal;
    sum.csi = (m.csiMonth!=null? m.csiMonth : m.csi3);
    return sum;
  });
  rows.forEach(function(r,i){
    var prev = rows[i+1];   // newest first, so the next entry is the prior month
    r.dUnits = prev ? r.units-prev.units : null;
    r.dGross = prev ? r.gross-prev.gross : null;
    r.dPvr   = prev ? r.pvr-prev.pvr : null;
  });
  var maxG = Math.max.apply(null, rows.map(function(r){return r.gross;})) || 1;

  function delta(v, fmt){
    if (v==null) return '<span class="dash">\u2014</span>';
    return '<span class="'+(v>=0?"":"neg")+'">'+(v>=0?"+":"\u2212")+fmt(Math.abs(v))+'</span>';
  }

  return { html: head("Past","Months.","Every closed month, side by side. The deals are still here and still searchable.",["Live"])+
    '<h2 class="sec">Closed months</h2><div class="lots">'+
    rows.map(function(r){
      return '<div class="lot"><div class="eyebrow">'+esc(r.label)+'</div>'+
        '<div class="n num">'+r.units+'</div>'+
        '<div style="font-size:.78rem;color:var(--steel)">units \u00b7 '+money(r.gross)+' \u00b7 '+money(r.pvr)+' PVR</div>'+
        '<div class="bar" style="width:'+(r.gross/maxG*100).toFixed(1)+'%"></div>'+
        '<div style="margin-top:12px;font-size:.74rem;color:var(--steel)">New '+r.newU+' \u00b7 Used '+r.usedU+
        (r.goalTotal?'<br>Goal was '+r.goalTotal+' \u00b7 '+Math.round(r.units/r.goalTotal*100)+'% hit':'')+'</div></div>';
    }).join("")+'</div>'+
    '<h2 class="sec">Month over month</h2><div class="panel"><div class="tablewrap"><table><thead><tr>'+
      '<th class="l">Month</th><th>Units</th><th>vs prior</th><th>Gross</th><th>vs prior</th>'+
      '<th>PVR</th><th>vs prior</th><th>Beasley</th><th>C.S.I.</th></tr></thead><tbody>'+
      rows.map(function(r){
        return '<tr><td class="l"><b>'+esc(r.label)+'</b></td>'+
          '<td class="mono">'+r.units+'</td><td class="mono">'+delta(r.dUnits,function(v){return v;})+'</td>'+
          '<td class="mono">'+money(r.gross)+'</td><td class="mono">'+delta(r.dGross,function(v){return money(v);})+'</td>'+
          '<td class="mono">'+money(r.pvr)+'</td><td class="mono">'+delta(r.dPvr,function(v){return money(v);})+'</td>'+
          '<td class="mono">'+(r.beas==null?'\u2014':r.beas.toFixed(1)+"%")+'</td>'+
          '<td class="mono">'+(r.csi!=null?r.csi:'\u2014')+'</td></tr>';
      }).join("")+'</tbody></table></div></div>'+
    '<h2 class="sec">Look inside a month</h2><div class="panel">'+
    '<div class="ctl"><select class="pick" id="mpick">'+
      rows.map(function(r){ return '<option value="'+esc(r.id)+'">'+esc(r.label)+' \u2014 '+r.units+' deals</option>'; }).join("")+
      '</select>'+
      '<input class="search" id="mq" type="search" placeholder="Search customer, stock, deal #\u2026">'+
      '<span class="count" id="mc"></span>'+
      '<button class="btn sm" id="mcsv">Export CSV</button>'+
      '<span class="spacer"></span>'+
      '<button class="btn sm danger" id="mdel">Delete this month</button></div>'+
    '<div id="mlead"></div>'+
    '<div class="tablewrap tall"><table id="mtbl"><thead><tr>'+
      '<th class="l sortable" data-k="date" data-t="s">Date</th><th class="l sortable" data-k="deal" data-t="s">Deal #</th>'+
      '<th class="l sortable" data-k="stock" data-t="s">Stock</th><th class="l sortable" data-k="customer" data-t="s">Customer</th>'+
      '<th class="l sortable" data-k="s1" data-t="s">Sold by</th><th class="l sortable" data-k="type" data-t="s">Type</th>'+
      '<th class="l sortable" data-k="make" data-t="s">Vehicle</th>'+
      '<th class="sortable" data-k="total">Deal gross</th></tr></thead><tbody></tbody></table></div></div>',
    init:function(root){
      var sel=root.querySelector("#mpick"), q=root.querySelector("#mq"), tb=root.querySelector("#mtbl tbody");
      function pool(){
        var term=q.value.trim().toUpperCase();
        return archivedDeals(sel.value).map(function(d){ return Object.assign({},d,{total:dealGross(d)}); })
          .filter(function(d){
            if(!term) return true;
            return [d.deal,d.stock,d.customer,d.make,d.model,d.s1,d.s2,d.type,showDate(d.date)].join(" ").toUpperCase().indexOf(term)>=0;
          });
      }
      function lead(){
        var per={};
        archivedDeals(sel.value).forEach(function(d){
          var cr=credits(d), g=dealGross(d);
          Object.keys(cr).forEach(function(nm){
            per[nm]=per[nm]||{name:nm,u:0,g:0}; per[nm].u+=cr[nm]; per[nm].g+=g*cr[nm];
          });
        });
        var list=Object.keys(per).map(function(k){return per[k];}).sort(function(a,b){return b.u-a.u;}).slice(0,5);
        root.querySelector("#mlead").innerHTML = list.length
          ? '<div class="chips">'+list.map(function(p){
              return '<div class="chip"><div class="cl">'+esc(p.name)+'</div><div class="cv">'+num1(p.u)+'</div>'+
                '<div class="cl" style="margin-top:3px">'+money(p.g)+'</div></div>'; }).join("")+'</div>'
          : "";
      }
      function draw(list){
        root.querySelector("#mc").textContent = list.length+" deals \u00b7 "+money(list.reduce(function(a,d){return a+d.total;},0));
        tb.innerHTML = list.map(function(d){
          return '<tr><td class="l mono">'+esc(showDate(d.date))+'</td><td class="l mono">'+esc(d.deal)+'</td>'+
            '<td class="l mono">'+esc(d.stock)+'</td><td class="l">'+(d.customer?esc(d.customer):'<span class="dash">\u2014</span>')+'</td>'+
            '<td class="l">'+esc(people(d).join(" / "))+'</td><td class="l">'+esc(d.type)+
            '<span class="tag '+(d.kind==="New"?"n":"u")+'">'+esc(d.kind)+'</span></td>'+
            '<td class="l">'+esc(d.make)+' '+esc(d.model)+'</td>'+
            '<td class="mono"><b>'+cellOr(money(d.total),d.total<0)+'</b></td></tr>';
        }).join("");
      }
      function refresh(){ lead(); draw(pool()); }
      sel.addEventListener("change",function(){ q.value=""; refresh(); });
      q.addEventListener("input",refresh);
      root.querySelector("#mcsv").addEventListener("click",function(){
        var h=["DAY","DATE","DEAL #","STOCK #","CUSTOMER","SALES 1","SALES 2","DEAL TYPE","BEASLEY ADV","MAKE","MODEL","TRADE","FRONT GROSS","BACK GROSS","DEAL GROSS","NEW/USED"];
        var b=pool().map(function(d){ return [dow(d.date),showDate(d.date),d.deal,d.stock,d.customer,d.s1,d.s2,d.type,d.adv,d.make,d.model,d.trade,n(d.front)||0,n(d.back)||0,d.total,d.kind]; });
        download("deals-"+sel.value+".csv", csv([h].concat(b)), "text/csv");
      });
      root.querySelector("#mdel").addEventListener("click",function(){
        var key=sel.value, cnt=archivedDeals(key).length;
        if (!window.confirm("Permanently delete "+labelFor(key)+" and its "+cnt+" deals?\n\nExport the CSV first if you want a copy. Undo will bring it back, but only before you close the page.")) return;
        pushUndo();
        ST.deals.forEach(function(d){ if(d._arch===key && !d._del){ d._del=true; stamp(d); } });
        (ST.months||[]).forEach(function(m){ if(m.id===key){ m._del=true; stamp(m); } });
        touch();
      });
      tableSort(root.querySelector("#mtbl"), pool, draw);
      refresh();
    }};
}

function vForms(){
  var M = derive();
  var STORE = "Roger Beasley Mazda Central";

  function line(id, cls, val, ph){
    return '<input class="fs-line'+(cls?" "+cls:"")+'" id="'+id+'" type="text"'+
      (val!==undefined&&val!==null&&val!==""?' value="'+esc(val)+'"':'')+
      (ph?' placeholder="'+esc(ph)+'"':'')+'>';
  }
  function field(lbl, id, cls, val, ph){
    return '<div class="fs-f"><label for="'+id+'">'+esc(lbl)+'</label>'+line(id,cls,val,ph)+'</div>';
  }

  /* ---------- Daily work plan ---------- */
  /* Who is on with you. Read from the shift grid for the day the form is printed,
     less anyone booked off, so a Tuesday print shows Tuesday's crew. */
  var DCODE = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  function crewFor(iso){
    var dt = new Date(iso+"T12:00:00");
    if (isNaN(dt)) return null;
    var code = DCODE[dt.getDay()];
    var pretty = dt.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
    if (dt.getDay()===0) return {closed:true, label:pretty, code:code};

    var away = {};
    live(ST.timeOff).forEach(function(t){
      if (t.start && t.end && iso>=t.start && iso<=t.end)
        away[String(t.name).toUpperCase().split(/\s+/)[0]] = true;
    });
    function isAway(nm){ return !!away[String(nm).toUpperCase().split(/\s+/)[0]]; }

    var day = (ST.schedule||[]).filter(function(d){ return d.day===code; })[0] || {assign:{}};
    var open=[], close=[], off=[];
    Object.keys(day.assign||{}).sort().forEach(function(nm){
      var v=day.assign[nm];
      if (isAway(nm)){ off.push(nm); return; }
      if (v==="open") open.push(nm);
      else if (v==="close") close.push(nm);
      else if (v==="off") off.push(nm);
    });
    function duty(list){
      var out=[];
      live(list||[]).forEach(function(m){
        var v=(m.assign||{})[code];
        if (!v || v==="off") return;
        if (isAway(m.name)) return;
        out.push(m.name + (v==="bells" ? "" : v==="open" ? " (open)" : " (close)"));
      });
      return out;
    }
    return {closed:false, label:pretty, code:code,
            open:open, close:close, off:off,
            mgr:duty(ST.mgrShifts), fin:duty(ST.finShifts)};
  }

  function matchSpecialist(nm){
    var want=String(nm||"").trim().toUpperCase();
    if (!want) return null;
    var exact=M.per.filter(function(x){ return x.name.toUpperCase()===want; })[0];
    if (exact) return exact;
    if (want.length>=3){
      var pre=M.per.filter(function(x){ return x.name.toUpperCase().indexOf(want)===0; });
      if (pre.length===1) return pre[0];
    }
    return null;
  }
  function planSheet(who, idx, iso){
    var p = matchSpecialist(who) || {};
    var pre = "wp"+idx+"_";
    function tableRows(n2, prefix, cols){
      var out="";
      for (var i=1;i<=n2;i++){
        out += '<tr><td class="num">'+i+'</td>'+cols.map(function(c){
          return '<td>'+line(pre+prefix+i+"_"+c.k, c.cls)+'</td>';
        }).join("")+'</tr>';
      }
      return out;
    }
    function prospectBlocks(n2, prefix){
      var out="";
      for (var i=1;i<=n2;i++){
        out += '<div class="fs-block">'+
          '<div class="fs-row">'+
            field("Customer name", pre+prefix+i+"_name")+
            field("Phone number", pre+prefix+i+"_phone", "mono")+
          '</div>'+
          '<div class="fs-f"><label for="'+pre+prefix+i+'_do">What can we do?</label>'+
          '<textarea class="fs-line" id="'+pre+prefix+i+'_do" rows="2"></textarea></div>'+
        '</div>';
      }
      return out;
    }
    return '<div class="formsheet plan" data-sheet="plan">'+
      '<div class="fs-head"><div><div class="fs-store">'+esc(STORE)+'</div>'+
        '<h3 class="fs-title">Daily Work Plan</h3></div>'+
        '<div class="fs-ctl">Top 3</div></div>'+
      '<div class="fs-row">'+
        field("Product specialist", pre+"who", "", who||"")+
        field("Date", pre+"date", "mono", showDate(iso))+
      '</div>'+
      '<div class="fs-row">'+
        field("Monthly goal", pre+"goal", "big", (p.goal!=null? p.goal : ""))+
        field("Monthly sold", pre+"sold", "big", who? num1(p.tU) : "")+
        field("Units to go", pre+"togo", "big", (p.goal!=null? Math.max(0, p.goal - (p.tU||0)) : ""))+
      '</div>'+
      '<div class="fs-sec">Today\u2019s appointments</div>'+
      '<table class="fs-table"><colgroup><col style="width:26px"><col style="width:44%"><col></colgroup>'+
      '<thead><tr><th></th><th>Name</th><th>Phone number</th></tr></thead>'+
      '<tbody>'+tableRows(3,"appt",[{k:"name"},{k:"phone",cls:"mono"}])+'</tbody></table>'+
      '<div class="fs-sec">Top prospects</div>'+ prospectBlocks(3,"prosp")+
      '<div class="fs-sec">Problems or things owed to a customer</div>'+ prospectBlocks(1,"owed")+
      '<div class="fs-sign">'+
        field("Specialist signature", pre+"sig1")+
        field("Manager", pre+"sig2")+
      '</div></div>';
  }

  /* ---------- Check request ---------- */
  var cr = '<div class="formsheet" data-sheet="check">'+
    '<div class="fs-head"><div><div class="fs-store">'+esc(STORE)+'</div>'+
      '<h3 class="fs-title">Check Request</h3></div>'+
      '<div class="fs-ctl">Control #<br>'+line("cr_control","mono")+'</div></div>'+
    '<div class="fs-row">'+
      field("Date", "cr_date", "mono", showDate(todayISO()))+
      field("Pay to", "cr_to", "", "", "Payee")+
    '</div>'+
    '<div class="fs-row">'+
      field("Deal #", "cr_deal", "mono")+
      field("Customer #", "cr_custno", "mono")+
    '</div>'+
    '<div class="fs-row">'+
      field("Customer name", "cr_cust")+
    '</div>'+
    '<div class="fs-row">'+
      field("Stock / trade", "cr_stock", "mono", "", "PURCHASE S0000 / TRADE S0000A")+
    '</div>'+
    '<div class="fs-sec">Accounting</div>'+
    '<div class="fs-row">'+
      field("Account", "cr_acct", "mono")+
      field("ID", "cr_id", "mono")+
      field("Amount", "cr_amount", "mono")+
    '</div>'+
    '<div class="fs-sec">Explanation</div>'+
    '<textarea class="fs-line" id="cr_why" rows="4" placeholder="Trade equity, rebate, we-owe\u2026"></textarea>'+
    '<div class="fs-total"><span class="lbl">Amount of check</span>'+
      '<input class="fs-line" id="cr_total" type="text" inputmode="decimal" placeholder="$0.00"></div>'+
    '<p class="fs-note">Amount of check follows what you type above. Overwrite it if they differ.</p>'+
    '<div class="fs-sign">'+
      field("Requested by", "cr_by")+
      field("Approved by", "cr_appr")+
    '</div></div>';

  var specs = ACT().roster.filter(function(r){ return r.team!=="House"; });

  return { html: head("Printable","Forms.",
      "The two forms off the workbook, laid out for letter paper. Fill the check request on screen and print it, or print blanks for the board.",
      ["TOP 3","CHECK REQUEST"])+
    '<h2 class="sec">Check request</h2>'+
    '<div class="printbar"><button class="btn primary" id="prCheck">Print this form</button>'+
      '<button class="btn" id="clrCheck">Clear</button>'+
      '<span class="spacer"></span>'+
      '<span class="count">Typing here is not saved \u2014 print it before you leave the page.</span></div>'+
    cr+
    '<h2 class="sec">Daily work plan</h2>'+
    '<div class="printbar">'+
      '<input class="search" id="wpDate" type="date" value="'+esc(todayISO())+'" style="min-width:150px" aria-label="Date for the work plan">'+
      '<select class="pick" id="wpWho">'+
      '<optgroup label="Whoever is on that day">'+
        '<option value="__open">Openers</option>'+
        '<option value="__close">Closers</option>'+
        '<option value="__onfloor">Everyone on the floor</option>'+
      '</optgroup>'+
      '<optgroup label="Everyone">'+
        '<option value="">Blank form</option>'+
        '<option value="__all">All specialists ('+specs.length+')</option>'+
      '</optgroup>'+

    init:function(root){

        root.querySelectorAll(".formsheet").forEach(function(el){

        });
        window.print();
        setTimeout(function(){
          root.querySelectorAll(".formsheet").forEach(function(el){ el.removeAttribute("data-hide"); });
        }, 400);
      }
      root.querySelector("#prCheck").addEventListener("click",function(){ onlyPrint('[data-sheet="check"]'); });
      root.querySelector("#prPlan").addEventListener("click",function(){ onlyPrint('[data-sheet="plan"]'); });
      root.querySelector("#clrCheck").addEventListener("click",function(){
        root.querySelectorAll('[data-sheet="check"] .fs-line').forEach(function(el){ el.value=""; });
        root.querySelector("#cr_date").value = showDate(todayISO());
      });

      var host=root.querySelector("#wpHost");
      function planDate(){
        var v=root.querySelector("#wpDate").value;
        return v || todayISO();
      }
      /* A shift group is only useful if the names match the specialist list —
         the schedule carries porters and short forms too. Anyone rostered who is
         not a specialist still gets a sheet, just without month-to-date units. */
      function shiftGroup(kind){
        var c = crewFor(planDate());
        if (!c) return {names:[], why:"that date is not valid"};
        if (c.closed) return {names:[], why:"the store is closed Sundays"};
        var names = kind==="open" ? c.open : kind==="close" ? c.close : c.open.concat(c.close);
        if (!names.length) return {names:[], why:"nobody is set to "+
          (kind==="open"?"open":kind==="close"?"close":"work")+" on "+c.code+" yet"};
        return {names:names.slice().sort(), why:"", label:c.label};
      }
      function renderPlan(){
        var v=root.querySelector("#wpWho").value;
        var note=root.querySelector("#wpNote");
        var iso=planDate();

        if (v==="__open" || v==="__close" || v==="__onfloor"){
          var kind = v==="__open" ? "open" : v==="__close" ? "close" : "both";
          var g = shiftGroup(kind);

            host.innerHTML = '<div class="today-empty"><p>Nothing to print \u2014 '+esc(g.why)+
              '. Set the week on the <b>Schedule</b> tab, or pick another date.</p></div>';
            note.textContent = "No forms for this selection.";
            return;
          }
          host.innerHTML = g.names.map(function(nm,i){ return planSheet(nm, i+1, iso); }).join("");
          note.textContent = g.names.length+" "+
            (kind==="open"?"openers":kind==="close"?"closers":"on the floor")+
            " on "+g.label+" \u2014 one page each.";
          return;
        }
        if (v==="__all"){
          host.innerHTML = specs.map(function(r,i){ return planSheet(r.name, i+1, iso); }).join("");
          note.textContent = specs.length+" forms \u2014 one page each.";
          return;
        }
        host.innerHTML = planSheet(v, 0, iso);
        note.textContent = v ? v+"\u2019s month-to-date units are filled in."
                             : "Pick a date, then a person or a shift group.";
      }
      root.querySelector("#wpWho").addEventListener("change", renderPlan);
      root.querySelector("#wpDate").addEventListener("change", renderPlan);

      // amount of check mirrors the accounting amount until it is typed over
      var amt=root.querySelector("#cr_amount"), tot=root.querySelector("#cr_total");
      var touched=false;
      tot.addEventListener("input",function(){ touched=true; });
      amt.addEventListener("input",function(){
        if (touched) return;
        var v=n(amt.value);
        tot.value = v==null ? "" : money(v,2);
      });
    }};
}

/* ============================================================
   VIEW: SPECIALIST SCORECARD
   ============================================================ */
function vPerson(){
  var M = derive();
  var el = Math.max(1, liveDaysElapsed()||1), tot = liveDaysTotal()||1;
  var byUnits = M.per.slice().sort(function(a,b){ return b.tU-a.tU; });
  var names = byUnits.filter(function(p){ return p.name.toUpperCase()!=="HOUSE"; });

  if (!names.length){
    return { html: head("Specialist","Scorecard.","Per-person numbers, straight off the deal log.",["Live"])+
      '<div class="today-empty"><p>No deals credited to anyone yet this month.</p></div>', init:function(){} };
  }

  ST._scWho = ST._scWho && names.some(function(p){return p.name===ST._scWho;}) ? ST._scWho : names[0].name;

  function deals(nm){
    return ACT().deals.filter(function(d){ return people(d).indexOf(nm)>=0; });
  }
  function pick(nm){ return M.per.filter(function(p){ return p.name===nm; })[0] || {}; }

  function card(nm){
    var p = pick(nm), mine = deals(nm);
    var rank = byUnits.map(function(x){return x.name;}).indexOf(nm)+1;

    /* pace = where the month ends if they keep this up */
    var pace = Math.round(p.tU/el*tot);
    var goal = p.goal;
    var pct  = goal ? Math.min(100, p.tU/goal*100) : 0;
    var mark = Math.min(100, el/tot*100);
    var hit  = goal!=null && p.tU>=goal;

    var verdict;
    if (goal==null) verdict = 'No goal set yet \u2014 add one under <b>Month &amp; goals</b> to track pace.';
    else if (hit)   verdict = '<span class="go">Goal hit</span> with '+(tot-el)+' selling day'+((tot-el)===1?"":"s")+' left.';
    else {
      var need = goal - p.tU, left = Math.max(0, tot-el);
      var per = left ? need/left : need;
      verdict = '<b>'+num1(need)+'</b> to go, <b>'+left+'</b> day'+(left===1?"":"s")+' left \u2014 '+
        (left ? 'about <b>'+(per<1?per.toFixed(1):Math.ceil(per))+' a day</b>. ' : '')+
        '<span class="'+(pace>=goal?"go":pace>=goal*0.9?"hold":"miss")+'">On pace for '+pace+'</span>.';
    }

    /* stats worth looking at, all derived from their own deals */
    var trades = mine.filter(function(d){ return String(d.trade).toUpperCase()==="YES"; }).length;
    var splits = mine.filter(function(d){ return people(d).length>1; }).length;
    var partners = {};
    mine.forEach(function(d){
      people(d).forEach(function(x){ if (x!==nm) partners[x]=(partners[x]||0)+1; });
    });
    var types = {}, makes = {}, days = {};
    mine.forEach(function(d){
      types[d.type||"\u2014"] = (types[d.type||"\u2014"]||0)+1;
      makes[d.make||"\u2014"] = (makes[d.make||"\u2014"]||0)+1;
      var k = dow(d.date) || "\u2014"; days[k]=(days[k]||0)+1;
    });
    function topOf(o){
      var k = Object.keys(o).sort(function(a,b){ return o[b]-o[a]; })[0];
      return k ? {k:k, n:o[k]} : null;
    }
    var bestDay = topOf(days), bestMake = topOf(makes), bestType = topOf(types);
    var bestPartner = topOf(partners);
    var teamPvr = M.pvr;
    var pvrGap = (p.tP!=null && teamPvr) ? p.tP - teamPvr : null;

    function stat(l, v, d){
      return '<div class="sc-stat"><div class="l">'+esc(l)+'</div><div class="v num">'+v+'</div>'+
        (d?'<div class="d">'+d+'</div>':'')+'</div>';
    }
    function mix(title, obj, total){
      var keys = Object.keys(obj).sort(function(a,b){ return obj[b]-obj[a]; }).slice(0,5);
      var cols = ["#C41230","#C98A2B","#2E8B5E","#5B8FB9","#7A6E9A"];
      return '<div class="lot"><div class="eyebrow">'+esc(title)+'</div>'+
        '<div class="mixbar">'+keys.map(function(k,i){
          return '<span style="width:'+(obj[k]/total*100).toFixed(1)+'%;background:'+cols[i%cols.length]+'"></span>';
        }).join("")+'</div>'+
        '<div class="mixkey">'+keys.map(function(k,i){
          return '<div><i style="background:'+cols[i%cols.length]+'"></i>'+esc(k)+' \u00b7 '+obj[k]+'</div>';
        }).join("")+'</div></div>';
    }

    return '<div class="sc-hero">'+
      '<div class="sc-main">'+
        '<div class="who">'+esc(nm)+'</div>'+
        '<div class="sub">'+esc(p.team||"")+' desk \u00b7 <span class="sc-rank">#'+rank+'</span> of '+names.length+' by units</div>'+
        '<div class="sc-prog">'+
          '<div class="nums"><span class="big">'+num1(p.tU)+'</span>'+
          '<span class="of">'+(goal!=null? 'of '+goal+' units' : 'units \u00b7 no goal set')+'</span></div>'+
          '<div class="sc-track">'+
            '<div class="'+(hit?"hit":"")+'" style="width:'+pct.toFixed(1)+'%"></div>'+
            (goal!=null? '<b style="left:'+mark.toFixed(1)+'%"></b>'+
              '<span class="flag" style="left:'+mark.toFixed(1)+'%">Today</span>' : '')+
          '</div>'+
          '<div class="sc-verdict">'+verdict+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="sc-side">'+
        stat("Gross", money(p.tG), p.tU? money(p.tP)+" PVR" : "")+
        stat("PVR vs team", p.tP==null?"\u2014":money(p.tP),
          pvrGap==null?"":'<span class="'+(pvrGap>=0?"up":"dn")+'">'+(pvrGap>=0?"+":"\u2212")+money(Math.abs(pvrGap))+
          '</span> vs '+money(teamPvr))+
        stat("New / Used", num1(p.nU)+" / "+num1(p.uU),
          (p.nP!=null? money(p.nP):"\u2014")+" / "+(p.uP!=null? money(p.uP):"\u2014")+" PVR")+
        stat("Beasley", p.bPct==null?"\u2014":p.bPct.toFixed(0)+"%",
          p.bDen? p.bNum+" of "+p.bDen+" eligible" : "")+
        stat("Trades", trades, mine.length? Math.round(trades/mine.length*100)+"% of deals" : "")+
        stat("Splits", splits, bestPartner? "most with "+esc(bestPartner.k) : "none")+
      '</div>'+
    '</div>'+

    '<div class="sc-split">'+
      mix("Deal types", types, mine.length)+
      mix("Makes sold", makes, mine.length)+
      '<div class="lot"><div class="eyebrow">Patterns</div>'+
        '<div style="margin-top:10px;font-size:.8rem;color:var(--steel);line-height:1.9">'+
        (bestDay? '<div>Best day \u00b7 <b style="color:var(--paper)">'+esc(bestDay.k)+'</b> ('+bestDay.n+' deals)</div>':'')+
        (bestMake? '<div>Most sold \u00b7 <b style="color:var(--paper)">'+esc(bestMake.k)+'</b> ('+bestMake.n+')</div>':'')+
        (bestType? '<div>Usual deal \u00b7 <b style="color:var(--paper)">'+esc(bestType.k)+'</b> ('+bestType.n+')</div>':'')+
        '<div>Deals touched \u00b7 <b style="color:var(--paper)">'+mine.length+'</b></div>'+
        '</div></div>'+
    '</div>'+

    '<h2 class="sec">Their deals</h2><div class="panel">'+
    '<div class="ph"><div><div class="eyebrow">'+esc(ST.settings.monthLabel)+'</div>'+
      '<h3>'+mine.length+' deals</h3></div>'+
      '<div><button class="btn" id="scCsv">Export CSV</button></div></div>'+
    '<div class="tablewrap tall"><table id="sctab"><thead><tr>'+
      '<th class="l sortable" data-k="date" data-t="s">Date</th>'+
      '<th class="l sortable" data-k="deal" data-t="s">Deal #</th>'+
      '<th class="l sortable" data-k="customer" data-t="s">Customer</th>'+
      '<th class="l sortable" data-k="type" data-t="s">Type</th>'+
      '<th class="l sortable" data-k="make" data-t="s">Vehicle</th>'+
      '<th class="l">With</th>'+
      '<th class="sortable" data-k="credit">Credit</th>'+
      '<th class="sortable" data-k="mine">Their gross</th></tr></thead>'+
      '<tbody></tbody><tfoot><tr></tr></tfoot></table></div></div>';
  }

  return { html: head("Specialist","Scorecard.",
      "One person at a time \u2014 goal, pace, mix and every deal they touched.",["Live"])+
    '<div class="sc-pick" id="scPick" role="group" aria-label="Choose a specialist">'+
      names.map(function(p){
        return '<button data-n="'+esc(p.name)+'" aria-pressed="'+(p.name===ST._scWho?"true":"false")+'">'+
          esc(p.name)+'<span class="u">'+num1(p.tU)+'</span></button>';
      }).join("")+'</div>'+
    '<div id="scBody">'+card(ST._scWho)+'</div>',

    init:function(root){
      function wire(){
        var nm = ST._scWho;
        var mine = deals(nm).map(function(d){
          var cr = credits(d)[nm] || 0;
          return Object.assign({}, d, {credit:cr, mine:dealGross(d)*cr,
            withWho: people(d).filter(function(x){ return x!==nm; }).join(", ")});
        });
        var tb=root.querySelector("#sctab tbody"), tf=root.querySelector("#sctab tfoot tr");
        function draw(list){
          tb.innerHTML = list.map(function(d){
            return '<tr><td class="l mono">'+esc(showDate(d.date))+'</td>'+
              '<td class="l mono">'+esc(d.deal)+'</td>'+
              '<td class="l">'+(d.customer?esc(d.customer):'<span class="dash">\u2014</span>')+'</td>'+
              '<td class="l">'+esc(d.type)+'<span class="tag '+(d.kind==="New"?"n":"u")+'">'+esc(d.kind)+'</span></td>'+
              '<td class="l">'+esc(d.make)+' '+esc(d.model)+'</td>'+
              '<td class="l">'+(d.withWho?esc(d.withWho):'<span class="dash">\u2014</span>')+'</td>'+
              '<td class="mono">'+num1(d.credit)+'</td>'+
              '<td class="mono"><b>'+cellOr(money(d.mine), d.mine<0)+'</b></td></tr>';
          }).join("");
          var cu=list.reduce(function(a,d){return a+d.credit;},0);
          var cg=list.reduce(function(a,d){return a+d.mine;},0);
          tf.innerHTML='<td colspan="6" class="l">Credited to '+esc(nm)+'</td>'+
            '<td class="mono"><b>'+num1(cu)+'</b></td><td class="mono"><b>'+money(cg)+'</b></td>';
        }
        tableSort(root.querySelector("#sctab"), function(){ return mine; }, draw);
        draw(mine.slice().sort(function(a,b){ return a.date<b.date?1:-1; }));

        root.querySelector("#scCsv").addEventListener("click",function(){
          var h=["DATE","DEAL #","CUSTOMER","TYPE","NEW/USED","MAKE","MODEL","WITH","CREDIT","THEIR GROSS"];
          var b=mine.map(function(d){ return [showDate(d.date),d.deal,d.customer,d.type,d.kind,d.make,d.model,d.withWho,d.credit,d.mine]; });
          download(nm.replace(/\s+/g,"-").toLowerCase()+"-deals.csv", csv([h].concat(b)), "text/csv");
        });

        requestAnimationFrame(function(){ requestAnimationFrame(function(){
          var bar=root.querySelector(".sc-track > div");
          if (bar){ var w=bar.style.width; bar.style.width="0"; setTimeout(function(){ bar.style.width=w; },40); }
        });});
      }
      root.querySelectorAll("#scPick button").forEach(function(b){
        b.addEventListener("click",function(){
          root.querySelectorAll("#scPick button").forEach(function(o){
            o.setAttribute("aria-pressed", o===b?"true":"false"); });
          ST._scWho = b.getAttribute("data-n");
          root.querySelector("#scBody").innerHTML = card(ST._scWho);
          wire();
        });
      });
      wire();
    }};
}

/* Building a link from a naming convention saves pasting five links per car.
   Microsoft warns against depending on the shape of a sharing URL, so this is
   offered as a starting point that you check, never as something automatic. */
function docTokens(pattern, stock, doc){
  var out = String(pattern||"")
    .replace(/\{stock\}/gi, String(stock||""))
    .replace(/\{doc\}/gi,   String(doc||""))
    .replace(/\{STOCK\}/g,  String(stock||"").toUpperCase());
  // SharePoint paths are full of spaces ("Shared Documents", "Window sticker").
  // Encode them all the same way rather than half from the pattern and half
  // from the token, which reads like a mistake even though browsers cope.
  return out.replace(/ /g, "%20");
}

    return CPO_DOCS.filter(function(k){ return u.docs && u.docs[k]; }).length;
  }
  function certState(u){
    if (!u.certExp) return {cls:"none", txt:"Not certified"};
    var days = Math.round((new Date(u.certExp+"T12:00:00") - new Date())/86400000);
    if (isNaN(days)) return {cls:"none", txt:"Not certified"};
    if (days < 0)  return {cls:"exp",  txt:"Expired"};

    if (!u.inStock) return null;

          '<span class="right"><button class="btn" id="dCancel">Cancel</button>'+

        var fill = box.querySelector("#dFill");
        if (fill) fill.addEventListener("click", function(){
          box.querySelectorAll("[data-doc]").forEach(function(inp){
