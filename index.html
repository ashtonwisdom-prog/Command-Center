<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center — Roger Beasley Mazda Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --graphite:#1E2325; --graphite-2:#272D30; --graphite-3:#31383B;
  --line:#3B4448; --paper:#F0EFEC; --paper-2:#E4E3DE; --paper-3:#D6D4CD;
  --ink:#171B1D; --steel:#8A959A; --steel-dim:#5F6A6F;
  --soul:#C41230; --soul-deep:#8E0D22; --go:#2E8B5E; --hold:#C98A2B;
  --rail:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--graphite);color:var(--paper);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
.num{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.neg{color:var(--soul)} .dash{color:var(--steel-dim)}

/* ---------- rail ---------- */
#rail{
  position:fixed;top:0;left:0;bottom:0;width:var(--rail);background:#181C1E;
  border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;z-index:40;
  display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:#3B4448 transparent;
}
#rail::-webkit-scrollbar{width:7px}
#rail::-webkit-scrollbar-thumb{background:#333B3E}
#rail::-webkit-scrollbar-track{background:transparent}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-size:.52rem;letter-spacing:.16em;display:block;margin-bottom:5px;line-height:1.3}
.brand b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.28rem;line-height:.95;text-transform:uppercase;display:block;letter-spacing:.01em}
.brand b i{color:var(--soul);font-style:normal}
nav{padding:6px 0 18px;flex:1}

/* Groups collapse so the whole map fits without scrolling. Open state is
   remembered per browser, and the group holding the current page always opens. */
nav .grp{
  display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;
  appearance:none;background:transparent;border:0;cursor:pointer;
  font:600 .55rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel-dim);padding:11px 16px 6px;text-align:left;
}
nav .grp:hover{color:var(--steel)}
nav .grp:focus-visible{outline:2px solid var(--soul);outline-offset:-2px}
nav .grp .chev{transition:transform .15s;font-size:.6rem;opacity:.65}
nav .grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
nav .grp[aria-expanded="false"]{color:#4E585C}
nav .sect[hidden]{display:none}
nav a{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 16px 6px 18px;color:var(--paper);text-decoration:none;font-size:.81rem;line-height:1.35;
  border-left:2px solid transparent;transition:background .12s,border-color .12s;
}
nav a:hover{background:var(--graphite-2)}
nav a.on{background:var(--graphite-2);border-left-color:var(--soul);font-weight:600}
nav a .c{font:500 .64rem/1 "IBM Plex Mono",monospace;color:var(--steel-dim);flex:0 0 auto}
nav a:focus-visible{outline:2px solid var(--soul);outline-offset:-2px}
.railbtns{padding:0 16px 10px}
.savepill{padding:8px 16px;font-size:.62rem}
.railfoot{padding:10px 16px 16px;font-size:.6rem;line-height:1.5}
.railfoot{padding:14px 20px 20px;border-top:1px solid var(--line);font-size:.66rem;color:var(--steel-dim);line-height:1.55}

#burger{display:none;position:fixed;top:12px;left:12px;z-index:60;background:var(--graphite-2);border:1px solid var(--line);color:var(--paper);width:42px;height:42px;font-size:1.1rem;cursor:pointer}
#scrim{display:none;position:fixed;inset:0;background:rgba(10,12,13,.6);z-index:35}

/* ---------- main ---------- */
main{margin-left:var(--rail);padding:0 clamp(18px,3.4vw,44px) 90px;max-width:1420px}
.view{display:none} .view.on{display:block}
.vhead{padding:clamp(26px,5vw,48px) 0 20px;border-bottom:1px solid var(--line);margin-bottom:clamp(20px,3vw,34px)}
.vhead h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(2rem,5.2vw,3.3rem);line-height:.92;letter-spacing:-.012em;margin:.14em 0 0;text-transform:uppercase}
.vhead h1 i{color:var(--soul);font-style:normal}
.vhead .sub{margin-top:10px;font-size:.86rem;color:var(--steel);max-width:70ch}
.vhead .srcs{margin-top:12px;font:500 .62rem/1 "IBM Plex Mono",monospace;color:var(--steel-dim);letter-spacing:.06em}
.vhead .srcs span{border:1px solid var(--line);padding:5px 8px;margin-right:6px;display:inline-block;margin-bottom:5px}

h2.sec{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:1.4rem;margin:clamp(30px,4vw,48px) 0 16px}
h2.sec:first-child{margin-top:0}
.hint{font-size:.75rem;color:var(--steel-dim);margin:-8px 0 16px;max-width:78ch}

/* ---------- pace ---------- */
.pace{border-top:1px solid var(--line)}
.pace-row{padding:20px 0 24px;border-bottom:1px solid var(--line)}
.pace-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:13px}
.pace-label{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pace-label .name{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:1.05rem}
.pace-label .goal{font-size:.75rem;color:var(--steel)}
.pace-val{display:flex;align-items:baseline;gap:10px}
.pace-val .big{font-size:clamp(2.1rem,5.4vw,3rem);line-height:1}
.pace-val .of{font-size:.88rem;color:var(--steel-dim);font-weight:500}
.track{position:relative;height:32px;background:var(--graphite-2);border:1px solid var(--line)}
.track .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(180deg,var(--soul) 0%,var(--soul-deep) 100%);transition:width .85s cubic-bezier(.2,.7,.2,1)}
.track .marker{position:absolute;top:-9px;bottom:-9px;width:2px;background:var(--paper)}
.track .marker.go{background:var(--go)} .track .marker.hold{background:var(--hold)}
.track .flag{position:absolute;top:-29px;transform:translateX(-50%);white-space:nowrap;font-size:.61rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.track .flag.go{color:var(--go)} .track .flag.hold{color:var(--hold)} .track .flag.miss{color:var(--paper)}
.pace-foot{display:flex;justify-content:space-between;gap:12px;margin-top:15px;font-size:.76rem;color:var(--steel);flex-wrap:wrap}
.pace-foot b{font-weight:600}
.verdict.go{color:var(--go)} .verdict.hold{color:var(--hold)} .verdict.miss{color:var(--soul)}

/* ---------- tiles ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:clamp(24px,4vw,44px)}
.tile{background:var(--graphite);padding:18px 16px 16px}
.tile .k{font-size:clamp(1.5rem,3.6vw,2.05rem);line-height:1.05;margin:6px 0 11px}
.tile dl{margin:0;font-size:.74rem;color:var(--steel);display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.tile dt{color:var(--steel-dim)} .tile dd{margin:0;text-align:right;font-weight:500}
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.lead{background:var(--graphite-2);border:1px solid var(--line);border-left:3px solid var(--soul);padding:15px}
.lead .who{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:1.5rem;line-height:1;margin:7px 0 3px}
.lead .stat{font-size:.79rem;color:var(--steel);font-weight:500}

/* ---------- paper panels ---------- */
.panel{background:var(--paper);color:var(--ink);padding:clamp(18px,3vw,30px);margin-top:18px}
.panel h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1.45rem;margin:0 0 4px}
.panel .ph{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.panel .eyebrow{color:var(--steel-dim)}
.panel .note{font-size:.76rem;color:var(--steel-dim);max-width:70ch;margin:0 0 16px}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{appearance:none;background:transparent;border:0;border-right:1px solid var(--ink);
  font:600 .68rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink);padding:9px 14px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--soul);outline-offset:2px}
input.search,select.pick{
  font:400 .84rem/1 "IBM Plex Sans",sans-serif;padding:9px 11px;border:1px solid var(--ink);
  background:#fff;color:var(--ink);min-width:190px}
input.search:focus,select.pick:focus{outline:2px solid var(--soul);outline-offset:1px}
.count{font:500 .72rem/1 "IBM Plex Mono",monospace;color:var(--steel-dim);letter-spacing:.05em}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--paper-3);border:1px solid var(--paper-3);margin-bottom:18px;color:var(--ink)}
.chip{background:var(--paper);color:var(--ink);padding:12px 13px}
.chip .cl{font-size:.58rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-dim)}
.chip .cv{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5rem;line-height:1.15;margin-top:3px}

/* tables */
.tablewrap{overflow:auto;max-height:none}
.tablewrap.tall{max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead th{position:sticky;top:0;background:var(--paper);z-index:2;
  text-align:right;font:600 .62rem/1.3 "IBM Plex Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;
  color:var(--steel-dim);padding:9px 9px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
thead th.l{text-align:left}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
thead th[aria-sort]{color:var(--soul)}
tbody td{padding:9px;border-bottom:1px solid var(--paper-2);text-align:right;vertical-align:top}
tbody td.l{text-align:left}
tbody tr:hover{background:var(--paper-2);color:var(--ink)}
tfoot td{padding:12px 9px 0;border-top:1.5px solid var(--ink);font-weight:600;text-align:right;font-size:.8rem}
tfoot td.l{text-align:left;letter-spacing:.1em;text-transform:uppercase;font-size:.62rem;color:var(--steel-dim)}
.rank{font:600 .74rem/1 "IBM Plex Mono",monospace;color:var(--steel-dim);width:32px}
.tag{display:inline-block;font:600 .56rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:3px 5px;border:1px solid var(--steel-dim);color:var(--steel-dim);margin-left:6px}
.tag.n{border-color:#2A5C8A;color:#2A5C8A} .tag.u{border-color:#7A5A22;color:#7A5A22}
.tag.house{border-color:var(--soul);color:var(--soul)}
.tag.ok{border-color:var(--go);color:var(--go)} .tag.open{border-color:var(--soul);color:var(--soul)}
.tag.warn{border-color:var(--hold);color:var(--hold)}
.dim{color:var(--steel)}
.unitcell{display:flex;align-items:center;justify-content:flex-end;gap:9px}
.unitbar{height:7px;background:var(--ink);opacity:.8;flex:0 0 auto}
.unitcell .v{font:600 .92rem/1 "IBM Plex Mono",monospace;min-width:40px;text-align:right}
.beas small{display:block;font-size:.62rem;color:var(--steel-dim);margin-top:2px}
.grid-cell{white-space:pre-wrap;word-break:break-word;max-width:340px}
.rowno{font:500 .66rem/1 "IBM Plex Mono",monospace;color:#B3B0AA;text-align:right;padding-right:12px;user-select:none}
.err{color:var(--soul);font-weight:600}

/* schedule + people cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--paper);color:var(--ink);padding:16px}
.card h4{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:1.25rem;margin:0 0 12px;letter-spacing:.05em;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.card .lab{font-size:.58rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-dim);margin:12px 0 5px}
.card .lab:first-of-type{margin-top:0}
.card ul{margin:0;padding:0;list-style:none;font-size:.85rem}
.card ul li{padding:3px 0}
.card .off li{color:var(--steel-dim)}
.dir{columns:220px;column-gap:26px}
.dir .row{break-inside:avoid;display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--paper-2);font-size:.83rem}
.dir .row b{font-weight:500} .dir .row span{font-family:"IBM Plex Mono",monospace;color:var(--steel-dim)}

/* lots */
.lots{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.lot{background:var(--graphite-2);border:1px solid var(--line);padding:16px}
.lot .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.4rem;line-height:1;margin:6px 0 4px}
.lot .bar{height:5px;background:var(--soul);margin-top:10px}
.lot .stk{margin-top:12px;font:500 .68rem/1.7 "IBM Plex Mono",monospace;color:var(--steel);max-height:150px;overflow:auto;word-break:break-all}

.warn{background:#2A1D1F;border:1px solid var(--soul);border-left-width:3px;padding:14px 16px;margin:16px 0;font-size:.82rem;color:#F0DDDF}
.warn b{color:var(--soul)}

footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:.72rem;color:var(--steel-dim);line-height:1.65}
footer p{margin:0 0 8px;max-width:76ch} footer b{color:var(--steel);font-weight:600}



/* ---------- day chart + today ---------- */
.daychart{background:var(--graphite-2);border:1px solid var(--line);padding:18px 16px 12px}
.daychart svg{display:block;width:100%;height:auto}
.dc-bar{fill:var(--soul);transition:opacity .12s}
.dc-bar.today{fill:var(--go)}
.dc-bar:hover{opacity:.72}
.dc-rule{stroke:var(--steel-dim);stroke-width:1;stroke-dasharray:3 3}
.dc-lab{fill:var(--steel-dim);font:500 8px "IBM Plex Mono",monospace}
.dc-val{fill:var(--paper);font:600 9px "IBM Plex Mono",monospace}
.dc-key{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.68rem;color:var(--steel-dim)}
.dc-key i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.today-empty{background:var(--graphite-2);border:1px dashed var(--line);padding:26px 20px;text-align:center}
.today-empty p{margin:0 0 14px;color:var(--steel);font-size:.86rem}

.railbtns{padding:0 20px 14px;display:flex;flex-direction:column;gap:7px}
.railbtns .btn{width:100%;text-align:center}
.savepill small{display:block;color:var(--steel-dim);font-size:.9em;margin-top:2px}


/* ---------- schedule ---------- */
:root{ --open:#D9A441; --close:#5B8FB9; }
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:.72rem;color:var(--steel-dim);margin:0 0 16px}
.legend b{font-weight:600;color:inherit}
.key{display:inline-flex;align-items:center;gap:7px}
.key i{width:13px;height:13px;flex:0 0 auto;border-radius:2px}
.key i.o{background:var(--open)} .key i.c{background:var(--close)}
.key i.f{background:transparent;border:1px dashed var(--steel-dim)}

.shiftgrid{width:100%;border-collapse:separate;border-spacing:0;font-size:.84rem}
.shiftgrid th{position:sticky;top:0;background:var(--paper);z-index:2;
  font:600 .62rem/1.3 "IBM Plex Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;
  color:var(--steel-dim);padding:9px 6px;border-bottom:1.5px solid var(--ink);text-align:center;white-space:nowrap}
.shiftgrid th.who{text-align:left;min-width:130px}
.shiftgrid td{padding:3px;border-bottom:1px solid var(--paper-2);text-align:center}
.shiftgrid td.who{text-align:left;font-weight:600;padding-left:6px;white-space:nowrap}
.shiftgrid td.who .tag{margin-left:6px;padding:2px 4px;font-size:.52rem;letter-spacing:.08em;vertical-align:1px}
.shiftgrid td.who .tag.none{border-color:#C9C6BF;color:#B0ACA4}
.shiftgrid tfoot td{border-top:1.5px solid var(--ink);border-bottom:0;padding-top:9px;
  font:500 .62rem/1.5 "IBM Plex Mono",monospace;color:var(--steel-dim)}
.shiftgrid tbody tr:hover td.who{color:var(--soul)}

.shift{appearance:none;width:100%;min-width:62px;border:1px solid var(--paper-3);background:transparent;
  color:var(--steel-dim);font:600 .62rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;
  padding:9px 4px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.shift:hover{border-color:var(--ink)}
.shift:focus-visible{outline:2px solid var(--soul);outline-offset:1px}
.shift.o{background:var(--open);border-color:var(--open);color:#221B08}
.shift.c{background:var(--close);border-color:var(--close);color:#fff}
/* bell to bell is literally open AND close, so the swatch is both */
.shift.b{background:linear-gradient(90deg,var(--open) 0 50%,var(--close) 50% 100%);
  border-color:var(--close);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.key i.b{background:linear-gradient(90deg,var(--open) 0 50%,var(--close) 50% 100%)}
.card ul.sh li i.b{background:linear-gradient(90deg,var(--open) 0 50%,var(--close) 50% 100%)}
.deskpick{font:600 .6rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 5px;border:1px solid var(--paper-3);background:#fff;color:var(--ink);width:100%;min-width:74px}
.deskpick:focus{outline:2px solid var(--soul);outline-offset:-1px}
.shift.f{border-style:dashed;color:var(--steel-dim)}
.shift.n{color:#BDBAB3}

/* Six days never divide evenly into a min-width grid, so Saturday was orphaning
   onto its own row. Fixed column counts that all divide 6 keep the week whole. */
.cards.week{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1240px){ .cards.week{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:780px){ .cards.week{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:440px){ .cards.week{grid-template-columns:1fr} }

.card.day{padding:13px 12px 14px}
.card.day h4{font-size:1.05rem;margin:0 0 3px;padding-bottom:0;border-bottom:0;letter-spacing:.03em}
.card.day .daymeta{font:500 .58rem/1.4 "IBM Plex Mono",monospace;color:var(--steel-dim);
  letter-spacing:.04em;padding-bottom:8px;border-bottom:1.5px solid var(--ink);margin-bottom:10px}
.card.day .lab{font-size:.54rem;letter-spacing:.12em;margin:10px 0 4px}
.card.day .lab:first-of-type{margin-top:0}
.card ul.sh li{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:.79rem;
  line-height:1.3;overflow-wrap:anywhere}
.card ul.sh li i{width:8px;height:8px;flex:0 0 auto;border-radius:2px;margin-top:1px}
.card ul.sh li i.o{background:var(--open)} .card ul.sh li i.c{background:var(--close)}
.card ul.sh li i.f{background:transparent;border:1px dashed var(--steel-dim)}
.card .none{color:#B3B0AA;font-style:italic;font-size:.74rem}


/* ---------- time-off calendar ---------- */
.calbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.calbar h3{margin:0}
.calbar .spacer{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--paper-3);border:1px solid var(--paper-3);color:var(--ink)}
.cal .dow{background:var(--paper);padding:7px 8px;text-align:center;
  font:600 .58rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--steel-dim)}
.cal .cell{background:var(--paper);color:var(--ink);min-height:96px;padding:7px 8px 9px;border-left:3px solid transparent;position:relative}
.cal .cell.pad{background:#E9E8E3;color:var(--ink)}
.cal .cell.closed{background:#E9E8E3;color:var(--ink)}
.cal .cell.today{outline:2px solid var(--soul);outline-offset:-2px}
.cal .cell.warn{border-left-color:var(--open)}
.cal .cell.short{border-left-color:var(--soul)}
.cal .dnum{font:700 1.05rem/1 "Barlow Condensed",sans-serif;color:var(--ink)}
.cal .cnts{float:right;font:600 .6rem/1.4 "IBM Plex Mono",monospace;color:var(--steel-dim)}
.cal .cnts b{color:var(--ink);font-weight:600}
.cal .outlist{margin:7px 0 0;padding:0;list-style:none}
.cal .outlist li{font-size:.68rem;line-height:1.35;color:var(--ink);display:flex;gap:5px;align-items:flex-start;overflow-wrap:anywhere}
.cal .outlist li i{width:6px;height:6px;border-radius:50%;flex:0 0 auto;margin-top:4px;background:var(--soul)}
.cal .outlist li i.mgr{background:var(--close)}
.cal .closedlab{font-size:.6rem;color:#A9A69F;letter-spacing:.09em;text-transform:uppercase;margin-top:6px}
@media (max-width:700px){
  .cal .cell{min-height:74px;padding:5px}
  .cal .outlist li{font-size:.6rem}
  .cal .cnts{float:none;display:block;margin-top:2px}
}


/* ---------- lot manager ---------- */
.bulkbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--ink);color:var(--paper);
  padding:11px 14px;margin-bottom:14px}
.bulkbar[hidden]{display:none}
.bulkbar .n{font:700 1.15rem/1 "Barlow Condensed",sans-serif;letter-spacing:.02em}
.bulkbar label{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:#A9B0B4}
.bulkbar select{font:600 .74rem/1 "IBM Plex Sans",sans-serif;padding:8px 9px;border:1px solid #4A5257;
  background:#2A3033;color:var(--paper)}
.bulkbar select:focus{outline:2px solid var(--soul);outline-offset:1px}
.bulkbar .btn{border-color:#5A6266;color:var(--paper)}
.bulkbar .btn:hover{background:var(--paper);color:var(--ink)}
.bulkbar .spacer{flex:1}
th.chk,td.chk{width:34px;text-align:center;padding-left:4px;padding-right:4px}
td.chk input,th.chk input{width:15px;height:15px;accent-color:var(--soul);cursor:pointer}
.lotpick{font:500 .78rem/1 "IBM Plex Sans",sans-serif;padding:6px 7px;border:1px solid var(--paper-3);
  background:#fff;color:var(--ink);min-width:104px}
.lotpick:focus{outline:2px solid var(--soul);outline-offset:-1px}
tr.picked td{background:#EDE3E5}
.stat{display:inline-block;font:600 .56rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 6px;border:1px solid var(--steel-dim);color:var(--steel-dim)}
.stat.onlot{border-color:var(--go);color:var(--go)}
.stat.sold{border-color:var(--steel-dim);color:var(--steel-dim)}
.stat.hold{border-color:var(--open);color:#8A6416}
.stat.svc{border-color:var(--close);color:#2F5F80}
.lot .edit{margin-top:12px}


/* ---------- store board (this page only) ---------- */
#v-stores .vhead h1 i{color:var(--gold)}
:root{ --gold:#C9A227; --podium:#2A3134; }

.rank-strip{display:grid;gap:12px;margin-bottom:10px}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.pcard{position:relative;background:var(--podium);border:1px solid var(--line);padding:18px 16px 16px;overflow:hidden}
.pcard::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--line)}
.pcard.p1{border-color:var(--gold)}
.pcard.p1::after{background:linear-gradient(90deg,var(--gold),#8E7318)}
.pcard.home{border-color:var(--soul)}
.pcard.home::after{background:linear-gradient(90deg,var(--soul),var(--soul-deep))}
.pcard .place{position:absolute;top:9px;right:12px;font:700 2.9rem/1 "Barlow Condensed",sans-serif;
  color:#3B4448;letter-spacing:-.03em}
.pcard.p1 .place{color:rgba(201,162,39,.32)}
.pcard.home .place{color:rgba(196,18,48,.3)}
.pcard .sname{font:700 1.5rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em;
  position:relative;z-index:1}
.pcard .homeflag{display:inline-block;font:600 .52rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.14em;
  text-transform:uppercase;border:1px solid var(--soul);color:var(--soul);padding:3px 5px;margin-left:7px;vertical-align:3px}
.pcard .big{font:700 2.1rem/1 "Barlow Condensed",sans-serif;margin:12px 0 2px;font-variant-numeric:tabular-nums}
.pcard .sub{font-size:.74rem;color:var(--steel)}
.pcard dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.72rem;color:var(--steel)}
.pcard dd{margin:0;text-align:right;color:var(--paper);font-weight:500}
.pcard .gapline{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:.7rem;color:var(--steel-dim)}
.pcard .gapline b{color:var(--paper);font-weight:600}

/* horizontal ranked bars */
.rankbars{border-top:1px solid var(--line)}
.rb{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--line)}
.rb .pos{font:700 1.15rem/1 "Barlow Condensed",sans-serif;color:var(--steel-dim);text-align:right}
.rb.home .pos{color:var(--soul)}
.rb .body{min-width:0}
.rb .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:6px}
.rb .nm{font:600 .92rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.02em}
.rb.home .nm{color:var(--soul)}
.rb .val{font:600 .86rem/1 "IBM Plex Mono",monospace}
.rb .meter{height:14px;background:var(--graphite-2);border:1px solid var(--line);position:relative}
.rb .meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#4A5459,#333B3E);
  transition:width .7s cubic-bezier(.2,.7,.2,1)}
.rb.home .meter i{background:linear-gradient(180deg,var(--soul),var(--soul-deep))}
.rb.p1 .meter i{background:linear-gradient(180deg,var(--gold),#8E7318)}
.rb .foot{margin-top:5px;font-size:.68rem;color:var(--steel-dim)}


/* ---------- printable forms ---------- */
.formsheet{background:#fff;color:#111;padding:34px 38px 40px;margin-bottom:20px;
  box-shadow:0 1px 0 rgba(0,0,0,.15);max-width:840px}
.formsheet *{box-sizing:border-box}
.fs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:20px}
.fs-title{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  font-size:2rem;line-height:1;letter-spacing:.02em;margin:0}
.fs-store{font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#666}
.fs-ctl{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#666;text-align:right}
.fs-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.fs-f{flex:1 1 160px;min-width:0}
.fs-f label{display:block;font-size:.56rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#666;margin-bottom:3px}
.fs-line{border:0;border-bottom:1px solid #111;background:transparent;color:#111;
  font:500 .95rem/1.5 "IBM Plex Sans",sans-serif;width:100%;padding:3px 2px;min-height:28px}
.fs-line:focus{outline:0;border-bottom-width:2px;background:#FFFBE8}
.fs-line.mono{font-family:"IBM Plex Mono",monospace}
.fs-line.big{font-size:1.3rem;font-weight:600}
textarea.fs-line{border:1px solid #111;min-height:62px;padding:7px;resize:vertical;line-height:1.5}
.fs-sec{font-size:.6rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  background:#111;color:#fff;padding:5px 9px;margin:22px 0 14px}
.fs-table{width:100%;border-collapse:collapse;margin-bottom:6px}
.fs-table th{font-size:.56rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#666;
  text-align:left;padding:0 6px 5px;border-bottom:1px solid #111}
.fs-table td{padding:0;border-bottom:1px solid #999}
.fs-table td .fs-line{border-bottom:0;min-height:32px}
.fs-table td.num{width:30px;text-align:center;font:700 .85rem/32px "Barlow Condensed",sans-serif;color:#888}
.fs-block{border:1px solid #111;padding:12px 14px;margin-bottom:12px}
.fs-block .fs-row{margin-bottom:10px}
.fs-block .fs-row:last-child{margin-bottom:0}
.fs-note{font-size:.62rem;color:#777;margin:4px 0 0}
.fs-sign{display:flex;gap:30px;margin-top:26px;padding-top:6px}
.fs-sign .fs-f{flex:1}
.fs-total{border:2px solid #111;padding:10px 14px;display:flex;justify-content:space-between;
  align-items:center;gap:16px;margin-top:8px}
.fs-total .lbl{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.fs-total .fs-line{border-bottom:0;text-align:right;font:700 1.45rem/1.2 "Barlow Condensed",sans-serif}
.printbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.printbar .spacer{flex:1}

@media print{
  @page{ size:letter portrait; margin:0.5in; }
  body{background:#fff!important;color:#000!important}
  body::before{display:none}
  #rail,#burger,#scrim,.printbar,.vhead,h2.sec,.hint,.banner,.warn,footer,.modal{display:none!important}
  main{margin:0!important;padding:0!important;max-width:none!important}
  .view{display:none!important}
  .view.on{display:block!important}
  .formsheet{box-shadow:none;padding:0;margin:0;max-width:none;page-break-after:always}
  .formsheet:last-of-type{page-break-after:auto}
  .formsheet[data-hide="1"]{display:none!important}
  .fs-line{background:transparent!important}
  .fs-sec{background:#111!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}


/* ---------- daily work plan: v1 layout, tuned to one letter page ---------- */
.formsheet.plan{padding:26px 30px 26px}
.plan .fs-head{padding-bottom:8px;margin-bottom:12px}
.plan .fs-title{font-size:1.65rem}
.plan .fs-row{margin-bottom:10px;gap:18px}
.plan .fs-f label{font-size:.52rem;letter-spacing:.12em;margin-bottom:1px}
.plan .fs-line{min-height:23px;font-size:.88rem;padding:1px 2px}
.plan .fs-line.big{font-size:1.1rem;min-height:26px}
.plan .fs-sec{margin:12px 0 8px;padding:4px 8px;font-size:.55rem;letter-spacing:.15em}
.plan .fs-table th{padding:0 6px 3px;font-size:.52rem}
.plan .fs-table td .fs-line{min-height:25px}
.plan .fs-table td.num{font-size:.78rem;line-height:25px}
.plan .fs-sign{margin-top:14px}

/* the stacked prospect card from the first version, just tighter */
.plan .fs-block{padding:8px 10px;margin-bottom:7px}
.plan .fs-block .fs-row{margin-bottom:6px;gap:16px}
.plan .fs-block .fs-f label{margin-bottom:0}
.plan .fs-block textarea.fs-line{min-height:34px;padding:4px 6px;line-height:1.35;font-size:.85rem}

@media print{
  .formsheet.plan{padding:0}
  .plan .fs-block,.plan .fs-table{break-inside:avoid}
  .plan .fs-sec{break-after:avoid}
}


/* ---------- specialist scorecard ---------- */
.sc-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.sc-pick button{appearance:none;background:var(--graphite-2);border:1px solid var(--line);color:var(--paper);
  font:600 .74rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.03em;padding:9px 12px;cursor:pointer;
  transition:background .12s,border-color .12s}
.sc-pick button:hover{border-color:var(--steel)}
.sc-pick button[aria-pressed="true"]{background:var(--soul);border-color:var(--soul);color:#fff}
.sc-pick button:focus-visible{outline:2px solid var(--soul);outline-offset:2px}
.sc-pick button .u{color:var(--steel-dim);font-weight:500;margin-left:6px}
.sc-pick button[aria-pressed="true"] .u{color:rgba(255,255,255,.72)}

.sc-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);margin-bottom:1px}
@media (max-width:820px){ .sc-hero{grid-template-columns:1fr} }
.sc-main{background:var(--graphite-2);padding:22px 20px}
.sc-main .who{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  font-size:2.5rem;line-height:.95;letter-spacing:.01em}
.sc-main .sub{font-size:.78rem;color:var(--steel);margin-top:4px}
.sc-prog{margin-top:18px}
.sc-prog .nums{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px}
.sc-prog .big{font:700 2.6rem/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.sc-prog .of{font-size:.85rem;color:var(--steel)}
.sc-track{height:26px;background:var(--graphite);border:1px solid var(--line);position:relative}
.sc-track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,var(--soul),var(--soul-deep));
  transition:width .8s cubic-bezier(.2,.7,.2,1)}
.sc-track i.hit{background:linear-gradient(180deg,#34A06C,#1F6B45)}
.sc-track b{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--paper)}
.sc-track .flag{position:absolute;top:-24px;transform:translateX(-50%);white-space:nowrap;
  font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.sc-verdict{margin-top:12px;font-size:.8rem;color:var(--steel)}
.sc-verdict b{font-weight:600}
.sc-verdict .go{color:var(--go)} .sc-verdict .miss{color:var(--soul)} .sc-verdict .hold{color:var(--open)}
.sc-side{background:var(--graphite-2);padding:18px 20px;display:grid;grid-template-columns:repeat(2,1fr);
  gap:16px 18px;align-content:start}
.sc-stat .l{font-size:.58rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-dim)}
.sc-stat .v{font:700 1.5rem/1.1 "Barlow Condensed",sans-serif;margin-top:3px;font-variant-numeric:tabular-nums}
.sc-stat .d{font-size:.66rem;color:var(--steel);margin-top:2px}
.sc-stat .d .up{color:var(--go)} .sc-stat .d .dn{color:var(--soul)}

.sc-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:18px}
.mixbar{display:flex;height:20px;border:1px solid var(--line);overflow:hidden;margin:8px 0 9px}
.mixbar span{display:block;height:100%}
.mixkey{font-size:.68rem;color:var(--steel);line-height:1.7}
.mixkey i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
.sc-rank{font:700 1.1rem/1 "Barlow Condensed",sans-serif;color:var(--gold)}


/* ---------- CPO inventory ---------- */
.doclist{display:flex;flex-wrap:wrap;gap:5px}
.doc{display:inline-flex;align-items:center;gap:5px;font:600 .58rem/1 "IBM Plex Sans",sans-serif;
  letter-spacing:.07em;text-transform:uppercase;padding:5px 7px;border:1px solid var(--steel-dim);
  color:var(--steel-dim);text-decoration:none;transition:border-color .12s,color .12s,background .12s}
.doc:hover{border-color:var(--ink);color:var(--ink);background:var(--paper-2)}
.doc.have{border-color:var(--go);color:var(--go)}
.doc.have:hover{background:var(--go);color:#fff;border-color:var(--go)}
.doc svg{width:9px;height:9px;flex:0 0 auto}
.docmiss{font-size:.62rem;color:#B3B0AA;font-style:italic}
.cert{display:inline-block;font:600 .56rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.1em;
  text-transform:uppercase;padding:4px 6px;border:1px solid var(--go);color:var(--go)}
.cert.exp{border-color:var(--soul);color:var(--soul)}
.cert.none{border-color:#C9C6BF;color:#B0ACA4}
.docrow{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--paper-2)}
.docrow:last-child{border-bottom:0}
.docrow .dl{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel-dim)}
.docrow input{font:400 .8rem/1.3 "IBM Plex Sans",sans-serif;padding:7px 8px;border:1px solid var(--paper-3);
  background:#fff;color:var(--ink);width:100%}
.docrow input:focus{outline:2px solid var(--soul);outline-offset:-1px}
.docrow a{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--go);
  text-decoration:none;white-space:nowrap;font-weight:600}
.docrow a.off{color:#C9C6BF;pointer-events:none}


/* ---------- F&I penetration ---------- */
.pen{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:4px}
.pcell{background:var(--graphite-2);border:1px solid var(--line);padding:16px 15px 14px}
.pcell .pl{font-size:.58rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-dim)}
.pcell .pv{font:700 2.3rem/1 "Barlow Condensed",sans-serif;margin:7px 0 2px;font-variant-numeric:tabular-nums}
.pcell .pd{font-size:.68rem;color:var(--steel)}
.pring{height:7px;background:var(--graphite);border:1px solid var(--line);margin-top:11px;position:relative;overflow:hidden}
.pring i{position:absolute;inset:0 auto 0 0;background:var(--soul);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.pring i.good{background:var(--go)} .pring i.mid{background:var(--open)}
.pring b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--paper);opacity:.55}
.pcell .pt{font-size:.6rem;color:var(--steel-dim);margin-top:6px}
.penbar{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.penbar .pb{width:54px;height:7px;background:var(--paper-3);position:relative;flex:0 0 auto}
.penbar .pb i{position:absolute;inset:0 auto 0 0;background:var(--ink);opacity:.8}
.penbar .pb i.good{background:var(--go);opacity:1}
.penbar .pb i.mid{background:var(--open);opacity:1}
.penbar .pn{font:600 .84rem/1 "IBM Plex Mono",monospace;min-width:42px;text-align:right}


/* ---------- F&I product entry ---------- */
.whobar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.whobar select{font:600 .95rem/1 "IBM Plex Sans",sans-serif;padding:11px 13px;border:1px solid var(--line);
  background:var(--graphite-2);color:var(--paper);min-width:210px}
.whobar select:focus{outline:2px solid var(--soul);outline-offset:1px}
.whobar .spacer{flex:1}
.chip-p{appearance:none;border:1px solid var(--paper-3);background:transparent;color:#B0ACA4;
  font:600 .58rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 6px;cursor:pointer;min-width:42px;transition:background .1s,color .1s,border-color .1s}
.chip-p:hover{border-color:var(--ink);color:var(--ink)}
.chip-p.on{background:var(--go);border-color:var(--go);color:#fff}
.chip-p.ba-yes{background:var(--go);border-color:var(--go);color:#fff}
.chip-p.ba-no{background:var(--soul);border-color:var(--soul);color:#fff}
.chip-p.ba-dnq{background:var(--paper-2);border-color:var(--steel-dim);color:var(--steel-dim)}
.chip-p:focus-visible{outline:2px solid var(--soul);outline-offset:1px}
td.prods{white-space:nowrap}
td.prods .chip-p{margin-right:3px}
.gin{font:600 .86rem/1 "IBM Plex Mono",monospace;width:86px;padding:7px 8px;border:1px solid var(--paper-3);
  background:#fff;color:var(--ink);text-align:right}
.gin:focus{outline:2px solid var(--soul);outline-offset:-1px}
.pcount{font:700 .95rem/1 "Barlow Condensed",sans-serif;color:var(--ink)}
.pcount.zero{color:#C9C6BF}
.minicards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-bottom:18px}
.mini{background:var(--graphite-2);padding:14px 14px 12px}
.mini .ml{font-size:.56rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-dim)}
.mini .mv{font:700 1.7rem/1 "Barlow Condensed",sans-serif;margin-top:5px;font-variant-numeric:tabular-nums}
.mini .md{font-size:.65rem;color:var(--steel);margin-top:3px}


/* ---------- contracts in transit ---------- */
.agebands{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-bottom:18px}
.band{background:var(--graphite-2);padding:15px 14px 13px;border-top:3px solid var(--line)}
.band.ok{border-top-color:var(--go)}
.band.warn{border-top-color:var(--open)}
.band.bad{border-top-color:var(--soul)}
.band .bl{font-size:.56rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-dim)}
.band .bn{font:700 2rem/1 "Barlow Condensed",sans-serif;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.band .bd{font-size:.68rem;color:var(--steel)}
.band.bad .bn{color:var(--soul)}
.band.warn .bn{color:var(--open)}

.cstat{appearance:none;border:1px solid var(--paper-3);background:transparent;
  font:600 .58rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;
  padding:7px 9px;cursor:pointer;color:var(--steel-dim);min-width:82px;transition:all .1s}

<script>
(function(){
  var GATE_URL = "https://script.google.com/macros/s/AKfycbxvBjWj16wE0JCwCwAOqi8-H6753oWo0yGEKeJ7Xfvcyn12jk1v19PhdNOAIJdgN4CA/exec";
  var gate = document.getElementById("gateScreen");
  var input = document.getElementById("gateCode");
  var err = document.getElementById("gateErr");
  var btn = document.getElementById("gateBtn");

  function tryCode(){
    var code = input.value.trim();
    if (!code) return;
    btn.disabled = true; btn.textContent = "Checking…";
    fetch(GATE_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ token: code, who: "Command Center (gate)", since: "", quiet: true, records: [] })
    }).then(function(r){ return r.json(); })
      .then(function(res){
        btn.disabled = false; btn.textContent = "Enter";
        if (res && !res.error){
          gate.style.display = "none";
        } else {
          err.style.display = "block";
        }
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = "Enter";
        err.textContent = "Could not reach the shared log. Check your connection and try again.";
        err.style.display = "block";
      });
  }

  btn.onclick = tryCode;
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") tryCode(); });
  input.focus();
})();
</script>

<script>
(function(){
"use strict";

/* Grabbed before a single view is built, so it is the file exactly as it shipped.
   Used to hand other managers a copy that already knows the team link. */
var PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

/* Grabbed before a single view is built, so it is the file exactly as it shipped.
   Used to hand other managers a copy that already knows the team link. */
var PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

/* ============================================================
   1. WORKBOOK (read-only seed)
   ============================================================ */
var WB = JSON.parse(document.getElementById("wb").textContent);
function S(nm){ return (WB[nm] && WB[nm].rows) || []; }
function off(nm){ return (WB[nm] && WB[nm].off) || 0; }
function at(rows,r,c){ return (rows[r] && rows[r][c] !== undefined) ? rows[r][c] : ""; }
function lv(rows,label,dc,dr){
  var t=String(label).trim().toUpperCase(), first="";
  for (var r=0;r<rows.length;r++) for (var c=0;c<rows[r].length;c++){
    if (String(rows[r][c]).trim().toUpperCase()===t){
      var v = at(rows,r+(dr||0),c+dc);
      if (first==="") first=v;
      if (n(v)!==null) return v;
    }
  }
  return first;
}

/* ============================================================
   2. FORMAT HELPERS
   ============================================================ */
function n(v){ if(v===""||v==null) return null; var x=parseFloat(String(v).replace(/[$,%\s]/g,"")); return isFinite(x)?x:null; }
function money(v,dp){
  var x=n(v); if(x===null) return null;
  var s="$"+Math.abs(x).toLocaleString("en-US",{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0});
  return x<0 ? "\u2212"+s : s;
}
function num1(v){ var x=n(v); if(x===null) return ""; return x%1 ? x.toFixed(1) : String(x); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m];}); }
function cellOr(t,neg){ return (t===null||t==="") ? '<span class="dash">—</span>' : (neg?'<span class="neg">'+t+'</span>':t); }
function isErr(v){ return typeof v==="string" && v.charAt(0)==="#" && v.indexOf("!")>0; }
function uid(){ return "d"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
/* Seeded rows get an id derived from their position in the workbook, not a random
   one. Every manager seeds from the same embedded file, so the same deal carries
   the same id on every machine and merges instead of duplicating. Their timestamp
   is deliberately ancient so any real edit always beats an untouched seed. */
var SEED_TS = "2000-01-01T00:00:00.000Z";

// dates: stored ISO (yyyy-mm-dd), shown mm/dd/yy
function toISO(v){
  if (!v) return "";
  var s=String(v).trim();
  var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m){ var y=+m[3]; if(y<100) y+=2000; return y+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0"); }
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  return "";
}
function showDate(iso){
  if (!iso) return "";
  var p=String(iso).split("-"); if(p.length<3) return iso;
  return p[1]+"/"+p[2]+"/"+p[0].slice(2);
}
function dow(iso){
  if(!iso) return "";
  var d=new Date(iso+"T12:00:00");
  return isNaN(d) ? "" : ["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()];
}

/* ============================================================
   3. SEED STATE FROM WORKBOOK
   ============================================================ */
var ML = S("MASTER LOG"), CC = S("COMMAND CENTER DASHBOARD");

function seedDeals(){
  var out=[];
  for (var i=1;i<ML.length;i++){
    if (ML[i][3]==="" || ML[i][3]==null) continue;
    out.push({
      id: "sd"+i, _u: SEED_TS,
      kind: ML[i][0]==="\uD83C\uDD7D" ? "New" : "Used",
      date: toISO(ML[i][2]),
      deal: String(ML[i][3]||""), stock: String(ML[i][4]||""),
      customer: "",
      s1: String(ML[i][5]||""), s2: String(ML[i][6]||""),
      type: String(ML[i][7]||""), adv: String(ML[i][8]||""),
      make: String(ML[i][9]||"").trim(), model: String(ML[i][10]||""),
      trade: String(ML[i][11]||""),
      front: n(ML[i][12])||0, back: n(ML[i][13])||0
    });
  }
  return out;
}
function seedRoster(){
  var out=[];
  for (var j=1;j<40 && j<ML.length;j++){
    var nm=ML[j][16];
    if (!nm || String(nm).trim()==="") continue;
    if (/^TOTAL\b/i.test(String(nm).trim())) break;
    var name=String(nm).trim();
    out.push({id:"sr"+j, _u:SEED_TS, name:name, team: name.toUpperCase()==="HOUSE" ? "House" : (j<=10 ? "New" : "Used")});
  }
  return out;
}
function seedSettings(){
  return {
    monthLabel: "July 2026",
    daysTotal: n(lv(CC,"SELLING DAYS (TOTAL)",1)) || 27,
    daysElapsed: n(lv(CC,"SELLING DAYS ELAPSED",1)) || 26,
    goalTotal: n(lv(CC,"STORE GOAL UNITS",1)) || 300,
    goalNew: n(lv(CC,"NEW GOAL UNITS",1)) || 125,
    goalUsed: n(lv(CC,"USED GOAL UNITS",1)) || 140,
    csi3: n(at(CC,23,3)) || null,
    csiMonth: null,
    nonRetail: ["CAC","CHOICE"],
    fiDeptGoal: 140000,
    fiProjDeals: 66,
    privacy: false,
    libUrl: "",          // the folder your PDFs actually live in
    libPattern: "",      // optional: how a file path is built from stock + doc name
    monthKey: toISO(lv(CC,"MONTH START",1)).slice(0,7) || "2026-07",
    _u: SEED_TS
  };
}
function seedAging(){
  var A=S("AGING"), blocks=[];
  for (var r=0;r<A.length;r++){
    if (String(at(A,r,1)).trim().toUpperCase()!=="AGE") continue;
    var label="";
    for (var b=r-1;b>=0 && b>r-4;b--){
      for (var c=0;c<A[b].length;c++){ var v=String(at(A,b,c)).trim();
        if (v && /^[A-Za-z][A-Za-z ]{2,13}$/.test(v)){ label=v; break; } }
      if (label) break;
    }
    // skip the leftover month-name block — it has no ages or costs on it
    if (/^(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)/i.test(label)){
      for (var sk=r+1;sk<A.length;sk++){ if (String(at(A,sk,1)).trim().toUpperCase()==="AGE"){ r=sk-1; break; } }
      continue;
    }
    var hasB=false;
    for (var pk=r+1;pk<A.length;pk++){
      if (String(at(A,pk,1)).trim().toUpperCase()==="AGE") break;
      if (String(at(A,pk,2)).trim()==="") continue;
      if (n(at(A,pk,1))!==null){ hasB=true; break; }
    }
    var rows=[];
    for (var k=r+1;k<A.length;k++){
      if (String(at(A,k,1)).trim().toUpperCase()==="AGE") break;
      if (String(at(A,k,2)).trim()==="") continue;
      rows.push({ id:"sa"+blocks.length+"_"+rows.length, _u:SEED_TS,
        age: hasB ? n(at(A,k,1)) : n(at(A,k,0)),
        stock:String(at(A,k,2)), veh:String(at(A,k,3)), miles:n(at(A,k,4)),
        book:n(at(A,k,5)), cost:n(at(A,k,7)), price:n(at(A,k,8)),
        nada:at(A,k,10)==="Y", guru:at(A,k,11)==="Y", pics:at(A,k,12)==="Y",
        leads:n(at(A,k,14)), saves:n(at(A,k,15)), note:String(at(A,k,16)||"") });
    }
    if (rows.length) blocks.push({label:"Current list", rows:rows});
    r += rows.length;
  }
  return blocks;
}
function seedOwes(){
  var W=S("We OwePOs"), hdr=-1;
  for (var r=0;r<Math.min(6,W.length);r++){
    if (String(at(W,r,1)).trim().toUpperCase().indexOf("INVOICE")===0){ hdr=r; break; }
  }
  if (hdr<0) hdr=2;
  var vend=[];
  for (var c=1;c<(W[0]||[]).length;c+=4){
    var nm=String(at(W,0,c)).trim();
    if (nm) vend.push({name:nm, ci:c, ca:c+1, cs:c+2, cd:c+3});
  }
  var items=[];
  for (var k=hdr+1;k<W.length;k++){
    vend.forEach(function(v){
      var inv=at(W,k,v.ci), amt=n(at(W,k,v.ca)), stk=String(at(W,k,v.cs)).trim(), dn=String(at(W,k,v.cd)).trim();
      if (inv==="" && amt===null && !stk) return;
      items.push({id:"so"+items.length, _u:SEED_TS, vendor:v.name, inv:String(inv), amt:amt, stock:stk, done:dn==="Y"});
    });
  }
  return {vendors: vend.map(function(v){return v.name;}), items: items};
}

var DAYS = [["MON","Monday"],["TUE","Tuesday"],["WED","Wednesday"],
             ["THU","Thursday"],["FRI","Friday"],["SAT","Saturday"]];

function seedSchedule(){
  var SC=S("SCHEDULE"), byDay={}, cur=null;
  var codes = DAYS.map(function(d){ return d[0]; });
  for (var r=0;r<SC.length;r++){
    var d0=String(at(SC,r,0)).trim().toUpperCase();
    if (codes.indexOf(d0)>=0 && String(at(SC,r,1)).toUpperCase().indexOf("EARLY")>=0){
      cur = byDay[d0] = {early:[],late:[],off:[]}; continue;
    }
    if (!cur) continue;
    if (d0){ if (d0==="WHO?") cur=null; continue; }
    [1,2].forEach(function(c){ var v=String(at(SC,r,c)).trim(); if(v) cur.early.push(v); });
    [3,4].forEach(function(c){ var v=String(at(SC,r,c)).trim(); if(v) cur.late.push(v); });
    var o=String(at(SC,r,5)).trim();
    if (o && o.toUpperCase()!=="NONE") cur.off.push(o);
  }
  return DAYS.map(function(d){
    var b = byDay[d[0]] || {early:[],late:[],off:[]}, assign={};
    b.early.forEach(function(nm){ assign[nm]="open"; });
    b.late.forEach(function(nm){ assign[nm]="close"; });
    b.off.forEach(function(nm){ assign[nm]="off"; });
    return {id:"day-"+d[0], day:d[0], label:d[1], assign:assign, _u:SEED_TS};
  });
}
function seedSchedPeople(sched, roster){
  var seen={};
  sched.forEach(function(d){ Object.keys(d.assign).forEach(function(nm){ seen[nm]=1; }); });
  roster.forEach(function(r){ if (r.name.toUpperCase()!=="HOUSE") seen[r.name]=1; });
  return Object.keys(seen).sort().map(function(nm){
    return {id:"sp-"+nm.replace(/[^A-Za-z0-9]/g,"").toUpperCase(), name:nm, _u:SEED_TS};
  });
}
/* Managers were kept as free text on the board — "8:30-6PM", "BELLS(USED)", "OFF".
   Two of the rows came through as dates because Excel read "7-4" and "10-7" as
   one; those are a 7am and a 10am start. Read the intent, keep the original
   wording on the cell so nothing is lost. */
function mgrStateFrom(txt){
  var t=String(txt||"").trim();
  if (!t) return "";
  if (/off/i.test(t))    return "off";
  if (/bells?/i.test(t)) return "bells";
  if (/close/i.test(t))  return "close";
  var hr=t.match(/^(\d{1,2})\/(\d{1,2})\/\d{2}$/);
  if (hr) return (+hr[1] <= 8) ? "open" : "close";
  var lead=t.match(/^(\d{1,2})/);
  if (lead) return (+lead[1] <= 8) ? "open" : "close";
  return "open";
}
function mgrDeskFrom(vals){
  var txt=vals.join(" ");
  var hasNew=/new/i.test(txt), hasUsed=/used/i.test(txt);
  return hasNew && hasUsed ? "Both" : hasNew ? "New" : hasUsed ? "Used" : "";
}
function seedMgrShifts(){
  var SC=S("SCHEDULE"), start=-1;
  for (var q=0;q<SC.length;q++) if (String(at(SC,q,0)).trim().toUpperCase()==="WHO?"){ start=q; break; }
  var out=[];
  if (start<0) return out;
  for (var m=start+1;m<SC.length;m++){
    var nm=String(at(SC,m,0)).trim();
    if (!nm) break;
    var vals=DAYS.map(function(d,i){ return String(at(SC,m,i+1)||"").trim(); });
    var assign={}, raw={};
    DAYS.forEach(function(d,i){
      var st=mgrStateFrom(vals[i]);
      if (st) assign[d[0]]=st;
      if (vals[i]) raw[d[0]]=vals[i];
    });
    out.push({id:"mg-"+nm.replace(/[^A-Za-z0-9]/g,"").toUpperCase(), name:nm,
      desk:mgrDeskFrom(vals), assign:assign, raw:raw, _u:SEED_TS});
  }
  return out;
}
/* There is no finance schedule anywhere in the workbook, so only the names can be
   seeded. Two lists disagree: the TEAM tab's FIN MANAGER block (Fernando, Julian,
   Bassam, Mike) is stale and shares names with the sales roster, while the June
   dashboard's finance PVR line reads Bassam, Willie, Ethan. Take the names that
   appear on the current line and in the extension list, leave the week blank. */
/* Names, products and goals come from CENTRAL_FI_LOG. Each manager carries a
   personal gross goal; the department goal sits in settings. */
function seedFinShifts(){
  return ["BASSAM","ETHAN","WILLIE","JESSE"].map(function(nm){
    return {id:"fin-"+nm, name:nm, assign:{}, goal:125000, _u:SEED_TS};
  });

/* The workbook records time off as loose text — "4/21-4/26" with no year, next to
   proper dates. Parse what is unambiguous, assume the plan year for the rest, and
   flag the assumptions so they can be corrected rather than silently trusted. */
var PLAN_YEAR = 2026;
function parseRange(txt){
  var t = String(txt||"").trim();
  if (!t) return null;
  var m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m){
    var y=+m[3]; if (y<100) y+=2000;
    var iso = y+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0");
    return {start:iso, end:iso, assumed:false};
  }
  m = t.match(/^(\d{1,2})\/(\d{1,2})\s*[-\u2013]\s*(\d{1,2})\/(\d{1,2})$/);
  if (m){
    return {
      start: PLAN_YEAR+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0"),
      end:   PLAN_YEAR+"-"+String(+m[3]).padStart(2,"0")+"-"+String(+m[4]).padStart(2,"0"),
      assumed:true
    };
  }
  m = t.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (m){
    var one = PLAN_YEAR+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0");
    return {start:one, end:one, assumed:true};
  }
  return null;
}

/* The store is closed Sundays, and Christmas Day regardless of what day of
   the week it falls on — same rule the workbook used for selling days. */
function sellingDays(key, upto){
  var y=+key.slice(0,4), m=+key.slice(5,7);
  var last = new Date(y, m, 0).getDate();
  var end = upto || last, n = 0;
  for (var d=1; d<=Math.min(end,last); d++){
    var isSunday = new Date(y, m-1, d).getDay() === 0;
    var isChristmas = (m===12 && d===25);
    if (!isSunday && !isChristmas) n++;
  }
  return n;
}
function elapsedFor(key){
  var now = new Date();
  var nowKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  if (key > nowKey) return 0;
  if (key < nowKey) return sellingDays(key);
  return sellingDays(key, now.getDate()-1);
}
/* For the month currently in progress, elapsed/remaining track today's real

/* Where this page can save depends entirely on how it was opened.
   Inside Claude there is a workspace store. Opened as a downloaded file or from
   your own server there isn't, and the browser's own storage is the right place.
   Detect, don't assume — getting this wrong loses a day of entries silently. */
function makeDriver(){
  if (window.storage && typeof window.storage.get === "function"){
    return { kind:"claude", label:"in this workspace",
      get:function(k){ return window.storage.get(k).then(function(r){ return r && r.value; }); },
      set:function(k,v){ return window.storage.set(k,v); } };
  }
  try {
    var probe="__cc_probe__";
    window.localStorage.setItem(probe,"1");
    window.localStorage.removeItem(probe);
    return { kind:"browser", label:"on this computer",
      get:function(k){ return Promise.resolve(window.localStorage.getItem(k)); },
      set:function(k,v){
        return new Promise(function(res,rej){
          try { window.localStorage.setItem(k,v); res(true); } catch(e){ rej(e); }
        });
      } };
  } catch(e){}
  return { kind:"none", label:"nowhere",
    get:function(){ return Promise.resolve(null); },
    set:function(){ return Promise.reject(new Error("no storage available")); } };
}
var DRIVER = makeDriver();

/* Who is sitting at this machine. Kept locally and sent with each sync so the
   audit tab on the shared sheet means something. Deliberately not part of the
   synced state — it describes the device, not the data. */
var WHO_KEY = "central-command-center-who";
function whoAmI(){
  try {
    if (DRIVER.kind === "browser"){
      var v = window.localStorage.getItem(WHO_KEY);
      if (v) return v;
    }
  } catch(e){}
  return (typeof ST !== "undefined" && ST._who) ? ST._who : "";
}
function setWhoAmI(v){

}

/* With privacy mode on a full name is reduced the moment it is saved, so the
   shortened form is what lands in the browser copy and the shared sheet alike.
   There is no full name sitting anywhere to leak. */
function maskName(v){
  var t = String(v||"").trim();
  if (!t) return "";
  var parts = t.split(/\s+/);
  if (parts.length === 1) return parts[0];
  return parts[parts.length-1] + ", " + parts[0].charAt(0) + ".";
}
function applyPrivacy(v){
  return (typeof ST !== "undefined" && ST.settings && ST.settings.privacy) ? maskName(v) : v;
}

var Persist = {
  key: "central-command-center-v1",
  driver: DRIVER,
  available: DRIVER.kind !== "none",
  timer: null,
  status: "loading",
  pending: false,

  load: function(done){
    var self = this;
    if (!this.available){ this.set("none"); done(false); return; }
    this.driver.get(this.key).then(function(val){
      if (val){
        try{
          var saved = JSON.parse(val);
          if (saved && saved.v === 1 && Array.isArray(saved.deals)){
            ST = saved;
            ST.settings = Object.assign(seedSettings(), ST.settings || {});
            migrate();
            self.set("saved"); done(true); return;
          }
        }catch(e){}
      }
      // nothing stored yet — write the seed so the first visit is already safe
      self.write(function(){ self.set("saved"); done(false); });
    }).catch(function(){
      self.write(function(){ self.set("saved"); done(false); });
    });
  },

  save: function(now){
    if (!this.available){ this.set("none"); return; }
    var self = this;
    this.pending = true;
    this.set("dirty");
    clearTimeout(this.timer);
    if (now){ this.write(); return; }
    this.timer = setTimeout(function(){ self.write(); }, 300);
  },

  // flush without waiting for the debounce — used when the tab is hidden or closing
  flush: function(){
    if (!this.available || !this.pending) return;
    clearTimeout(this.timer);
    this.write();
  },

  write: function(after){
    var self = this;
    ST.savedAt = new Date().toISOString();
    var payload;
    try { payload = JSON.stringify(ST); }
    catch(e){ this.set("error"); return; }
    this.driver.set(this.key, payload).then(function(){
      self.pending = false; self.set("saved"); if (after) after();
    }).catch(function(){
      self.set("error"); if (after) after();
    });
  },

  bytes: function(){
    try { return JSON.stringify(ST).length; } catch(e){ return 0; }
  },

  set: function(st){
    this.status = st;
    var el = document.getElementById("savepill");
    if (!el) return;
    el.className = "savepill" + (st==="dirty" ? " dirty" : (st==="none"||st==="error") ? " none" : "");
    var when = ST.savedAt ? new Date(ST.savedAt) : null;
    var stamp = when && !isNaN(when)
      ? when.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})
      : "";
    var main =
        st==="saved" ? "Saved"
      : st==="dirty" ? "Saving\u2026"
      : st==="error" ? "Save failed"
      : st==="none"  ? "Not saving"
      : "Loading\u2026";
    var sub =
        st==="saved" ? (stamp ? stamp+" \u00b7 "+DRIVER.label : DRIVER.label)
      : st==="error" ? "export a backup now"
      : st==="none"  ? "export before you close"
      : "";
    el.querySelector("span").innerHTML = main + (sub ? '<small>'+esc(sub)+'</small>' : "");
  }
};

/* ============================================================
   SYNC — shared log across managers
   One record per deal / unit / we-owe, each with its own timestamp.
   Two managers adding different deals never overwrite each other;
   only the same record edited twice resolves last-write-wins.
   ============================================================ */
var Sync = {
  busy:false, msg:"", ok:null, timer:null, poll:null,

  cfg: function(){
    ST.sync = ST.sync || {url:"", token:"", auto:true, lastSync:null, lastPush:null};
    return ST.sync;
  },
  on: function(){ return !!String(this.cfg().url||"").trim(); },

  records: function(since){
    var out=[], cut = since || "";
    function add(k,t,o,extra){
      if (!o._u || o._u <= cut) return;
      out.push({k:k, t:t, u:o._u, d: extra ? Object.assign({}, o, extra) : o});
    }
    ST.deals.forEach(function(d){ add("deal:"+d.id, "deal", d); });
    ST.owes.forEach(function(x){ add("owe:"+x.id, "owe", x); });
    ST.recon.forEach(function(x){ add("recon:"+x.id, "recon", x); });
    ST.roster.forEach(function(x){ add("spec:"+x.id, "spec", x); });
    (ST.months||[]).forEach(function(m){ add("month:"+m.id, "month", m); });
    (ST.schedule||[]).forEach(function(x){ add("sched:"+x.id, "sched", x); });
    (ST.schedPeople||[]).forEach(function(x){ add("schedp:"+x.id, "schedp", x); });
    (ST.mgrShifts||[]).forEach(function(x){ add("mgr:"+x.id, "mgr", x); });
    (ST.finShifts||[]).forEach(function(x){ add("fin:"+x.id, "fin", x); });
    (ST.directory||[]).forEach(function(x){ add("dir:"+x.id, "dir", x); });
    (ST.staff||[]).forEach(function(x){ add("staff:"+x.id, "staff", x); });
    (ST.timeOff||[]).forEach(function(x){ add("off:"+x.id, "off", x); });
    (ST.lots||[]).forEach(function(x){ add("lot:"+x.id, "lot", x); });
    (ST.units||[]).forEach(function(x){ add("unit:"+x.id, "unit", x); });
    (ST.stores||[]).forEach(function(x){ add("store:"+x.id, "store", x); });
    (ST.cpo||[]).forEach(function(x){ add("cpo:"+x.id, "cpo", x); });
    (ST.finPvr||[]).forEach(function(x){ add("finpvr:"+x.id, "finpvr", x); });
    ST.aging.forEach(function(bl){
      (bl.rows||[]).forEach(function(r){ add("age:"+r.id, "age", r, {_block: bl.label}); });
    });
    if (ST.settings._u && ST.settings._u > cut) out.push({k:"settings", t:"settings", u:ST.settings._u, d:ST.settings});
    return out;
  },

  apply: function(recs){
    var changed = 0;
    (recs||[]).forEach(function(r){
      if (!r || !r.d) return;
      var d = r.d;
      function into(arr){
        var i = arr.findIndex(function(x){ return x.id===d.id; });
        if (i < 0){ arr.push(d); changed++; return; }
        if (!arr[i]._u || (d._u||"") > arr[i]._u){ arr[i]=d; changed++; }
      }
      if (r.t==="deal") into(ST.deals);
      else if (r.t==="owe") into(ST.owes);
      else if (r.t==="recon") into(ST.recon);
      else if (r.t==="spec") into(ST.roster);
      else if (r.t==="month"){ ST.months = ST.months || []; into(ST.months); }
      else if (r.t==="sched") into(ST.schedule);
      else if (r.t==="schedp") into(ST.schedPeople);
      else if (r.t==="mgr") into(ST.mgrShifts);
      else if (r.t==="fin") into(ST.finShifts);
      else if (r.t==="dir") into(ST.directory);
      else if (r.t==="staff") into(ST.staff);
      else if (r.t==="off") into(ST.timeOff);
      else if (r.t==="lot") into(ST.lots);
      else if (r.t==="unit") into(ST.units);
      else if (r.t==="store") into(ST.stores);
      else if (r.t==="cpo") into(ST.cpo);
      else if (r.t==="finpvr") into(ST.finPvr);
      else if (r.t==="age"){
        var lab = d._block || "Current list";
        var bl = ST.aging.filter(function(b){ return b.label===lab; })[0];
        if (!bl){ bl={label:lab, rows:[]}; ST.aging.push(bl); }
        into(bl.rows);
      }
      else if (r.t==="settings"){
        if (!ST.settings._u || (d._u||"") > ST.settings._u){ ST.settings=d; changed++; }
      }
    });
    return changed;
  },

  post: function(body, ms){
    var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var t = ctl ? setTimeout(function(){ ctl.abort(); }, ms || 90000) : null;
    return fetch(String(this.cfg().url).trim(), {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(body),
      signal: ctl ? ctl.signal : undefined
    }).then(function(r){ if(t) clearTimeout(t); return r.json(); })
      .catch(function(e){
        if(t) clearTimeout(t);
        throw new Error(e && e.name==="AbortError" ? "the sheet did not answer in time" : "could not reach the sheet");
      });
  },

  run: function(done){
    var self=this, c=this.cfg();
    if (!this.on() || this.busy){ if(done) done(); return; }
    this.busy=true; this.ok=null;

    var pushedAt = new Date().toISOString();
    var push = this.records(c.lastPush || "");
    var since = c.lastSync || "";

    // A first connection has ~1,600 records to upload. Sent as one request it
    // reads as a hang; sent in chunks it reports progress and cannot time out.
    var SIZE = 300, chunks = [];
    for (var i=0; i<push.length; i+=SIZE) chunks.push(push.slice(i, i+SIZE));
    if (!chunks.length) chunks = [[]];

    var sent = 0;
    function step(i){
      var lastOne = (i === chunks.length-1);
      if (!lastOne){
        self.msg = "Uploading " + (sent + chunks[i].length) + " of " + push.length + "\u2026";
      } else if (push.length > SIZE){
        self.msg = "Uploaded " + push.length + " \u00b7 checking for updates\u2026";
      } else {
        self.msg = "Syncing\u2026";
      }
      self.paint();

      return self.post({
        token: c.token || "",
        who: whoAmI(),
        since: lastOne ? since : "",
        quiet: !lastOne,
        records: chunks[i]
      }).then(function(res){
        if (!res || res.error) throw new Error(res && res.error ? res.error : "no response");
        sent += chunks[i].length;
        if (!lastOne) return step(i+1);

        var n = self.apply(res.records);
        c.lastSync = res.now || new Date().toISOString();
        c.lastPush = pushedAt;
        self.busy = false; self.ok = true;
        self.msg = "Synced" + (n ? " \u00b7 "+n+" in" : "") + (push.length ? " \u00b7 "+push.length+" out" : "");
        Persist.save(true);
        if (n) rebuildAll(); else self.paint();
        if (done) done();
      });
    }

    step(0).catch(function(err){
      self.busy=false; self.ok=false;
      self.msg = "Sync failed \u2014 " + (err && err.message ? err.message : "check the link");
      self.paint(); if (done) done();
    });
  },

  nudge: function(){
    var self=this;
    if (!this.on() || !this.cfg().auto) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(function(){ self.run(); }, 2000);
  },
  start: function(){
    var self=this;
    clearInterval(this.poll);
    if (!this.on() || !this.cfg().auto) return;
    // Two minutes, not seconds. Your own edits still push ~2s after you make them;
    // this is only how fast you see everyone else's. Apps Script caps total script
    // runtime per day (90 min on a personal Google account, 6 hr on Workspace), and
    // a tighter loop across four or five managers burns through it by mid-afternoon.
    this.poll = setInterval(function(){
      if (document.visibilityState !== "hidden") self.run();
    }, 120000);
  },
  paint: function(){
    var el=document.getElementById("syncpill"); if(!el) return;
    if (!this.on()){ el.style.display="none"; return; }
    el.style.display="";
    el.className = "savepill" + (this.busy ? " dirty" : this.ok===false ? " none" : "");
    var when = this.cfg().lastSync ? new Date(this.cfg().lastSync) : null;
    var stamp = when && !isNaN(when) ? when.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : "";
    el.querySelector("span").innerHTML = "Team log" +
      '<small>'+esc(this.msg || (stamp ? "synced "+stamp : "not synced yet"))+'</small>';
  }
};

   5. DERIVED NUMBERS
   ============================================================ */
function credits(d){
  var a=String(d.s1||"").trim(), b=String(d.s2||"").trim();
  if (a && b && a!==b) { var o={}; o[a]=0.5; o[b]=0.5; return o; }
  if (a) { var p={}; p[a]=1; return p; }
  if (b) { var q={}; q[b]=1; return q; }
  return {};
}
function people(d){
  var a=String(d.s1||"").trim(), b=String(d.s2||"").trim(), r=[];
  if (a) r.push(a);
  if (b && b!==a) r.push(b);
  return r;
}
function dealGross(d){ return (n(d.front)||0) + (n(d.back)||0); }

/* CAC and Choice count fully for the store and for the salesperson who wrote
   them. They are simply not the finance desk's to answer for, so they come out
   of F&I per-unit gross and every penetration percentage and nowhere else.
   Kept as a setting so the list can change without a rebuild. */
function fiExcludedTypes(){
  var v = ST.settings && ST.settings.nonRetail;
  return (v && v.length) ? v : [];
}
function countsForFI(d){
  return fiExcludedTypes().indexOf(String(d.type||"").toUpperCase().trim()) < 0;
}
function fiDeals(){ return ACT().deals.filter(countsForFI); }
function fiExcluded(){ return ACT().deals.filter(function(d){ return !countsForFI(d); }); }

function derive(){
  var D = ACT().deals, per = {};
  function P(nm){
    if (!per[nm]) per[nm] = {name:nm, tU:0,tG:0, nU:0,nG:0, uU:0,uG:0, bNum:0,bDen:0};
    return per[nm];
  }
  ACT().roster.forEach(function(r){ P(r.name); });

  var t={u:0,g:0}, nw={u:0,g:0}, us={u:0,g:0};
  var bAll={num:0,den:0}, bN={num:0,den:0}, bU={num:0,den:0};

  D.forEach(function(d){
    var g = dealGross(d), isNew = d.kind==="New";
    var yes = String(d.adv||"").toUpperCase()==="YES";
    var cpo = String(d.type||"").toUpperCase()==="CPO";
    t.u++; t.g+=g;
    (isNew?nw:us).u++; (isNew?nw:us).g+=g;

    // store Beasley: denominator is every new deal plus every used CPO
    if (yes){ bAll.num++; (isNew?bN:bU).num++; }
    if (isNew){ bAll.den++; bN.den++; }
    else if (cpo){ bAll.den++; bU.den++; }

    var cr = credits(d);
    Object.keys(cr).forEach(function(nm){
      var p=P(nm), c=cr[nm];
      p.tU+=c; p.tG+=g*c;
      if (isNew){ p.nU+=c; p.nG+=g*c; } else { p.uU+=c; p.uG+=g*c; }
    });
    // per-person Beasley counts whole deals, not split credit
    people(d).forEach(function(nm){
      var p=P(nm);
      if (yes) p.bNum++;
      if (isNew || cpo) p.bDen++;
    });
  });

  var teamOf={}, teamRec={};
  ACT().roster.forEach(function(r){ teamOf[r.name]=r.team; teamRec[r.name]=r; });
  var elapsed = Math.max(1, liveDaysElapsed()||1), total = liveDaysTotal()||ST.settings.daysTotal||1;
  var list = Object.keys(per).map(function(k){
    var p=per[k];
    p.team = teamOf[k] || (p.nU>=p.uU ? "New" : "Used");
    p.tP = p.tU ? p.tG/p.tU : null;
    p.nP = p.nU ? p.nG/p.nU : null;
    p.uP = p.uU ? p.uG/p.uU : null;
    p.bPct = p.bDen ? p.bNum/p.bDen*100 : null;
    var rec = teamRec[k];
    p.goal = rec && rec.goal != null ? rec.goal : null;
    p.togo = p.goal == null ? null : Math.max(0, p.goal - p.tU);
    p.pct  = p.goal ? p.tU / p.goal * 100 : null;
    // where they should be by now, given how much of the month has gone
    p.onPace = p.goal == null ? null : Math.round(p.tU / Math.max(1, elapsed) * total);
    p.vsGoal = p.onPace == null ? null : p.onPace - p.goal;
    return p;
  });

  var s=ST.settings, el=Math.max(1, liveDaysElapsed()||1), tot=liveDaysTotal()||s.daysTotal||1;
  function pace(x){ return Math.round(x/el*tot); }
  return {
    units:t.u, gross:t.g, newU:nw.u, newG:nw.g, usedU:us.u, usedG:us.g,
    pvr: t.u?t.g/t.u:0, pvrN: nw.u?nw.g/nw.u:0, pvrU: us.u?us.g/us.u:0,
    paceT: pace(t.u), paceN: pace(nw.u), paceU: pace(us.u), paceG: t.g/el*tot,
    bAll: bAll.den?bAll.num/bAll.den*100:null, bAllR:bAll,
    bN: bN.den?bN.num/bN.den*100:null, bNR:bN,
    bU: bU.den?bU.num/bU.den*100:null, bUR:bU,
    per: list
  };
}

function monthSummary(deals, meta){
  var u=deals.length, g=0, nu=0, ng=0, uu=0, ug=0, bn=0, bd=0;
  deals.forEach(function(d){
    var x=dealGross(d), isNew=d.kind==="New";
    g+=x; if(isNew){nu++; ng+=x;} else {uu++; ug+=x;}
    if (String(d.adv||"").toUpperCase()==="YES") bn++;
    if (isNew || String(d.type||"").toUpperCase()==="CPO") bd++;
  });
  return {units:u, gross:g, newU:nu, newG:ng, usedU:uu, usedG:ug,
          pvr:u?g/u:0, beas:bd?bn/bd*100:null, meta:meta||{}};
}
function closeMonth(next){
  var key = ST.settings.monthKey, label = ST.settings.monthLabel;
  var moving = ACT().deals;
  moving.forEach(function(d){ d._arch = key; stamp(d); });
  ST.months = ST.months || [];
  ST.months.push(stamp({
    id: key, label: label, closedAt: new Date().toISOString(), count: moving.length,
    goalTotal: ST.settings.goalTotal, goalNew: ST.settings.goalNew, goalUsed: ST.settings.goalUsed,
    daysTotal: ST.settings.daysTotal, csi3: ST.settings.csi3, csiMonth: ST.settings.csiMonth
  }));
  ST.settings = stamp(Object.assign({}, ST.settings, {
    monthKey: next.monthKey, monthLabel: next.monthLabel,
    daysTotal: next.daysTotal, daysElapsed: next.daysElapsed,
    goalTotal: next.goalTotal, goalNew: next.goalNew, goalUsed: next.goalUsed,
    csiMonth: null
  }));
  return moving.length;
}

          (x.ph?' placeholder="'+esc(x.ph)+'"':'')+'>'+esc(v==null?"":v)+'</textarea>';
      } else {
        input = '<input id="'+id+'" data-k="'+x.k+'" type="'+(x.type||"text")+'"'+
          (x.type==="number"?' step="0.01"':'')+
          ' value="'+esc(v==null?"":v)+'"'+(x.ph?' placeholder="'+esc(x.ph)+'"':'')+'>';
      }

    }).join("")+'</div>'+
    '<div class="boxfoot">'+
      (cfg.onDelete?'<button class="btn danger" id="fDel">Delete</button>':'')+
      '<span class="err-msg" id="fErr"></span>'+
      '<span class="right"><button class="btn" id="fCancel">Cancel</button>'+
      '<button class="btn primary" id="fSave">'+esc(cfg.saveLabel||"Save")+'</button></span>'+
    '</div>';
  modal.classList.add("on");

  function read(){
    var o = Object.assign({}, cfg.value);
    f.forEach(function(x){
      if (x.type==="calc") return;
      var el=box.querySelector("#f_"+x.k); if(!el) return;
      if (x.type==="check") o[x.k] = el.value==="yes";
      else if (x.type==="number") o[x.k] = el.value===""?null:parseFloat(el.value);
      else o[x.k] = el.value;
    });

  function refresh(){
    if (cfg.live) cfg.live(read(), box);
  }
  box.querySelectorAll("input,select").forEach(function(el){ el.addEventListener("input",refresh); el.addEventListener("change",refresh); });

  box.querySelector("#fCancel").addEventListener("click", closeModal);

    var o = read();
    var msg = cfg.validate ? cfg.validate(o) : null;
    if (msg){ box.querySelector("#fErr").textContent = msg; return; }
    pushUndo(); cfg.onSave(o); closeModal(); touch();
  });
  if (cfg.onDelete){
    box.querySelector("#fDel").addEventListener("click", function(){
      if (!window.confirm(cfg.deleteMsg || "Delete this record?")) return;
      pushUndo(); cfg.onDelete(); closeModal(); touch();
    });
  }
  var first = box.querySelector("input,select"); if(first) first.focus();
}

function tableSort(tbl,getRows,render){
  var key=null, dir=-1;
  tbl.querySelectorAll("th.sortable").forEach(function(th){
    th.tabIndex=0;
    function go(){
      var k=th.getAttribute("data-k");
      if (k===key) dir=-dir; else { key=k; dir = th.getAttribute("data-t")==="s"?1:-1; }
      tbl.querySelectorAll("th.sortable").forEach(function(o){o.removeAttribute("aria-sort");});
      th.setAttribute("aria-sort", dir===1?"ascending":"descending");
      var rows=getRows().slice();
      rows.sort(function(a,b){
        var av=a[key], bv=b[key];
        if (typeof av==="string"||typeof bv==="string"){
          av=String(av==null?"":av).toUpperCase(); bv=String(bv==null?"":bv).toUpperCase();
          return av<bv?dir:av>bv?-dir:0;
        }
        if (av==null) return 1; if (bv==null) return -1;
        return (av-bv)*dir;
      });
      render(rows);
    }
    th.addEventListener("click",go);
    th.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} });
  });
}
function download(name, text, mime){
  var blob=new Blob([text],{type:mime||"application/json"});
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },100);
}
function csv(rows){
  return rows.map(function(r){ return r.map(function(c){
    var s=String(c==null?"":c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(","); }).join("\n");
}

/* ---- daily build ---- */
function todayISO(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function monthOfLog(){
  var tally={};
  ACT().deals.forEach(function(d){ if(d.date) tally[d.date.slice(0,7)]=(tally[d.date.slice(0,7)]||0)+1; });
  var best=null;
  Object.keys(tally).forEach(function(k){ if(!best||tally[k]>tally[best]) best=k; });
  return best || todayISO().slice(0,7);
}
function dayChart(){
  var ym = monthOfLog();
  var y = +ym.slice(0,4), mo = +ym.slice(5,7);
  var last = new Date(y, mo, 0).getDate();
  var by = {};
  ACT().deals.forEach(function(d){
    if (!d.date || d.date.slice(0,7)!==ym) return;
    var day = +d.date.slice(8,10);
    by[day] = by[day] || {u:0,g:0,n:0};
    by[day].u++; by[day].g += dealGross(d);
    if (d.kind==="New") by[day].n++;
  });
  var days=[];
  for (var i=1;i<=last;i++) days.push(Object.assign({d:i, u:0,g:0,n:0}, by[i]||{}));
  var max = Math.max.apply(null, days.map(function(x){return x.u;})) || 1;
  var need = ST.settings.daysTotal ? (ST.settings.goalTotal/ST.settings.daysTotal) : 0;
  var W=640, H=160, padL=26, padR=8, padT=16, padB=22;
  var iw = (W-padL-padR)/days.length;
  var bw = Math.max(3, iw-2.5);
  var scale = (H-padT-padB)/Math.max(max, need*1.15);
  var tISO = todayISO(), tDay = (tISO.slice(0,7)===ym) ? +tISO.slice(8,10) : -1;

  var bars = days.map(function(x,i){
    var h = x.u*scale, xx = padL+i*iw+(iw-bw)/2, yy = H-padB-h;
    var lab = ym+"-"+String(x.d).padStart(2,"0");
    return (x.u ? '<rect class="dc-bar'+(x.d===tDay?" today":"")+'" x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+
      '" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'"><title>'+showDate(lab)+' — '+x.u+
      ' units, '+money(x.g)+'</title></rect>' : '') +
      ((x.d%5===0||x.d===1||x.d===last) ? '<text class="dc-lab" x="'+(padL+i*iw+iw/2).toFixed(1)+
        '" y="'+(H-8)+'" text-anchor="middle">'+x.d+'</text>' : '');
  }).join("");
  var ry = H-padB-need*scale;
  var maxLab = '<text class="dc-lab" x="2" y="'+(H-padB-max*scale+8).toFixed(1)+'">'+max+'</text>';
  var rule = need ? '<line class="dc-rule" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+ry.toFixed(1)+'" y2="'+ry.toFixed(1)+'"/>'+
    '<text class="dc-lab" x="'+(W-padR)+'" y="'+(ry-4).toFixed(1)+'" text-anchor="end">'+need.toFixed(1)+'/day to goal</text>' : "";
  var beat = days.filter(function(x){ return x.u>=need; }).length;
  var sold = days.filter(function(x){ return x.u>0; }).length;

  return '<div class="daychart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Units written each day this month">'+
    rule+maxLab+bars+'</svg>'+
    '<div class="dc-key"><span><i style="background:var(--soul)"></i>Units written</span>'+
    (tDay>0?'<span><i style="background:var(--go)"></i>Today</span>':'')+
    '<span>'+beat+' of '+sold+' days at or above the '+need.toFixed(1)+' needed</span></div></div>';
}

function vCommand(){

    {label:"Used units",  actual:M.usedU, pace:M.paceU, goal:s.goalUsed}
  ];
  function verdict(p,g){ var r=g?p/g:0; return r>=1?{c:"go",w:"clears goal"}:r>=.95?{c:"hold",w:"within reach"}:{c:"miss",w:"short of goal"}; }
  var pace = bars.map(function(d){
    var v=verdict(d.pace,d.goal), gap=d.goal-d.pace, pct=d.goal?Math.min(100,d.actual/d.goal*100):0;
    return '<div class="pace-row"><div class="pace-top">'+
